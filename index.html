<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Frost Camp Animated</title>
<style>
:root{--p:rgba(24,48,70,.88);--l:rgba(255,255,255,.22);--g:#52df73}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dff5ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 3px #0004}
.resources{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;display:grid;grid-template-columns:repeat(2,82px);gap:5px}
.res{height:38px;backdrop-filter:blur(9px);background:var(--p);border:1px solid var(--l);border-radius:12px;display:flex;align-items:center;gap:7px;padding:0 8px;font-weight:900}
.res span{font-size:16px}.res b{margin-left:auto}
.left{position:absolute;left:10px;top:max(10px,env(safe-area-inset-top));width:min(210px,52vw);display:grid;gap:7px}
.card,.event,.status,.upgradeBtn{background:var(--p);border:1px solid var(--l);border-radius:13px;padding:9px 10px;box-shadow:0 7px 18px #17334c22}
.card{font-size:12px;font-weight:900;overflow:hidden}.sub{font-size:9px;opacity:.68;margin-top:4px;font-weight:800}.levelChip{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:999px;background:#ffffff1c;border:1px solid #ffffff1c;font-size:9px;font-weight:950;margin-left:auto}.bar{height:5px;background:#ffffff22;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#54e879,#baff74);width:0}
.event{pointer-events:auto;width:max-content;background:linear-gradient(#ffc94d,#ef9917);border:0;color:#fff;font-weight:950;cursor:pointer}
.statuses{position:absolute;right:10px;top:max(96px,calc(env(safe-area-inset-top) + 86px));display:grid;gap:6px}
.status{width:100px;backdrop-filter:blur(8px);font-size:9px;font-weight:900;padding:7px 8px}.status .bar{margin-top:4px}
.upgradeBtn{pointer-events:auto;color:#fff;font-size:11px;font-weight:900;cursor:pointer}
.joy{position:absolute;left:18px;bottom:max(20px,env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;background:#33536b22;border:2px solid #ffffff55;pointer-events:auto}
.stick{position:absolute;left:31px;top:31px;width:48px;height:48px;border-radius:50%;background:#fffffff0;box-shadow:0 5px 14px #18354844}
.screenFlash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,#fff8 0,#8ee8ff22 45%,transparent 72%);opacity:0;transition:opacity .16s}.screenFlash.show{opacity:1}
.toast{position:absolute;left:50%;top:18%;transform:translate(-50%,-8px);opacity:0;background:#183047e8;padding:8px 12px;border-radius:99px;font-size:12px;font-weight:900;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
.start,.modalWrap{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:linear-gradient(#caecf955,#eafaffdd)}
.panel{width:min(390px,92vw);background:#fffffff2;color:#18344b;border-radius:24px;padding:20px;box-shadow:0 22px 60px #153d5b33}
.logo{text-align:center;font-size:32px;font-weight:1000;letter-spacing:-1px;margin-bottom:18px}.logo span{display:block;font-size:16px;color:#e9a711}
.play,.green{width:100%;border:0;border-radius:14px;background:linear-gradient(#4bdf6b,#24b94c);color:#fff;font-weight:950;padding:13px;cursor:pointer}
.modalWrap{display:none;background:#10253666;z-index:30}.panel h2{margin:0 0 5px}.panel p{font-size:12px;opacity:.7}.close{border:0;border-radius:12px;background:#e6eef3;color:#355168;font-weight:900;padding:10px 12px;cursor:pointer}
.buttons{display:flex;gap:8px;margin-top:12px}.buttons .green{flex:1}.green:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.up{background:#eef5f9;border-radius:13px;padding:10px}.up b,.up small{display:block}.up small{font-size:10px;opacity:.65;margin:4px 0 8px}.up button{width:100%;font-size:11px;padding:9px}
.buildingToast{position:absolute;left:50%;bottom:max(150px,calc(env(safe-area-inset-bottom) + 130px));transform:translateX(-50%);background:#ffffffed;color:#27445a;border-radius:16px;padding:9px 12px;box-shadow:0 10px 28px #17344a25;font-size:11px;font-weight:900;text-shadow:none;opacity:0;transition:.2s;white-space:nowrap}.buildingToast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.offline{display:none;background:#eef6fa;border-radius:12px;padding:10px;font-size:11px;line-height:1.4;margin-bottom:12px}
.pc{display:none;position:absolute;left:12px;bottom:10px;color:#34536a;font-size:10px;font-weight:800;text-shadow:none}
@media(pointer:fine){.joy{display:none}.pc{display:block}}
@media(min-width:700px){.resources{display:flex}.left{width:230px}.statuses{top:62px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
 <div class="resources">
  <div class="res"><span>💵</span><b id="money">0</b></div>
  <div class="res"><span>🪵</span><b id="wood">0</b></div>
  <div class="res"><span>🪨</span><b id="stone">0</b></div>
  <div class="res"><span>🥩</span><b id="meat">0</b></div>
 </div>
 <div class="left">
  <div class="card"><div class="row"><div id="quest">Kampı geliştir</div><span id="levelChip" class="levelChip">LV.1</span></div><div id="questSub" class="sub">Yeni yapılar aç</div><div class="bar"><i id="questBar"></i></div></div>
  <button id="eventBtn" class="event">🎁 ETKİNLİK <b id="eventTimer">15:00</b></button>
 </div>
 <div class="statuses">
  <div class="status">🍗 TOKLUK <b id="hungerText">100</b><div class="bar"><i id="hungerBar" style="width:100%;background:linear-gradient(90deg,#ff914d,#ffd259)"></i></div></div>
  <div class="status">🔥 ISI <b id="warmText">100</b><div class="bar"><i id="warmBar" style="width:100%;background:linear-gradient(90deg,#ff704f,#ffba3d)"></i></div></div>
  <button id="upgradeBtn" class="upgradeBtn">⬆️ GELİŞTİR</button>
 </div>
 <div id="joy" class="joy"><div id="stick" class="stick"></div></div>
 <div class="pc">WASD / Ok tuşları</div>
 <div id="screenFlash" class="screenFlash"></div><div id="toast" class="toast"></div><div id="buildingToast" class="buildingToast"></div>
</div>

<div id="start" class="start"><div class="panel">
 <div class="logo">FROST CAMP<span>IDLE SURVIVAL</span></div>
 <div id="offline" class="offline"></div>
 <button id="play" class="play">OYNA</button>
</div></div>

<div id="eventModal" class="modalWrap"><div class="panel">
 <h2 id="eventName">Etkinlik</h2><p id="eventDesc"></p>
 <div style="font-size:11px;font-weight:900;margin-top:14px"><span id="eventProgress"></span></div>
 <div class="bar" style="background:#dce8ef;height:8px"><i id="eventBar"></i></div>
 <div id="eventReward" style="margin-top:12px;background:#eef6fa;padding:10px;border-radius:12px;font-size:12px;font-weight:900"></div>
 <div class="buttons"><button id="eventClose" class="close">Kapat</button><button id="eventClaim" class="green" disabled>ÖDÜLÜ AL</button></div>
</div></div>

<div id="upgradeModal" class="modalWrap"><div class="panel">
 <h2>Geliştirmeler</h2><p>Para ile kalıcı güçlendirmeler satın al.</p>
 <div class="grid">
  <div class="up"><b>🪓 Balta</b><small id="axeTxt"></small><button id="axeBuy" class="green"></button></div>
  <div class="up"><b>🎒 Çanta</b><small id="bagTxt"></small><button id="bagBuy" class="green"></button></div>
  <div class="up"><b>👟 Bot</b><small id="bootTxt"></small><button id="bootBuy" class="green"></button></div>
  <div class="up"><b>🍲 Mutfak</b><small id="cookTxt"></small><button id="cookBuy" class="green"></button></div>
 </div>
 <div class="buttons"><button id="upgradeClose" class="close" style="width:100%">Kapat</button></div>
</div></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
window.onerror=(m)=>{document.title='ERROR: '+m};

const canvas=$('game'),ctx=canvas.getContext('2d');
let W=1,H=1,DPR=1,last=0,running=false,saveClock=0,incomeClock=0;
const C={x:1000,y:1000};
const player={x:1000,y:870,money:0,wood:0,stone:0,meat:0,hunger:100,warm:100,axe:0,bag:0,boot:0,cook:0,work:0};
const base={level:1,progress:0,cost:16};
const buildings=[
 {id:'lumber',name:'Oduncu Kulübesi',icon:'🪵',unlock:2,x:915,y:1080},
 {id:'hunter',name:'Avcı Kulübesi',icon:'🏹',unlock:3,x:1090,y:1080},
 {id:'kitchen',name:'Mutfak',icon:'🍲',unlock:4,x:1080,y:925},
 {id:'quarry',name:'Taş Ocağı',icon:'⛏️',unlock:5,x:900,y:925},
 {id:'store',name:'Depo',icon:'📦',unlock:6,x:1000,y:1135}
];
let workers=0,gameTime=0;
const trees=[],rocks=[],animals=[],crates=[];
const particles=[],floaters=[],footprints=[];
let shake=0,movePhase=0,wasMoving=false,lastFoot=0;
function particle(x,y,type,count=1){
 for(let i=0;i<count;i++)particles.push({x,y,type,t:0,life:type==='smoke'?1.8:type==='spark'?.75:.7,vx:rand(-28,28),vy:rand(-48,-14),size:rand(2,5)});
}
function floater(x,y,text){floaters.push({x,y,text,t:0,life:1.05})}
function flash(){const f=$('screenFlash');f.classList.add('show');setTimeout(()=>f.classList.remove('show'),150)}
function impact(x,y,type){shake=Math.max(shake,type==='stone'?4.5:3);particle(x,y,type==='stone'?'chip':'woodchip',type==='stone'?5:7)}
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function spawn(min,max){const a=Math.random()*Math.PI*2,r=rand(min,max);return{x:C.x+Math.cos(a)*r,y:C.y+Math.sin(a)*r}}
function initWorld(){
 for(let i=0;i<42;i++){const p=spawn(290,820);trees.push({x:p.x,y:p.y,hp:3,dead:0})}
 for(let i=0;i<18;i++){const p=spawn(470,850);rocks.push({x:p.x,y:p.y,hp:4,dead:0})}
 for(let i=0;i<10;i++){const p=spawn(340,790);animals.push({x:p.x,y:p.y,hp:i%3?2:3,max:i%3?2:3,type:i%3?'rabbit':'deer',dead:0,dir:rand(0,6.28),homeX:p.x,homeY:p.y})}
 for(let i=0;i<4;i++){const p=spawn(430,780);crates.push({x:p.x,y:p.y,open:false,t:0})}
}
function radius(){return Math.min(850,330+(base.level-1)*105)}
function storageBonus(){return base.level>=6?8:0}
function capWood(){return 22+player.bag*4+storageBonus()}
function capMeat(){return 10+player.bag*2+(base.level>=6?4:0)}
function capStone(){return 14+player.bag*2+storageBonus()}

const SAVE='frost_fixed_v1';
let offlineReward=null;
function load(){
 try{
  const s=JSON.parse(localStorage.getItem(SAVE)||'null');if(!s)return;
  Object.assign(player,s.player||{});Object.assign(base,s.base||{});workers=s.workers||0;
  const mins=Math.min(240,Math.floor((Date.now()-(s.at||Date.now()))/60000));
  if(mins>=2){offlineReward={money:mins*Math.max(1,workers)*2,wood:Math.floor(mins*Math.max(1,workers)*.35),meat:Math.floor(mins*Math.max(1,workers)*.05)};$('offline').style.display='block';$('offline').textContent=`Sen yokken +${offlineReward.money} 💵, +${offlineReward.wood} 🪵, +${offlineReward.meat} 🥩 üretildi.`}
 }catch(e){}
}
function save(){try{localStorage.setItem(SAVE,JSON.stringify({player,base,workers,at:Date.now()}))}catch(e){}}

const EVENT_MS=15*60*1000;
const defs=[
 {name:'Odun Hücumu',desc:'Odun topla.',metric:'wood',goal:24,reward:{money:100}},
 {name:'Av Sezonu',desc:'Et topla.',metric:'meat',goal:6,reward:{money:120,meat:2}},
 {name:'Kar Kaşifi',desc:'Haritada ilerle.',metric:'walk',goal:1400,reward:{money:90,wood:4}},
 {name:'Kamp Ustası',desc:'Kampa odun teslim et.',metric:'deposit',goal:20,reward:{money:110,stone:2}},
 {name:'Üretim Saati',desc:'Para üret.',metric:'earn',goal:25,reward:{money:130}}
];
let ev={slot:Math.floor(Date.now()/EVENT_MS),idx:0,progress:0,claimed:false};
function loadEv(){try{const s=JSON.parse(localStorage.getItem('frost_fixed_event')||'null');if(s)ev=s}catch(e){};syncEv()}
function saveEv(){try{localStorage.setItem('frost_fixed_event',JSON.stringify(ev))}catch(e){}}
function syncEv(){const slot=Math.floor(Date.now()/EVENT_MS);if(slot!==ev.slot){ev={slot,idx:Math.abs((slot*7+3)%defs.length),progress:0,claimed:false};saveEv()}}
function evAdd(metric,n){syncEv();const e=defs[ev.idx];if(!ev.claimed&&e.metric===metric){ev.progress=clamp(ev.progress+n,0,e.goal);saveEv()}}
function rewardText(r){return 'Ödül: '+Object.entries(r).map(([k,v])=>({money:'💵',wood:'🪵',stone:'🪨',meat:'🥩'}[k]+' '+v)).join('  ')}
function updateEvent(){
 syncEv();const e=defs[ev.idx],left=(ev.slot+1)*EVENT_MS-Date.now(),s=Math.max(0,Math.ceil(left/1000)),m=Math.floor(s/60),ss=String(s%60).padStart(2,'0');
 $('eventTimer').textContent=(!ev.claimed&&ev.progress>=e.goal)?'ÖDÜL HAZIR':`${m}:${ss}`;
 $('eventName').textContent=e.name;$('eventDesc').textContent=e.desc;$('eventProgress').textContent=`${Math.floor(ev.progress)} / ${e.goal}`;$('eventBar').style.width=(ev.progress/e.goal*100)+'%';$('eventReward').textContent=ev.claimed?'Ödül alındı. Yeni etkinlik sayaç sonunda.':rewardText(e.reward);$('eventClaim').disabled=ev.claimed||ev.progress<e.goal
}
$('eventBtn').onclick=()=>{$('eventModal').style.display='grid';updateEvent()};
$('eventClose').onclick=()=>$('eventModal').style.display='none';
$('eventClaim').onclick=()=>{const e=defs[ev.idx];if(ev.claimed||ev.progress<e.goal)return;for(const k in e.reward)player[k]+=e.reward[k];ev.claimed=true;saveEv();$('eventModal').style.display='none';toast('Etkinlik ödülü alındı')};

const costs={axe:80,bag:90,boot:100,cook:120};
function cost(k){return Math.round(costs[k]*Math.pow(1.65,player[k]))}
function updateUpgrades(){
 $('axeTxt').textContent=`Kesme hızı +${player.axe*15}%`;$('bagTxt').textContent=`Odun kapasitesi ${capWood()}`;$('bootTxt').textContent=`Hız +${player.boot*8}%`;$('cookTxt').textContent=`Et verimi x${(1+player.cook*.25).toFixed(2)}`;
 ['axe','bag','boot','cook'].forEach(k=>{$(k+'Buy').textContent='💵 '+cost(k);$(k+'Buy').disabled=player.money<cost(k)})
}
function buy(k){const c=cost(k);if(player.money<c)return;player.money-=c;player[k]++;updateUpgrades();save();toast('Geliştirme tamamlandı')}
['axe','bag','boot','cook'].forEach(k=>$(k+'Buy').onclick=()=>buy(k));
$('upgradeBtn').onclick=()=>{$('upgradeModal').style.display='grid';updateUpgrades()};
$('upgradeClose').onclick=()=>$('upgradeModal').style.display='none';

const keys={};addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k.startsWith('arrow'))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const joy=$('joy'),stick=$('stick');let jx=0,jy=0,jid=null;
function joyMove(x,y){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.28;let dx=x-cx,dy=y-cy,l=Math.hypot(dx,dy);if(l>max){dx=dx/l*max;dy=dy/l*max}jx=dx/max;jy=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);joyMove(e.clientX,e.clientY)});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)joyMove(e.clientX,e.clientY)});
function joyEnd(e){if(e.pointerId!==jid)return;jid=null;jx=jy=0;stick.style.transform='translate(0,0)'}joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);

function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
function scale(){return W<430?.86:W<700?.96:1.08}
let camX=0,camY=0;
function iso(x,y){const z=scale();return{x:((x-y)*.5-camX)*z+W/2,y:((x+y)*.25-camY)*z+H*.56}}
function shadow(x,y,rx,ry){ctx.fillStyle='#17364a24';ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function tri(x1,y1,x2,y2,x3,y3,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.closePath();ctx.fill()}
function ground(){ctx.fillStyle='#e8f9ff';ctx.fillRect(0,0,W,H);const p=iso(C.x,C.y),z=scale();ctx.fillStyle='#f4c9a4';ctx.beginPath();ctx.ellipse(p.x,p.y,260*z,120*z,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#78bfd633';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,radius()*.46*z,0,Math.PI*2);ctx.stroke()}
function tree(t){const p=iso(t.x,t.y),z=scale(),sway=Math.sin(gameTime*1.7+t.x*.013)*1.2*z+Math.sin((t.hit||0)*Math.PI)*4*z;ctx.save();ctx.translate(sway,0);shadow(p.x,p.y+14*z,16*z,6*z);ctx.fillStyle='#86543a';ctx.fillRect(p.x-4*z,p.y-14*z,8*z,32*z);[[30,-58],[40,-38],[48,-18]].forEach((a,i)=>tri(p.x,p.y+(a[1]-25)*z,p.x-a[0]*z,p.y+(a[1]+20)*z,p.x+a[0]*z,p.y+(a[1]+20)*z,i?'#8edced':'#c7f5ff'));tri(p.x-2*z,p.y-82*z,p.x-22*z,p.y-49*z,p.x+2*z,p.y-54*z,'#ffffff99');ctx.restore()}
function rock(r){const p=iso(r.x,r.y),z=scale(),j=Math.sin((r.hit||0)*Math.PI*3)*3*z;ctx.save();ctx.translate(j,0);shadow(p.x,p.y+8*z,18*z,6*z);ctx.fillStyle='#93a7b7';ctx.beginPath();ctx.moveTo(p.x-20*z,p.y+8*z);ctx.lineTo(p.x-12*z,p.y-15*z);ctx.lineTo(p.x+8*z,p.y-20*z);ctx.lineTo(p.x+22*z,p.y+6*z);ctx.lineTo(p.x+5*z,p.y+15*z);ctx.closePath();ctx.fill();tri(p.x-12*z,p.y-15*z,p.x+8*z,p.y-20*z,p.x+1*z,p.y-1*z,'#c5d1d9');ctx.restore()}
function animal(a){const p=iso(a.x,a.y),z=scale(),bob=Math.abs(Math.sin(gameTime*(a.type==='deer'?7:11)+a.y))*3*z,run=1+Math.abs(Math.sin(gameTime*(a.type==='deer'?7:10)+a.x))*.06;ctx.save();ctx.translate(p.x,p.y-bob);ctx.scale(run,1);ctx.translate(-p.x,-p.y);shadow(p.x,p.y+7*z,12*z,5*z);ctx.fillStyle=a.type==='deer'?'#b77b44':'#dce6ea';ctx.beginPath();ctx.ellipse(p.x,p.y-6*z,a.type==='deer'?17*z:11*z,8*z,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(p.x+10*z,p.y-14*z,5*z,0,Math.PI*2);ctx.fill();ctx.restore()}
function camp(){const p=iso(C.x,C.y),z=scale();shadow(p.x,p.y+24*z,55*z,15*z);ctx.fillStyle='#95613e';ctx.fillRect(p.x-38*z,p.y-8*z,76*z,42*z);tri(p.x,p.y-43*z,p.x-48*z,p.y-8*z,p.x+48*z,p.y-8*z,'#d95b41');const flick=6+Math.sin(gameTime*8)*2;ctx.fillStyle='#ff9f2f';ctx.beginPath();ctx.arc(p.x-58*z,p.y+27*z,9*z,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe064';ctx.beginPath();ctx.arc(p.x-58*z,p.y+25*z,flick*z*.55,0,Math.PI*2);ctx.fill();if(Math.random()<.10)particle(C.x-80,C.y-25,'spark',1);if(Math.random()<.025)particle(C.x-65,C.y-45,'smoke',1);ctx.fillStyle='#29485cbb';ctx.font=`900 ${10*z}px system-ui`;ctx.textAlign='center';ctx.fillText(`KAMP LV.${base.level}`,p.x,p.y-50*z)}
function building(b){if(base.level<b.unlock)return;const p=iso(b.x,b.y),z=scale();shadow(p.x,p.y+17*z,33*z,11*z);const roof={lumber:'#b76e3d',hunter:'#8f684c',kitchen:'#ce7651',quarry:'#768b9a',store:'#7a633f'}[b.id]||'#a66';ctx.fillStyle='#8e603f';ctx.fillRect(p.x-27*z,p.y-5*z,54*z,31*z);tri(p.x,p.y-31*z,p.x-34*z,p.y-5*z,p.x+34*z,p.y-5*z,roof);ctx.fillStyle='#f4ca84';ctx.fillRect(p.x-7*z,p.y+8*z,14*z,18*z);ctx.font=`${15*z}px serif`;ctx.textAlign='center';ctx.fillText(b.icon,p.x,p.y-38*z)}
function playerDraw(){const p=iso(player.x,player.y),z=scale(),bob=wasMoving?Math.sin(movePhase*2)*3*z:Math.sin(gameTime*2.2)*.7*z,lean=wasMoving?Math.sin(movePhase)*.04:0;p.y+=bob;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(lean);ctx.translate(-p.x,-p.y);shadow(p.x,p.y+15*z,18*z,7*z);for(let i=0;i<Math.min(8,Math.floor(player.wood));i++){const wob=Math.sin(gameTime*5+i)*.6*z;ctx.fillStyle='#c9844f';ctx.fillRect(p.x+16*z+wob,p.y-30*z-i*6*z,26*z,7*z)}ctx.fillStyle='#27add7';ctx.beginPath();ctx.arc(p.x,p.y-8*z,15*z,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f1d0b4';ctx.beginPath();ctx.arc(p.x,p.y-26*z,8*z,0,Math.PI*2);ctx.fill();const swing=player.work>0?Math.sin(Math.min(1,player.work/.55)*Math.PI)*1.05:0;ctx.save();ctx.translate(p.x+8*z,p.y-10*z);ctx.rotate(-.7+swing);ctx.strokeStyle='#7b5435';ctx.lineWidth=4*z;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(20*z,0);ctx.stroke();ctx.strokeStyle='#768b98';ctx.lineWidth=6*z;ctx.beginPath();ctx.moveTo(18*z,0);ctx.lineTo(23*z,-6*z);ctx.stroke();ctx.restore();ctx.strokeStyle='#43e4ff';ctx.lineWidth=3*z;ctx.beginPath();ctx.arc(p.x,p.y+5*z,22*z,0,Math.PI*2);ctx.stroke();ctx.restore()}
function worker(i){const roles=['lumber','hunter','quarry','kitchen'],role=roles[i%roles.length],b=buildings.find(x=>x.id===role&&base.level>=x.unlock),cx=b?b.x:C.x,cy=b?b.y:C.y,a=i*1.7+gameTime*.7,p=iso(cx+Math.cos(a)*(42+(i%3)*8),cy+Math.sin(a)*32),z=scale();ctx.fillStyle={lumber:'#3ba9cf',hunter:'#d89348',quarry:'#8799a6',kitchen:'#ca765f'}[role];ctx.beginPath();ctx.arc(p.x,p.y,9*z,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f0d0b5';ctx.beginPath();ctx.arc(p.x,p.y-10*z,5*z,0,Math.PI*2);ctx.fill()}
function crate(c){const p=iso(c.x,c.y),z=scale(),bob=Math.sin(gameTime*3+c.x)*1.4*z,glow=.16+.10*Math.sin(gameTime*4+c.y);ctx.fillStyle=`rgba(255,195,60,${glow})`;ctx.beginPath();ctx.arc(p.x,p.y,24*z,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9e6c42';ctx.fillRect(p.x-12*z,p.y-10*z+bob,24*z,20*z);ctx.strokeStyle='#69492f';ctx.strokeRect(p.x-12*z,p.y-10*z+bob,24*z,20*z)}


function drawFootprints(){
 for(const f of footprints){const p=iso(f.x,f.y),z=scale(),a=clamp(1-f.t/f.life,0,1);ctx.save();ctx.globalAlpha=a*.25;ctx.fillStyle='#5d879a';ctx.beginPath();ctx.ellipse(p.x-4*z,p.y+5*z,2.3*z,4.8*z,f.rot,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(p.x+4*z,p.y+1*z,2.3*z,4.8*z,f.rot,0,Math.PI*2);ctx.fill();ctx.restore()}
}
function drawParticles(){
 for(const q of particles){const p=iso(q.x,q.y),z=scale(),a=clamp(1-q.t/q.life,0,1);ctx.save();ctx.globalAlpha=a;if(q.type==='smoke'){ctx.fillStyle='#d8e6eb';ctx.beginPath();ctx.arc(p.x,p.y,q.size*z*(1+q.t),0,Math.PI*2);ctx.fill()}else if(q.type==='spark'){ctx.fillStyle='#ffd85a';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1,q.size*.55)*z,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle=q.type==='chip'?'#afc0cb':'#b87545';ctx.translate(p.x,p.y);ctx.rotate(q.t*7);ctx.fillRect(-q.size*z/2,-q.size*z/3,q.size*z,q.size*z*.55)}ctx.restore()}
 for(const f of floaters){const p=iso(f.x,f.y),z=scale(),a=clamp(1-f.t/f.life,0,1);ctx.save();ctx.globalAlpha=a;ctx.font=`900 ${13*z}px system-ui`;ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#17334a99';ctx.strokeText(f.text,p.x,p.y-f.t*28*z);ctx.fillStyle='#fff';ctx.fillText(f.text,p.x,p.y-f.t*28*z);ctx.restore()}
}

function nearest(list,rad){let b=null,bd=rad;for(const o of list){if(o.dead>0||o.open)continue;const dd=d(player,o);if(dd<bd){bd=dd;b=o}}return b}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.x);toast.x=setTimeout(()=>t.classList.remove('show'),650)}
function buildingToast(m){const t=$('buildingToast');t.textContent=m;t.classList.add('show');clearTimeout(buildingToast.x);buildingToast.x=setTimeout(()=>t.classList.remove('show'),1800)}

function update(dt){
 gameTime+=dt;
 for(const q of particles){q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=42*dt;if(q.type==='smoke'){q.vx*=.98;q.vy=-12}}
 for(let i=particles.length-1;i>=0;i--)if(particles[i].t>=particles[i].life)particles.splice(i,1);
 for(const f of floaters)f.t+=dt;for(let i=floaters.length-1;i>=0;i--)if(floaters[i].t>=floaters[i].life)floaters.splice(i,1);
 for(const f of footprints)f.t+=dt;for(let i=footprints.length-1;i>=0;i--)if(footprints[i].t>=footprints[i].life)footprints.splice(i,1);
 for(const t of trees)if(t.hit>0)t.hit=Math.max(0,t.hit-dt*4);
 for(const r of rocks)if(r.hit>0)r.hit=Math.max(0,r.hit-dt*5);
 shake=Math.max(0,shake-dt*15);
 let x=jx,y=jy;if(keys.w||keys.arrowup)y--;if(keys.s||keys.arrowdown)y++;if(keys.a||keys.arrowleft)x--;if(keys.d||keys.arrowright)x++;
 let l=Math.hypot(x,y);if(l>1){x/=l;y/=l}
 wasMoving=l>.01;if(wasMoving){movePhase+=dt*7;const wx=y*2+x,wy=y*2-x,wl=Math.hypot(wx,wy)||1,s=235*(1+player.boot*.08)*(player.hunger?1:.72),ox=player.x,oy=player.y;let nx=player.x+wx/wl*s*dt,ny=player.y+wy/wl*s*dt,rr=Math.hypot(nx-C.x,ny-C.y),mr=radius()-28;if(rr>mr){const a=Math.atan2(ny-C.y,nx-C.x);nx=C.x+Math.cos(a)*mr;ny=C.y+Math.sin(a)*mr}player.x=nx;player.y=ny;evAdd('walk',Math.hypot(nx-ox,ny-oy));lastFoot+=dt;if(lastFoot>.17){lastFoot=0;footprints.push({x:player.x,y:player.y,t:0,life:2.4,rot:Math.atan2(wy,wx)*.2});if(footprints.length>24)footprints.shift()}}
 player.hunger=clamp(player.hunger-dt*.06,0,100);player.warm=clamp(player.warm-dt*.025,0,100);
 if(player.hunger<35&&player.meat>=1){player.meat--;player.hunger=clamp(player.hunger+48*(1+player.cook*.25),0,100);toast('🥩 Et yedin')}
 if(player.warm<35&&d(player,C)<150)player.warm=clamp(player.warm+dt*14,0,100);

 const c=nearest(crates,60),a=nearest(animals,68),t=nearest(trees,76),r=nearest(rocks,70);
 if(c){c.open=true;c.t=0;player.money+=50;player.wood+=3;particle(c.x,c.y,'spark',14);floater(c.x,c.y-20,'+50 💵  +3 🪵');shake=6;toast('Sandık +50 💵 +3 🪵')}
 if(a&&player.meat<capMeat()){player.work+=dt;if(player.work>.55){player.work=0;a.hp--;impact(a.x,a.y,'wood');if(a.hp<=0){const g=a.type==='deer'?3:1;player.meat+=g;evAdd('meat',g);floater(a.x,a.y-15,`+${g} 🥩`);particle(a.x,a.y,'spark',5);a.dead=8;a.hp=a.max;toast(`+${g} 🥩`)}}}
 else if(t&&player.wood<capWood()){player.work+=dt;const cut=Math.max(.23,.46*(1-player.axe*.12));if(player.work>cut){player.work=0;t.hp--;t.hit=1;impact(t.x,t.y,'wood');if(t.hp<=0){t.dead=5;t.hp=3;player.wood+=3;evAdd('wood',3);floater(t.x,t.y-18,'+3 🪵');particle(t.x,t.y,'woodchip',10);toast('+3 🪵')}}}
 else if(r&&player.stone<capStone()){player.work+=dt;if(player.work>.68){player.work=0;r.hp--;r.hit=1;impact(r.x,r.y,'stone');if(r.hp<=0){r.dead=7;r.hp=4;player.stone+=2;floater(r.x,r.y-12,'+2 🪨');particle(r.x,r.y,'chip',10);toast('+2 🪨')}}}
 else player.work=0;

 trees.forEach(o=>{if(o.dead>0)o.dead-=dt});rocks.forEach(o=>{if(o.dead>0)o.dead-=dt});
 animals.forEach(o=>{if(o.dead>0){o.dead-=dt;if(o.dead<=0){const p=spawn(340,Math.max(380,radius()-30));o.x=o.homeX=p.x;o.y=o.homeY=p.y}return}if(Math.random()<dt*.25)o.dir+=rand(-.8,.8);o.x+=Math.cos(o.dir)*18*dt;o.y+=Math.sin(o.dir)*18*dt;if(Math.hypot(o.x-C.x,o.y-C.y)>radius()-25)o.dir=Math.atan2(C.y-o.y,C.x-o.x)});
 crates.forEach(o=>{if(o.open){o.t+=dt;if(o.t>90){const p=spawn(420,Math.max(450,radius()-20));o.x=p.x;o.y=p.y;o.open=false}}});

 if(d(player,C)<115&&player.wood>0){const n=Math.min(player.wood,dt*8);player.wood-=n;base.progress+=n;evAdd('deposit',n);if(base.progress>=base.cost){base.progress-=base.cost;base.level++;base.cost=Math.round(base.cost*1.68);workers++;const cash=30*base.level;player.money+=cash;evAdd('earn',cash);const unlocked=buildings.find(b=>b.unlock===base.level);particle(C.x,C.y,'spark',24);floater(C.x,C.y-65,`KAMP LV.${base.level}!`);shake=8;flash();if(unlocked)buildingToast(`${unlocked.icon} ${unlocked.name} açıldı!`);else buildingToast(`🏕️ Kamp LV.${base.level}`);toast(`+${cash} 💵`)}}
 incomeClock+=dt;if(incomeClock>=1){incomeClock--;if(workers){const cash=workers+(base.level>=4?1:0);player.money+=cash;evAdd('earn',cash);if(base.level>=2&&Math.random()<.48)player.wood=Math.min(capWood(),player.wood+Math.max(.25,workers*.18));if(base.level>=3&&Math.random()<.16)player.meat=Math.min(capMeat(),player.meat+Math.max(.12,workers*.05));if(base.level>=5&&Math.random()<.12)player.stone=Math.min(capStone(),player.stone+Math.max(.1,workers*.04));if(base.level>=4&&player.hunger<85&&player.meat>0&&Math.random()<.12){player.hunger=clamp(player.hunger+2.5,0,100)}}}
 saveClock+=dt;if(saveClock>5){saveClock=0;save()}
 camX+=(((player.x-player.y)*.5)-camX)*Math.min(1,dt*5);camY+=(((player.x+player.y)*.25)-camY)*Math.min(1,dt*5);
 hud()
}
function hud(){$('money').textContent=Math.floor(player.money);$('wood').textContent=Math.floor(player.wood);$('stone').textContent=Math.floor(player.stone);$('meat').textContent=Math.floor(player.meat);$('hungerText').textContent=Math.round(player.hunger);$('warmText').textContent=Math.round(player.warm);$('hungerBar').style.width=player.hunger+'%';$('warmBar').style.width=player.warm+'%';$('levelChip').textContent=`LV.${base.level}`;const next=buildings.find(b=>b.unlock>base.level);$('quest').textContent=`Kampı LV.${base.level+1} yap`;$('questSub').textContent=next?`${next.icon} LV.${next.unlock}: ${next.name}`:'Kampı büyüt • üretimi artır';$('questBar').style.width=Math.min(100,base.progress/base.cost*100)+'%';updateEvent();updateUpgrades()}
function draw(){ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));ground();drawFootprints();const list=[];trees.forEach(o=>{if(o.dead<=0&&Math.hypot(o.x-C.x,o.y-C.y)<radius())list.push({z:o.x+o.y,f:()=>tree(o)})});rocks.forEach(o=>{if(o.dead<=0&&Math.hypot(o.x-C.x,o.y-C.y)<radius())list.push({z:o.x+o.y,f:()=>rock(o)})});animals.forEach(o=>{if(o.dead<=0&&Math.hypot(o.x-C.x,o.y-C.y)<radius())list.push({z:o.x+o.y,f:()=>animal(o)})});crates.forEach(o=>{if(!o.open&&Math.hypot(o.x-C.x,o.y-C.y)<radius())list.push({z:o.x+o.y,f:()=>crate(o)})});buildings.forEach(b=>{if(base.level>=b.unlock)list.push({z:b.x+b.y,f:()=>building(b)})});list.push({z:C.x+C.y,f:camp});for(let i=0;i<workers;i++)list.push({z:C.x+C.y+30+i,f:()=>worker(i)});list.push({z:player.x+player.y+.5,f:playerDraw});list.sort((a,b)=>a.z-b.z).forEach(o=>o.f());drawParticles();ctx.restore()}
function loop(ts){if(!running)return;const dt=Math.min(.032,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}

initWorld();load();loadEv();camX=(player.x-player.y)*.5;camY=(player.x+player.y)*.25;hud();draw();document.title='Frost Camp Animated';
setInterval(updateEvent,1000);addEventListener('beforeunload',save);
$('play').onclick=()=>{if(offlineReward){player.money+=offlineReward.money;player.wood+=offlineReward.wood;player.meat+=offlineReward.meat;offlineReward=null}$('start').style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)};
})();
</script>
