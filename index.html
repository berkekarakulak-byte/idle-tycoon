function missionCandidates(){
 let st=flowStage(),out=[],n=countItems(),inc=income(),u=Math.max(1,s.users),val=Math.max(1,valuation());
 out.push({kind:"infra",ref:"all",target:n+Math.max(3,2+st*2),label:"Altyapıyı büyüt",reward:Math.max(1000,inc*90)});
 out.push({kind:"money",ref:"all",target:s.total+Math.max(5000,inc*(180+st*60)),label:"Yeni gelir hedefi",reward:Math.max(1500,inc*120)});
 if(s.level>=10)out.push({kind:"employee",ref:"all",target:s.employees.length+1,label:"Ekibi genişlet",reward:Math.max(5000,inc*130)});
 if(s.level>=18)out.push({kind:"research",ref:"all",target:s.research.length+1,label:"Yeni araştırma tamamla",reward:Math.max(12000,inc*160)});
 if(s.level>=24)out.push({kind:"product",ref:"all",target:s.products.length+1,label:"Yeni ürün çıkar",reward:Math.max(25000,inc*190)});
 if(s.products.length)out.push({kind:"users",ref:"all",target:u+Math.max(500,Math.floor(userGrowth()*120)),label:"Kullanıcı ağını büyüt",reward:Math.max(18000,inc*170)});
 if(s.level>=35)out.push({kind:"value",ref:"all",target:val*1.18,label:"Şirket değerini artır",reward:Math.max(50000,inc*220)});
 if(s.level>=45)out.push({kind:"market",ref:"all",target:Math.min(MARKETS.length,s.marketOpen.length+1),label:"Yeni pazara açıl",reward:Math.max(100000,inc*260)});
 if(s.level>=55)out.push({kind:"patent",ref:"all",target:s.patents.length+1,label:"Patent portföyünü büyüt",reward:Math.max(250000,inc*300)});
 return out
}
function missionValue(m){if(m.kind==="infra")return countItems();if(m.kind==="money")return s.total;if(m.kind==="employee")return s.employees.length;if(m.kind==="research")return s.research.length;if(m.kind==="product")return s.products.length;if(m.kind==="users")return s.users;if(m.kind==="value")return valuation();if(m.kind==="market")return s.marketOpen.length;if(m.kind==="patent")return s.patents.length;return 0}
function refillMissions(){
 let guard=0;
 while(s.dynamicMissions.length<3&&guard++<30){
  let used=new Set([...s.missionHistory,...s.dynamicMissions.map(m=>m.sig)]),pool=missionCandidates().filter(m=>!used.has(missionSignature(m)));
  if(!pool.length){s.missionSerial++;pool=missionCandidates().map(m=>({...m,target:Math.ceil(m.target*(1+s.missionSerial*.011))})).filter(m=>!used.has(missionSignature(m)))}
  if(!pool.length)break;let m=pool[(s.missionSerial+s.level+s.dynamicMissions.length)%pool.length];m.id=++s.missionSerial;m.sig=missionSignature(m);s.dynamicMissions.push(m)
 }
}
function checkDynamicMissions(){refillMissions();let changed=false;for(let i=s.dynamicMissions.length-1;i>=0;i--){let m=s.dynamicMissions[i];if(missionValue(m)>=m.target){s.money+=m.reward;s.total+=m.reward;s.nextChest=Math.min(s.nextChest||Date.now()+15000,Date.now()+9000);s.missionHistory.push(m.sig);s.dynamicMissions.splice(i,1);changed=true;toast("GÖREV +₺"+f(m.reward))}}if(changed)refillMissions()}

function newsTick(){
 let available=NEWS_POOL.filter(x=>!s.newsHistory.includes(x));if(!available.length)return;
 let n=available[(s.worldTick+s.level+s.products.length)%available.length];
 s.newsHistory.push(n);s.newsText=n+" · "+newsDetail(n)
}
function livingWorldTick(){
 s.worldTick++;
 s.rivalState.forEach((r,i)=>{let wave=.998+(((s.worldTick*7+i*11)%9)/10000);r.momentum=Math.max(.985,Math.min(1.015,(r.momentum||1)*wave));r.tech+=.0015*(i+1);r.users=Math.max(0,r.users+(4+i*2)*r.momentum);r.value=Math.max(1000,r.value*(1.0007+.00008*i)*r.momentum)});
 s.products.forEach(i=>{let x=productMetrics(i);x.age++;let cf=capacityFactor();x.sat=Math.max(45,Math.min(98,x.sat+(cf>=.9?.12:-.28)));let novelty=Math.max(.5,1-x.age/3200);x.users+=Math.max(0,userGrowth()*.45*novelty*(x.sat/80))});
 s.users=Math.max(s.users,totalProductUsers());
 if(s.worldTick%12===0)newsTick();
 if(s.round>=5){let target=Math.max(1,valuation()/1000000);s.stockPrice=s.stockPrice?Math.max(.1,s.stockPrice*.985+target*.015):target;s.stockHistory.push(s.stockPrice);if(s.stockHistory.length>40)s.stockHistory.shift()}
 checkDynamicMissions()
}
function openMarket(i){let m=MARKETS[i];if(!m||s.marketOpen.includes(m[0]))return;let c=Math.floor(120000*Math.pow(4.2,i));if(s.money<c)return toast("BÜTÇE YETERSİZ");s.money-=c;s.marketOpen.push(m[0]);s.ceoXP+=30;checkDynamicMissions();renderFull();save()}
function setStrategy(i){s.strategy=i;renderFull();save()}
function capacity(){
 let base=10;
 for(const it of ITEMS)base+=(s.items[it[0]]||0)*Math.max(1,it[4]*2);
 base*=1+s.research.length*.08+s.megas.length*.18;
 return base
}
function demand(){
 return Math.max(1,s.products.length*18+s.cities.length*9+s.level*.55)
}
function capacityFactor(){
 return Math.max(.55,Math.min(1.15,capacity()/Math.max(1,demand())))
}
function patentMult(){
 return 1+s.patents.reduce((a,i)=>a+((PATENTS[i]?.[3]||1)-1),0)
}
function megaMult(){
 return 1+s.megas.reduce((a,i)=>a+((MEGAS[i]?.[3]||1)-1),0)
}
function skillMult(){
 return 1+s.ceoSkills.reduce((a,n)=>a+n*.035,0)
}
function valuation(){
 let operating=income()*3600*10;
 let assets=s.total*.12+s.products.length*250000+s.research.length*180000+s.cities.length*300000+s.patents.length*500000+s.megas.length*5000000;
 return Math.max(s.money,operating+assets)*(1+Math.min(.8,s.users/10000000))
}
function userGrowth(){
 if(!s.products.length)return 0;
 let reach=s.marketOpen.reduce((a,n)=>a+(MARKETS.find(m=>m[0]===n)?.[1]||1),0);return Math.max(0,(s.products.length*2.2+s.cities.length*1.1+s.level*.08)*marketMult()*capacityFactor()*Math.max(1,reach*.55))
}
function ecosystemBonus(){let b=1,st=flowStage(),n=countItems();if(st>=1&&n>=8&&s.employees.length)b*=1.05;if(st>=2&&s.products.length&&s.research.length)b*=1.08;if(st>=3&&s.employees.length>=3&&s.products.length>=2&&s.cities.length>=2)b*=1.12;if(st>=4&&s.research.length>=4&&s.products.length>=4&&s.cities.length>=4)b*=1.18;if(st>=5&&s.research.length>=6&&s.products.length>=6&&s.cities.length>=6)b*=1.25;return b}
function mult(){
 let permanent=(1+s.prestige*.25)*strategyMult("finance");
 let systems=1;
 for(let i of s.employees)systems+=(EMP[i]?.[2]||1)-1;
 for(let i of s.products)systems+=(PRODUCTS[i]?.[3]||1)-1;
 for(const r of RESEARCH)if(s.research.includes(r[0]))systems+=r[3]-1;
 let departments=1+s.depts.reduce((a,n,i)=>a+n*(DEPTS[i][3]-1),0);
 let acquisitions=1+s.acq.reduce((a,i)=>a+((ACQ[i]?.[3]||1)-1),0);
 let modelPower=1+Math.max(0,(s.model.quality-1)*.10+(s.model.speed-1)*.08+(s.model.eff-1)*.12);
 let boost=Date.now()<s.boostUntil?(s.boostMult||1):1;
 let ceo=1+(s.ceoLevel-1)*.03;
 return permanent*systems*departments*acquisitions*ecosystemBonus()*marketMult()*modelPower*strategyMult("research")*boost*ceo*patentMult()*megaMult()*skillMult()*capacityFactor()
}
function gross(){let x=.15;for(const it of ITEMS)x+=(s.items[it[0]]||0)*it[4];return x*mult()}
function expenses(){
 let g=gross(),stage=[.10,.14,.18,.22,.26,.30][flowStage()];
 let structure=(s.employees.length*.004+Math.max(0,s.cities.length-1)*.006+s.depts.reduce((a,n)=>a+n,0)*.002);
 let ratio=Math.min(.42,stage+structure);
 if(Date.now()<s.energyDealUntil)ratio*=.72;
 return Math.min(g*.42,g*ratio)
}
function income(){return Math.max(.05,gross()-expenses())}
function cost(it){return Math.floor(it[3]*Math.pow(1.155,s.items[it[0]]||0))}
function save(){s.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}
function era(){let e=ERAS[0][1];for(const x of ERAS)if(s.level>=x[0])e=x[1];return e}
function toast(t){let x=$("toast");x.textContent=t;x.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove("show"),1700)}
function notice(t){$("notice").textContent=t}
function levelUp(){let need=100+s.level*22;while(s.xp>=need){s.xp-=need;s.level++;s.ceoXP+=8;s.seasonXP+=10;need=100+s.level*22;notice("Seviye "+s.level+" · "+era());}while(s.ceoXP>=s.ceoLevel*140){s.ceoXP-=s.ceoLevel*140;s.ceoLevel++;toast("CEO SEVİYESİ "+s.ceoLevel)}}
function maybeEvent(){if(Math.random()>.2)return;let ids=EVENTS.map((_,i)=>i).filter(i=>!s.events.includes(i));if(!ids.length)return;let id=ids[Math.floor(Math.random()*ids.length)];s.events.push(id);let bonus=income()*(22+s.level);s.money+=bonus;s.total+=bonus;notice(EVENTS[id]+" +₺"+f(bonus));}
function buy(id){let it=ITEMS.find(x=>x[0]===id);if(!it||s.level<it[6])return;let c=cost(it);if(s.money<c)return toast("BÜTÇE YETERSİZ");s.money-=c;s.items[id]=(s.items[id]||0)+1;s.xp+=18+it[6];s.seasonXP+=2;levelUp();checkAll();renderFull();save()}
function research(id){let r=RESEARCH.find(x=>x[0]===id);if(!r||s.research.includes(id)||s.level<r[4])return;if(s.money<r[2])return toast("BÜTÇE YETERSİZ");s.money-=r[2];s.research.push(id);s.xp+=120;s.model.quality+=.12;s.model.eff+=.06;s.seasonXP+=20;levelUp();checkAll();renderFull();save()}
function hire(i){let e=EMP[i];if(!e||s.employees.includes(i))return;if(s.money<e[1])return toast("BÜTÇE YETERSİZ");s.money-=e[1];s.employees.push(i);s.seasonXP+=12;checkAll();renderFull();save()}
function launch(i){let x=PRODUCTS[i];if(!x||s.products.includes(i)||s.level<x[1])return;if(s.money<x[2])return toast("BÜTÇE YETERSİZ");s.money-=x[2];s.products.push(i);s.xp+=150;s.model.speed+=.08;s.seasonXP+=25;levelUp();checkAll();renderFull();save()}
function expand(i){let c=CITIES[i];if(!c||s.cities.includes(c[0])||s.level<c[1])return;if(s.money<c[2])return toast("BÜTÇE YETERSİZ");s.money-=c[2];s.cities.push(c[0]);s.xp+=200;s.seasonXP+=30;levelUp();checkAll();renderFull();save()}
function upgradeDept(i){let d=DEPTS[i],n=s.depts[i],c=Math.floor(d[2]*Math.pow(2.05,n));if(s.money<c)return toast("BÜTÇE YETERSİZ");s.money-=c;s.depts[i]++;s.seasonXP+=15;notice(d[0]+" departmanı seviye "+s.depts[i]);renderFull();save()}
function acquire(i){let a=ACQ[i];if(!a||s.acq.includes(i)||s.level<a[1])return;if(s.money<a[2])return toast("BÜTÇE YETERSİZ");s.money-=a[2];s.acq.push(i);s.ceoXP+=60;s.seasonXP+=50;notice(a[0]+" satın alındı.");renderFull();save()}

function patent(i){
 let x=PATENTS[i];if(!x||s.patents.includes(i)||s.level<x[1])return;
 if(s.money<x[2])return toast("BÜTÇE YETERSİZ");
 s.money-=x[2];s.patents.push(i);s.ceoXP+=25;s.seasonXP+=25;checkAll();renderFull();save()
}
function contract(i){
 let x=CONTRACTS[i];if(!x||s.contracts.includes(i)||s.level<x[1])return;
 let need=x[4];if(s.products.length<need)return toast(need+" ÜRÜN GEREKİYOR");
 let reward=x[2]*(.85+marketMult()*.2)*capacityFactor();
 s.money+=reward;s.total+=reward;s.contracts.push(i);s.users+=Math.floor(x[2]/25);
 s.ceoXP+=35;s.seasonXP+=30;checkAll();renderFull();save()
}
function mega(i){
 let x=MEGAS[i];if(!x||s.megas.includes(i)||s.level<x[1])return;
 if(s.money<x[2])return toast("BÜTÇE YETERSİZ");
 s.money-=x[2];s.megas.push(i);s.ceoXP+=80;s.seasonXP+=80;checkAll();renderFull();save()
}
function upgradeSkill(i){
 if(s.prestige<1)return toast("YENİ NESİL GEREKİYOR");
 let c=(s.ceoSkills[i]+1)*2;
 if(s.prestige<c)return toast(c+" PRESTİJ GEREKİYOR");
 s.prestige-=c;s.ceoSkills[i]++;renderFull();save()
}
function funding(){let req=[12,28,48,70,95],cash=[50000,400000,4000000,40000000,400000000],loss=[5,8,10,12,15],names=["Seed","Series A","Series B","Series C","Halka Arz"],i=s.round||0;if(i>=5)return toast("HALKA AÇIK ŞİRKET");if(s.level<req[i])return toast("SEVİYE "+req[i]+" GEREKİYOR");s.money+=cash[i];s.total+=cash[i];s.equity=Math.max(35,s.equity-loss[i]);s.round++;s.ceoXP+=40;s.seasonXP+=30;notice(names[i]+" tamamlandı · ₺"+f(cash[i]));checkAll();renderFull();save()}
function prestige(){if(s.level<75)return toast("SEVİYE 75 GEREKİYOR");let gain=Math.max(1,Math.floor(Math.log10(Math.max(10,s.total))-4));if(!confirm("Yeni nesil başlatılsın mı? Kalıcı +%25 x "+gain))return;let keep={prestige:s.prestige+gain,prestigePoints:(s.prestigePoints||0)+gain,ceoXP:s.ceoXP,ceoLevel:s.ceoLevel,ceoSkills:s.ceoSkills.slice(),chests:s.chests,events:s.events.slice(),missionHistory:s.missionHistory.slice(),newsHistory:s.newsHistory.slice(),last:Date.now()};s=Object.assign({},DEF,keep,{items:{},research:[],employees:[],products:[],cities:["Ankara"],rewards:[],depts:[0,0,0,0,0],missions:[],acq:[],patents:[],contracts:[],megas:[],dynamicMissions:[],rivalState:[],productState:{},marketOpen:["Türkiye"],strategy:-1,model:{quality:1,speed:1,eff:1}});notice("Yeni nesil başladı.");renderFull();save()}
function checkAll(){checkDynamicMissions();REWARDS.forEach((r,i)=>{if(!s.rewards.includes(i)&&r[1](s)){s.rewards.push(i);s.money+=r[2];s.total+=r[2];toast("BAŞARI +₺"+f(r[2]))}});MISSIONS.forEach((m,i)=>{if(!s.missions.includes(i)&&m[1](s)){s.missions.push(i);s.money+=m[2];s.total+=m[2];s.nextChest=Math.min(s.nextChest||Date.now()+30000,Date.now()+12000);toast("GÖREV TAMAMLANDI +₺"+f(m[2]))}})}
function smartUpgrade(){
 if(!s.autoManager)return;
 let actions=[],reserve=Math.max(250,s.money*.20);
 const add=(type,cost,gain,fn)=>{if(Number.isFinite(cost)&&cost>0&&cost<=s.money-reserve)actions.push({type,cost,score:gain/cost,fn})};

 // Altyapı
 ITEMS.forEach(it=>{
  if(s.level<it[6])return;
  let c=cost(it), stageFit=1+Math.max(0,flowStage()-Math.floor(it[6]/18))*.025;
  add("infra",c,it[4]*stageFit,()=>{s.money-=c;s.items[it[0]]=(s.items[it[0]]||0)+1;s.xp+=7})
 });
 // AR-GE
 RESEARCH.forEach(r=>{
  if(s.level>=r[4]&&!s.research.includes(r[0]))
   add("research",r[2],Math.max(1,gross()*(r[3]-1)),()=>{s.money-=r[2];s.research.push(r[0]);s.xp+=120;s.model.quality+=.12;s.model.eff+=.06;s.seasonXP+=20})
 });
 // Çalışan
 EMP.forEach((e,i)=>{
  if(!s.employees.includes(i))
   add("employee",e[1],Math.max(1,gross()*(e[2]-1)),()=>{s.money-=e[1];s.employees.push(i);s.seasonXP+=12})
 });
 // Ürün
 PRODUCTS.forEach((x,i)=>{
  if(s.level>=x[1]&&!s.products.includes(i))
   add("product",x[2],Math.max(1,gross()*(x[3]-1)),()=>{s.money-=x[2];s.products.push(i);s.xp+=150;s.model.speed+=.08;s.seasonXP+=25})
 });
 // Departmanlar
 DEPTS.forEach((d,i)=>{
  let n=s.depts[i],c=Math.floor(d[2]*Math.pow(2.05,n));
  add("dept",c,Math.max(1,gross()*(d[3]-1)),()=>{s.money-=c;s.depts[i]++;s.seasonXP+=15})
 });
 // Şehir
 CITIES.forEach((c,i)=>{
  if(s.level>=c[1]&&!s.cities.includes(c[0]))
   add("city",c[2],Math.max(1,gross()*.10),()=>{s.money-=c[2];s.cities.push(c[0]);s.xp+=200;s.seasonXP+=30})
 });
 // Şirket satın alma
 ACQ.forEach((a,i)=>{
  if(s.level>=a[1]&&!s.acq.includes(i))
   add("acq",a[2],Math.max(1,gross()*(a[3]-1)),()=>{s.money-=a[2];s.acq.push(i);s.ceoXP+=60;s.seasonXP+=50})
 });

 // Patentler
 PATENTS.forEach((x,i)=>{
  if(s.level>=x[1]&&!s.patents.includes(i))
   add("patent",x[2],Math.max(1,gross()*(x[3]-1)),()=>{s.money-=x[2];s.patents.push(i);s.ceoXP+=25;s.seasonXP+=25})
 });
 // Mega projeler
 MEGAS.forEach((x,i)=>{
  if(s.level>=x[1]&&!s.megas.includes(i))
   add("mega",x[2],Math.max(1,gross()*(x[3]-1)),()=>{s.money-=x[2];s.megas.push(i);s.ceoXP+=80;s.seasonXP+=80})
 });
 // Hazır sözleşmeler para harcamaz; otomatik yönetici uygun olduğunda tamamlar.
 CONTRACTS.forEach((x,i)=>{
  if(s.level>=x[1]&&!s.contracts.includes(i)&&s.products.length>=x[4]){
   let reward=x[2]*(.85+marketMult()*.2)*capacityFactor();
   s.money+=reward;s.total+=reward;s.contracts.push(i);s.users+=Math.floor(x[2]/25);s.ceoXP+=35;s.seasonXP+=30;s.autoBuys++
  }
 });

 if(!actions.length){levelUp();checkAll();renderFull();save();return;}
 actions.sort((a,b)=>b.score-a.score);
 let chosen=actions[0];chosen.fn();s.autoBuys++;
 levelUp();checkAll();renderFull();save()
}
function toggleManager(){s.autoManager=!s.autoManager;notice("Akıllı Yönetici "+(s.autoManager?"aktif.":"durduruldu."));renderFull();save()}
function scheduleChest(){let now=Date.now();if(!Number.isFinite(+s.nextChest)||s.nextChest<now-3600000)s.nextChest=now+45000+Math.random()*75000}
function chestTick(){if($("chest").style.display==="grid")return;if(Date.now()>=s.nextChest){$("chest").style.display="grid";let r=Math.random(),name=r<.04?"CEO":r<.14?"EFSANEVİ":r<.32?"EPİK":r<.58?"NADİR":"GÜNLÜK";$("chest").dataset.rarity=name;$("chestname").textContent=name+" SANDIK";s.nextChest=Date.now()+65000+Math.random()*110000;save()}}
function openChest(){let rarity=$("chest").dataset.rarity||"GÜNLÜK",scale={GÜNLÜK:1,NADİR:2,EPİK:4,EFSANEVİ:7,CEO:10}[rarity]||1;$("chest").style.display="none";s.chests++;let roll=Math.random(),title="",text="",icon="🎁";if(roll<.5){let g=Math.max(500,income()*(70+Math.random()*90)*scale);s.money+=g;s.total+=g;title="NAKİT";text="₺"+f(g)+" kasaya eklendi.";icon="💰"}else if(roll<.75){let mins=3+scale;s.boostMult=Math.min(5,1+scale*.45);s.boostUntil=Date.now()+mins*60000;title="BOOST";text=mins+" dk x"+s.boostMult.toFixed(1)+" gelir.";icon="⚡"}else if(roll<.9){let av=ITEMS.filter(it=>s.level>=it[6]);if(av.length){let it=av[Math.floor(Math.random()*av.length)];s.items[it[0]]=(s.items[it[0]]||0)+1;title="YÜKSELTME";text=it[1]+" +1.";icon="⬆️"}}else{s.ceoXP+=80*scale;title="CEO XP";text="+"+(80*scale)+" CEO deneyimi.";icon="👑"}$("looticon").textContent=icon;$("loottitle").textContent=rarity+" · "+title;$("loottext").textContent=text;$("loot").style.display="flex";levelUp();checkAll();renderFull();save()}
function closeLoot(){$("loot").style.display="none";scheduleChest();save()}
function maybeDecision(){if(Date.now()-s.lastDecision<90000||Math.random()>.025||$("decision").style.display==="flex")return;let d=DECISIONS[Math.floor(Math.random()*DECISIONS.length)];s.lastDecision=Date.now();$("dtitle").textContent=d[0];$("dtext").textContent=d[1];$("da").textContent=d[2];$("db").textContent=d[3];$("da").onclick=()=>resolveDecision(d[4]);$("db").onclick=()=>resolveDecision(d[5]);$("decision").style.display="flex"}
function resolveDecision(fn){let msg=fn(s);$("decision").style.display="none";levelUp();checkAll();notice(msg);renderFull();save()}
function renderInfra(){let h='<div class="section">ÜRETİM ZİNCİRİ</div><div class="statgrid"><div class="stat">HESAPLAMA<b>'+f(countItems()*s.model.speed)+'</b></div><div class="stat">VERİM<b>x'+s.model.eff.toFixed(2)+'</b></div></div>';for(const it of ITEMS){let lock=s.level<it[6],n=s.items[it[0]]||0;h+=`<div class="card ${lock?"locked":""}"><div class="icon">${it[2]}</div><div class="ct"><b>${it[1]} <i class="qty">x${n}</i></b><span>${lock?"Seviye "+it[6]+" gerekli":it[5]+" · +₺"+f(it[4]*mult())+"/sn"}</span></div><button class="buy" ${lock?"disabled":""} onclick="buy('${it[0]}')">₺${f(cost(it))}</button></div>`}$("infra").innerHTML=h}
function renderResearch(){let h='<div class="section">MODEL GELİŞİMİ</div><div class="statgrid"><div class="stat">KALİTE<b>'+s.model.quality.toFixed(2)+'</b></div><div class="stat">HIZ<b>'+s.model.speed.toFixed(2)+'</b></div></div>';for(const r of RESEARCH){let done=s.research.includes(r[0]),lock=s.level<r[4];h+=`<div class="card ${lock?"locked":""}"><div class="icon">⌬</div><div class="ct"><b>${r[1]}</b><span>${done?"TAMAMLANDI":lock?"Seviye "+r[4]+" gerekli":"Üretim x"+r[3]}</span></div><button class="buy" ${done||lock?"disabled":""} onclick="research('${r[0]}')">${done?"AKTİF":"₺"+f(r[2])}</button></div>`}h+='<div class="section">PATENTLER</div>';PATENTS.forEach((x,i)=>{let own=s.patents.includes(i),lock=s.level<x[1];h+=`<div class="card ${lock?"locked":""}"><div class="icon">⌘</div><div class="ct"><b>${x[0]}</b><span>${own?"PATENTLİ":lock?"Seviye "+x[1]+" gerekli":"Üretim x"+x[3]}</span></div><button class="buy" ${own||lock?"disabled":""} onclick="patent(${i})">${own?"AKTİF":"₺"+f(x[2])}</button></div>`});$("research").innerHTML=h}
function renderCompany(){let h=`<div class="office"><b>${officeName()}</b><small>${flowName()} · CEO Lv.${s.ceoLevel} · Piyasa x${marketMult().toFixed(2)}</small><div class="sky">${["🖥️","🏠","🏢","🏙️","🌐","🛰️"][flowStage()]}</div></div><div class="statgrid"><div class="stat">DEĞERLEME<b>₺${f(valuation())}</b></div><div class="stat">KULLANICI<b>${f(s.users)}</b></div><div class="stat">ÇALIŞAN<b>${s.employees.length}</b></div><div class="stat">ÜRÜN<b>${s.products.length}</b></div></div>`;h+='<div class="section">YÖNETİM</div>';h+=`<div class="card"><div class="icon">🧠</div><div class="ct"><b>Akıllı Yönetici</b><span>${s.autoManager?"AKTİF · "+s.autoBuys+" yatırım":"Tüm yatırımları otomatik yönetir"}</span></div><button class="buy" onclick="toggleManager()">${s.autoManager?"DURDUR":"BAŞLAT"}</button></div>`;h+=`<div class="card"><div class="icon">₺</div><div class="ct"><b>Yatırım Turu</b><span>Seed → A/B/C → Halka Arz</span></div><button class="buy" ${s.round>=5?"disabled":""} onclick="funding()">${s.round>=5?"TAMAM":"GÖRÜŞ"}</button></div>`;h+='<div class="section">EKİP</div>';EMP.forEach((e,i)=>{let own=s.employees.includes(i);h+=`<div class="card"><div class="icon">♙</div><div class="ct"><b>${e[0]} <i class="rar">${rarity(i)}</i></b><span>${own?"EKİPTE":"Üretim x"+e[2]}</span></div><button class="buy" ${own?"disabled":""} onclick="hire(${i})">${own?"AKTİF":"₺"+f(e[1])}</button></div>`});h+='<div class="section">ÜRÜNLER</div>';PRODUCTS.forEach((x,i)=>{let own=s.products.includes(i),lock=s.level<x[1];h+=`<div class="card ${lock?"locked":""}"><div class="icon">◆</div><div class="ct"><b>${x[0]}</b><span>${own?f(productMetrics(i).users)+" kullanıcı · %"+Math.round(productMetrics(i).sat)+" memnuniyet":lock?"Seviye "+x[1]+" gerekli":"Gelir x"+x[3]}</span></div><button class="buy" ${own||lock?"disabled":""} onclick="launch(${i})">${own?"CANLI":"₺"+f(x[2])}</button></div>`});$("company").innerHTML=h}
function renderOps(){let h='<div class="section">FİNANS & ZİNCİR</div><div class="statgrid"><div class="stat">BRÜT GELİR<b>₺'+f(gross())+'/sn</b></div><div class="stat">GİDER<b>₺'+f(expenses())+'/sn</b></div><div class="stat">NET MARJ<b>%'+Math.max(0,100-expenses()/Math.max(.01,gross())*100).toFixed(0)+'</b></div><div class="stat">NET GELİR<b>₺'+f(income())+'/sn</b></div></div><div class="section">DEPARTMANLAR</div>';DEPTS.forEach((d,i)=>{let n=s.depts[i],c=Math.floor(d[2]*Math.pow(2.05,n));h+=`<div class="card"><div class="icon">${d[1]}</div><div class="ct"><b>${d[0]} <i class="qty">Lv.${n}</i></b><span>x${d[3]} / seviye</span></div><button class="buy" onclick="upgradeDept(${i})">₺${f(c)}</button></div>`});h+=`<div class="section">KAPASİTE</div><div class="statgrid"><div class="stat">SUNUCU<b>${f(capacity())}</b></div><div class="stat">TALEP<b>${f(demand())}</b></div></div>`;h+='<div class="section">SÖZLEŞMELER</div>';CONTRACTS.forEach((x,i)=>{let done=s.contracts.includes(i),lock=s.level<x[1]||s.products.length<x[4];h+=`<div class="card ${lock?"locked":""}"><div class="icon">▤</div><div class="ct"><b>${x[0]}</b><span>${done?"TAMAMLANDI":lock?x[4]+" ürün · Lv."+x[1]:"₺"+f(x[2])+" sözleşme"}</span></div><button class="buy" ${done||lock?"disabled":""} onclick="contract(${i})">${done?"BİTTİ":"AL"}</button></div>`});h+='<div class="section">CEO YETENEKLERİ</div>';CEO_SKILLS.forEach((x,i)=>{h+=`<div class="card"><div class="icon">★</div><div class="ct"><b>${x[0]} <i class="qty">Lv.${s.ceoSkills[i]}</i></b><span>Kalıcı şirket bonusu</span></div><button class="buy" onclick="upgradeSkill(${i})">${(s.ceoSkills[i]+1)*2} P</button></div>`});h+='<div class="section">CANLI GÖREVLER</div>';refillMissions();s.dynamicMissions.forEach(m=>{let v=missionValue(m),pct=Math.min(100,v/Math.max(1,m.target)*100);h+=`<div class="card"><div class="icon">◎</div><div class="ct"><b>${m.label}</b><span>${f(v)} / ${f(m.target)} · ₺${f(m.reward)}</span><div class="mini"><i style="width:${pct}%"></i></div></div><button class="buy" disabled>${Math.floor(pct)}%</button></div>`});h+='<div class="section">ŞİRKET STRATEJİSİ</div>';STRATEGIES.forEach((x,i)=>{h+=`<div class="card"><div class="icon">◆</div><div class="ct"><b>${x[0]}</b><span>${s.strategy===i?"AKTİF":"CEO yönü"}</span></div><button class="buy" onclick="setStrategy(${i})">${s.strategy===i?"SEÇİLİ":"SEÇ"}</button></div>`});h+=`<div class="section">YENİ NESİL</div><div class="card ${s.level<75?"locked":""}"><div class="icon">↻</div><div class="ct"><b>Yeni Nesil</b><span>Kalıcı +%25 üretim</span></div><button class="buy" ${s.level<75?"disabled":""} onclick="prestige()">BAŞLAT</button></div>`;$("ops").innerHTML=h}
function renderWorld(){
 let myVal=valuation(),all=[{name:"NEURAL",value:myVal},...s.rivalState].sort((a,b)=>b.value-a.value),rank=all.findIndex(x=>x.name==="NEURAL")+1;
 let h=`<div class="ticker">● ${s.newsText||"Piyasa sakin."}</div><div class="statgrid"><div class="stat">ŞİRKET DEĞERİ<b>₺${f(myVal)}</b></div><div class="stat">GLOBAL SIRA<b>#${rank}</b></div><div class="stat">KULLANICI<b>${f(s.users)}</b></div><div class="stat">PAZAR<b>${s.marketOpen.length}</b></div></div>`;
 if(s.round>=5)h+=`<div class="card"><div class="icon">↗</div><div class="ct"><b>NEURAL HİSSE</b><span>Halka açık şirket</span></div><button class="buy" disabled>₺${f(s.stockPrice||myVal/1000000)}</button></div>`;
 h+='<div class="section">CANLI RAKİPLER</div>';s.rivalState.slice().sort((a,b)=>b.value-a.value).forEach(r=>{h+=`<div class="card"><div class="icon">♟</div><div class="ct"><b>${r.name}</b><span>₺${f(r.value)} · ${f(r.users)} kullanıcı · Tech ${r.tech.toFixed(1)}</span></div><button class="buy" disabled>${r.value>myVal?"ÖNDE":"GERİDE"}</button></div>`});
 h+='<div class="section">GLOBAL PAZARLAR</div>';MARKETS.forEach((m,i)=>{let own=s.marketOpen.includes(m[0]),c=Math.floor(120000*Math.pow(4.2,i));h+=`<div class="card"><div class="icon">⌖</div><div class="ct"><b>${m[0]}</b><span>${own?m[3]+" pazar aktif":"Kullanıcı x"+m[1]}</span></div><button class="buy" ${own?"disabled":""} onclick="openMarket(${i})">${own?"AÇIK":"₺"+f(c)}</button></div>`});
 h+='<div class="section">MERKEZLER</div>';CITIES.forEach((c,i)=>{let own=s.cities.includes(c[0]),lock=s.level<c[1];h+=`<div class="card ${lock?"locked":""}"><div class="icon">🏢</div><div class="ct"><b>${c[0]}</b><span>${own?"MERKEZ AKTİF":lock?"Seviye "+c[1]+" gerekli":"Yeni operasyon merkezi"}</span></div><button class="buy" ${own||lock?"disabled":""} onclick="expand(${i})">${own?"AÇIK":"₺"+f(c[2])}</button></div>`});
 h+='<div class="section">ŞİRKET SATIN ALMA</div>';ACQ.forEach((a,i)=>{let own=s.acq.includes(i),lock=s.level<a[1];h+=`<div class="card ${lock?"locked":""}"><div class="icon">🤝</div><div class="ct"><b>${a[0]}</b><span>${own?"PORTFÖYDE":lock?"Seviye "+a[1]+" gerekli":"Kalıcı üretim x"+a[3]}</span></div><button class="buy" ${own||lock?"disabled":""} onclick="acquire(${i})">${own?"ALINDI":"₺"+f(a[2])}</button></div>`});
 h+='<div class="section">MEGA PROJELER</div>';MEGAS.forEach((x,i)=>{let own=s.megas.includes(i),lock=s.level<x[1];h+=`<div class="card ${lock?"locked":""}"><div class="icon">◈</div><div class="ct"><b>${x[0]}</b><span>${own?"TAMAMLANDI":lock?"Seviye "+x[1]+" gerekli":"Şirket x"+x[3]}</span></div><button class="buy" ${own||lock?"disabled":""} onclick="mega(${i})">${own?"AKTİF":"₺"+f(x[2])}</button></div>`});
 $("world").innerHTML=h
}
function net(){let box=$("net"),want=Math.min(22,Math.floor(s.level/4)),dots=[...box.querySelectorAll(".dot")];while(dots.length>want)dots.pop().remove();while(box.querySelectorAll(".dot").length<want){let d=document.createElement("i"),i=box.querySelectorAll(".dot").length;d.className="dot";let a=i*137.5*Math.PI/180,r=18+(i%4)*4;d.style.left=(36+Math.cos(a)*r)+"px";d.style.top=(36+Math.sin(a)*r)+"px";box.appendChild(d)}}
function renderHUD(){
 $("money").textContent="₺"+f(s.money);
 $("rate").textContent="Net ₺"+f(income())+"/sn";
 let msg;
 if(flowStage()===0)msg="Garaj · altyapını kur";
 else if(flowStage()===1)msg="Startup · ekip ve AR-GE";
 else if(flowStage()===2)msg="Büyüme · ürün ve kullanıcı";
 else if(flowStage()===3)msg="Global · yeni pazarlar";
 else if(flowStage()===4)msg="Frontier · patent ve mega projeler";
 else msg="Mega Ağ · şirket değerini büyüt";
 $("devline").textContent=msg;
 $("era").textContent=era();$("level").textContent="SEVİYE "+s.level;
 let need=100+s.level*22;$("xpbar").style.width=Math.min(100,s.xp/need*100)+"%";net()
}
function renderFull(){renderHUD();renderInfra();renderResearch();renderCompany();renderOps();renderWorld()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab,.panel").forEach(x=>x.classList.remove("on"));b.classList.add("on");$(b.dataset.p).classList.add("on")});
let holding=false,last=0,acc=0,raf=0,btn=$("train");function trainTick(){let gain=10+s.level*1.25;s.money+=gain;s.total+=gain;s.xp+=7+Math.sqrt(s.level);s.train++;s.model.speed+=.0004;s.seasonXP++;levelUp();if(s.train%19===0)maybeEvent();checkAll();renderHUD()}function loop(t){if(!holding)return;if(!last)last=t;let dt=Math.min(100,t-last);last=t;acc+=dt;while(acc>=280){acc-=280;trainTick()}raf=requestAnimationFrame(loop)}function start(e){e.preventDefault();if(holding||$("loot").style.display==="flex"||$("decision").style.display==="flex")return;holding=true;last=0;btn.classList.add("active");try{btn.setPointerCapture(e.pointerId)}catch{}raf=requestAnimationFrame(loop)}function stop(e){if(e)e.preventDefault();holding=false;last=0;acc=0;btn.classList.remove("active");if(raf){cancelAnimationFrame(raf);raf=0}save()}btn.addEventListener("pointerdown",start);btn.addEventListener("pointerup",stop);btn.addEventListener("pointercancel",stop);btn.addEventListener("lostpointercapture",stop);document.addEventListener("contextmenu",e=>e.preventDefault());document.addEventListener("visibilitychange",()=>{if(document.hidden)stop()});
let now=Date.now(),away=Math.min(8*3600,Math.max(0,(now-(Number(s.last)||now))/1000));if(away>20){let bonus=income()*away*.5;s.money+=bonus;s.total+=bonus;notice("Offline üretim +₺"+f(bonus));toast("OFFLINE +₺"+f(bonus))}s.last=now;scheduleChest();checkAll();renderFull();
setInterval(chestTick,1000);setInterval(livingWorldTick,2200);setInterval(smartUpgrade,700);setInterval(()=>{let inc=income()/5;s.money+=inc;s.total+=inc;if(Math.random()<.004)maybeEvent();maybeDecision();renderHUD()},200);setInterval(()=>{renderFull();save()},7000);
</script></body></html>
