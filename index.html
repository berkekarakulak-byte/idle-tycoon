<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>KAT 0</title>
<style>
:root{--bg:#050607;--panel:#101215;--line:#292d31;--text:#f1f1ee;--muted:#858b90;--red:#b84444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
button{font:inherit;color:inherit;-webkit-appearance:none}
#app{height:100dvh;max-width:480px;margin:auto;background:linear-gradient(#08090a,#030404);position:relative;overflow:hidden}
header{height:11%;padding:calc(env(safe-area-inset-top) + 12px) 17px 8px;display:flex;justify-content:space-between;align-items:flex-start}
.logo{font-size:13px;font-weight:900;letter-spacing:5px}.floor{font-size:11px;color:#8e9498;text-align:right}.floor b{display:block;color:#fff;font-size:24px;line-height:25px}
#scene{height:67%;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wall{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#24272a 0,#101214 42%,#050606 76%)}
.light{position:absolute;top:-10%;left:25%;width:50%;height:40%;background:radial-gradient(ellipse,#d8d0ae28,transparent 65%);filter:blur(7px)}
.elevator{position:relative;width:76%;height:78%;border:8px solid #26292b;background:#111;box-shadow:0 0 0 1px #3c4042,0 20px 50px #000;overflow:hidden}
.door{position:absolute;top:0;width:50.2%;height:100%;background:linear-gradient(90deg,#17191b,#303336 50%,#17191b);border:1px solid #3b3e40;transition:transform .8s cubic-bezier(.7,0,.3,1);z-index:3}
.left{left:0}.right{right:0}.open .left{transform:translateX(-96%)}.open .right{transform:translateX(96%)}
.behind{position:absolute;inset:0;background:linear-gradient(#080909,#121517);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.behind .thing{font-size:13px;line-height:1.55;color:#b5b8b8;opacity:.95}
.display{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:5;background:#030303;border:1px solid #3a3a3a;padding:5px 14px;color:#d95c54;font:700 15px monospace;box-shadow:inset 0 0 10px #b22a2a22}
#message{position:absolute;bottom:16px;left:18px;right:18px;text-align:center;font-size:11px;color:#999;line-height:1.45;min-height:34px;z-index:7}
#panel{height:22%;border-top:1px solid #1c1f21;background:linear-gradient(180deg,#0b0c0d,#050606);padding:10px 15px calc(env(safe-area-inset-bottom) + 10px);box-shadow:0 -12px 30px #0008}
#choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;height:100%}
.btn{border:1px solid #34383c;background:linear-gradient(#17191c,#101214);border-radius:13px;font-size:11px;font-weight:850;letter-spacing:.55px;min-height:46px;box-shadow:inset 0 1px #ffffff08,0 4px 14px #0005}.btn:disabled{opacity:.42}
.btn:active{transform:scale(.98);background:#1d2023}.btn.primary{background:#e8e8e4;color:#090909;border-color:#fff}.btn.danger{color:#e17878}
#status{position:absolute;left:12px;top:12px;z-index:8;display:flex;gap:5px}.tag{font-size:9px;padding:5px 7px;border:1px solid #292c2f;background:#08090acc;border-radius:7px;color:#aaa}
#overlay{position:absolute;inset:0;background:#030405f7;z-index:20;display:flex;align-items:center;justify-content:center;padding:25px}
.card{width:100%;border:1px solid #292d31;background:#0d0f11;border-radius:17px;padding:20px}.card h1{font-size:24px;letter-spacing:7px;margin:0 0 9px}.card p{font-size:12px;color:#8d9296;line-height:1.6}.start{width:100%;padding:13px;border:0;border-radius:11px;background:#eee;color:#080808;font-weight:900;margin-top:10px}
.flash{animation:flash .25s}@keyframes flash{50%{filter:brightness(2.5)}}.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(5px)}75%{transform:translateX(-2px)}}

.utility{position:absolute;z-index:10;bottom:13px;width:36px;height:36px;border:1px solid #34383b;background:#0b0d0ecc;border-radius:10px;font-size:16px}
#flashBtn{right:58px}#bagBtn{right:15px}
#inventory{position:absolute;z-index:25;inset:auto 12px calc(env(safe-area-inset-bottom) + 12px);background:#0d0f11f7;border:1px solid #303438;border-radius:15px;padding:12px;display:none}
#inventory b{font-size:11px}.items{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.item{font-size:10px;border:1px solid #303438;border-radius:8px;padding:7px;background:#151719}
.flashlight .wall{background:radial-gradient(circle at 50% 48%,#77735d 0,#292a27 19%,#0d0f10 47%,#020303 76%)}
.entity{position:absolute;z-index:6;top:34%;left:50%;transform:translateX(-50%);font-size:52px;filter:blur(1px);opacity:0;transition:opacity .25s}
.entity.show{opacity:.62}.camera{font:700 10px monospace;color:#8ea39a;background:#07100b;border:1px solid #284237;padding:9px;border-radius:8px;margin-top:8px}

#message{background:#05060799;border:1px solid #202326;border-radius:10px;padding:8px 10px;backdrop-filter:blur(8px)}
.elevator::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;background:linear-gradient(100deg,transparent 35%,#ffffff08 50%,transparent 65%)}
#inventory{box-shadow:0 12px 45px #000;backdrop-filter:blur(18px)}
#inventory:after{content:"Dokunarak kapat";display:block;margin-top:9px;font-size:9px;color:#60666a;text-align:right}
</style>
</head>
<body>
<div id="app">
<header><div class="logo">KAT 0</div><div class="floor">BULUNDUĞUN KAT<b id="floorNo">?</b></div></header>
<main id="scene">
<div class="wall"></div><div class="light"></div>
<div id="status"><span class="tag" id="hp">♥ 3</span><span class="tag" id="keys">ANAHTAR 0/3</span><span class="tag" id="battery">🔋 100%</span></div>
<div class="elevator" id="elevator">
<div class="behind"><div class="thing" id="thing">Kapıların ardında sessizlik var.</div></div>
<div class="display" id="display">--</div><div class="door left"></div><div class="door right"></div>
</div>
<div id="message">Asansör hareket etmiyor.</div>
<button id="flashBtn" class="utility">🔦</button><button id="bagBtn" class="utility">🎒</button>
</main>
<section id="panel"><div id="choices"></div></section>
<div id="inventory"><b>ENVANTER</b><div class="items" id="items"></div></div>
<div class="entity" id="entity">●</div><div id="overlay"><div class="card"><h1>KAT 0</h1><p>Gece 03:17. Asansöre bindin. Panelde olmayan bir düğme yanıyor: <b>0</b>.<br><br>Burada her kapı açılmamalı.</p><button class="start" id="start">ASANSÖRE BİN</button></div></div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id), KEY="kat0_v1";
const events=[
 {f:7,text:"Koridor bomboş. Uzakta bir telefon çalıyor.",inside:"Telefonun ekranında kendi numaran yazıyor.",risk:0},
 {f:5,text:"Kapının önünde sırtı dönük bir kadın bekliyor.",inside:"Kadın dönmeden '0'a basma' diyor.",risk:1},
 {f:3,text:"Işıklar yanıp sönüyor. Yerde küçük bir anahtar var.",inside:"Anahtarı aldın.",key:1,risk:0},
 {f:9,text:"Bu katın koridoru asansörün aynısı.",inside:"Karşındaki asansörde sen varsın. Ama hareketlerin aynı değil.",risk:1},
 {f:2,text:"Bir çocuk kapının dışında sana bakıyor.",inside:"Çocuk eline üzerinde 0 yazan metal bir parça bırakıyor.",key:1,risk:0},
 {f:6,text:"Duvarlarda yüzlerce kat numarası kazınmış.",inside:"Hepsinin üzeri çizilmiş. Sadece 0 kalmış.",risk:0},
 {f:4,text:"Kapı açılır açılmaz içeriden soğuk hava geliyor.",inside:"Karanlığın içinden bir şey koşuyor.",risk:2},
 {f:8,text:"Koridorda eski bir güvenlik masası var.",inside:"Monitörde asansörün 30 yıldır Kat 0'da olduğu yazıyor.",risk:0},
 {f:1,text:"Kapının arkasında evinin girişini görüyorsun.",inside:"Kapıyı açıyorsun. Burası evin değil.",risk:1},
 {f:0,text:"Ekranda ilk kez 0 göründü.",inside:"Kapılar açılıyor. Karşında başka bir asansör ve üçüncü anahtar var.",key:1,risk:0}
];
const DEFAULT_STATE={hp:3,keys:0,step:0,current:null,visited:[],ended:false,battery:100,flash:false,inventory:[],entity:0,codes:[],cameraSeen:false};
let s={...DEFAULT_STATE};
try{
 const old=JSON.parse(localStorage.getItem(KEY)||"null");
 if(old&&typeof old==="object")s={...DEFAULT_STATE,...old};
}catch{}
if(!Array.isArray(s.visited))s.visited=[];
if(!Array.isArray(s.inventory))s.inventory=[];
if(!Array.isArray(s.codes))s.codes=[];
s.hp=Math.max(0,Math.min(3,Number(s.hp)||3));
s.keys=Math.max(0,Math.min(3,Number(s.keys)||0));
s.battery=Math.max(0,Math.min(100,Number(s.battery)??100));
let busy=false, timers=[];
function later(fn,ms){let id=setTimeout(()=>{timers=timers.filter(x=>x!==id);fn()},ms);timers.push(id);return id}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}
function buttons(list){let c=$("choices");c.innerHTML="";list.forEach(x=>{let b=document.createElement("button");b.className="btn "+(x.cls||"");b.textContent=x.t;b.onclick=()=>{if(busy)return;x.fn()};c.appendChild(b)})}
function status(){
 $("hp").textContent="♥ "+s.hp;$("keys").textContent="ANAHTAR "+s.keys+"/3";$("battery").textContent="🔋 "+Math.max(0,s.battery)+"%";
 $("app").classList.toggle("flashlight",!!s.flash&&s.battery>0);
 $("items").innerHTML=(s.inventory.length?s.inventory:["Boş"]).map(x=>'<span class="item">'+x+'</span>').join("");
 save()
}
function addItem(x){if(!s.inventory.includes(x)){s.inventory.push(x);msg(x+" envantere eklendi.");status()}}
function drain(n){if(s.flash){s.battery=Math.max(0,s.battery-n);if(!s.battery){s.flash=false;msg("El fenerinin pili bitti.")}}}
function entityCheck(){
 if(s.step<3||s.ended)return;
 let chance=Math.min(.12+s.entity*.04,.38);
 if(Math.random()<chance){
  s.entity++;$("entity").classList.add("show");shake();
  setTimeout(()=>$("entity").classList.remove("show"),650);
  if(!s.flash&&Math.random()<.45){s.hp--;msg("Karanlıkta bir şey sana dokundu.");status();if(s.hp<=0)ending(false,"Seni takip eden şey sonunda asansöre girdi.")}
  else msg("Koridorun sonunda bir siluet gördün.");
 }
}
function doors(open){$("elevator").classList.toggle("open",open)}
function msg(t){$("message").textContent=t}
function shake(){let a=$("app");a.classList.remove("shake");void a.offsetWidth;a.classList.add("shake")}
function arrive(){
 if(s.ended)return;
 busy=true;doors(false); let available=events.filter(e=>!s.visited.includes(e.f)&&e.f!==0);
 let e;
 if(s.keys>=2 && s.step>=7)e=events.find(x=>x.f===0);
 else e=available[Math.floor(Math.random()*available.length)]||events.find(x=>x.f===0);
 s.current=e;s.step++;$("display").textContent=e.f;$("floorNo").textContent=e.f;
 msg("Kapılar açılmak üzere.");buttons([]);
 later(()=>{if(s.ended)return;doors(true);$("thing").textContent=e.text;msg(e.text);busy=false;
 buttons([{t:"DIŞARI ÇIK",cls:"primary",fn:explore},{t:"KAPIYI KAPAT",fn:skip}])},700)
}
function next(){if(busy||s.ended)return;busy=true;doors(false);$("inventory").style.display="none";drain(4);status();msg("Asansör hareket ediyor...");buttons([]);later(()=>{busy=false;arrive();later(entityCheck,1200)},900)}
function skip(){
 let e=s.current;if(!s.visited.includes(e.f))s.visited.push(e.f);
 busy=true;doors(false);msg("Kapılar kapandı.");status();later(()=>{busy=false;next()},650)
}
function explore(){
 let e=s.current;$("thing").textContent=e.inside;msg(e.inside);
 if(e.key && !s.visited.includes(e.f)){s.keys=Math.min(3,s.keys+1);addItem("🔑 Kat "+e.f+" anahtarı");$("app").classList.add("flash");setTimeout(()=>$("app").classList.remove("flash"),250)}
 if(e.f===7&&!s.inventory.includes("🔋 Yedek pil"))addItem("🔋 Yedek pil");
 if(e.f===8&&!s.cameraSeen){s.cameraSeen=true;s.codes.push("0317");addItem("📼 Kamera kaydı");}
 if(e.risk){s.hp-=e.risk;shake()}
 if(!s.visited.includes(e.f))s.visited.push(e.f);
 status();
 if(s.hp<=0)return ending(false,"Asansöre geri dönemeden ışıklar söndü.");
 if(e.f===0){
   if(s.keys>=3)return ending(true,"Üç anahtar birleşti. Asansörün arka duvarında daha önce olmayan bir kapı açıldı.");
   msg("Bir şey eksik. Kat 0 seni geri gönderiyor.");
 }
 buttons([{t:"ASANSÖRE DÖN",cls:"primary",fn:next},{t:"ETRAFA BAK",fn:look}])
}
function look(){
 let e=s.current;drain(7);
 if(e.f===8){
   msg("Kamera 03:17'de Kat 0 kapısının açıldığını gösteriyor. Şifre: 0317.");
   addItem("📝 Şifre 0317");
 }else if(e.f===6 && s.inventory.includes("📝 Şifre 0317")){
   msg("Duvardaki panel 4 hane istiyor.");
   buttons([{t:"0317 GİR",cls:"primary",fn:()=>{addItem("🧿 Metal göz");msg("Panel açıldı. İçinden metal bir göz çıktı.")}},{t:"GERİ DÖN",fn:next}]);return;
 }else if(e.f===1 && s.inventory.includes("🧿 Metal göz")){
   msg("Sahte evin kapısındaki boşluğa metal göz tam oturuyor. Gizli bir geçit açıldı.");
   s.battery=Math.min(100,s.battery+35);addItem("📄 Kat -1 notu");
 }else if(e.risk>0 && Math.random()<.38){
   s.hp--;shake();msg("Burada fazla kaldın. Bir şey sana yaklaştı.");status();
   if(s.hp<=0)return ending(false,"Koridorda yalnız olmadığını çok geç fark ettin.");
 }else msg(e.f===0?"Duvara kazınmış cümle: 'ÇIKIŞ YUKARIDA DEĞİL.'":"Duvarın arkasından üç kez vuruldu. Sonra sessizlik.");
 buttons([{t:"ASANSÖRE DÖN",cls:"primary",fn:next},{t:"KAMERAYA BAK",fn:cameraView}])
}
function cameraView(){
 if(!s.cameraSeen){msg("Kamera sinyali yok.");buttons([{t:"GERİ",fn:look}]);return}
 $("thing").innerHTML='<div class="camera">CAM 03 · 03:17:00<br>KAT 0<br><br>ASANSÖR BOŞ.<br>AMA SEN İÇİNDESİN.</div>';
 msg("Kayıtta zaman ilerlemiyor.");buttons([{t:"KAYDI KAPAT",fn:next}])
}
function ending(win,text){
 clearTimers();busy=false;s.ended=true;s.flash=false;status();doors(false);$("display").textContent=win?"OUT":"ERR";$("floorNo").textContent="0";
 $("thing").textContent=text;msg(win?"ÇIKIŞI BULDUN.":"OYUN BİTTİ.");
 buttons([{t:"YENİDEN BAŞLA",cls:"primary",fn:reset},{t:"SONU OKU",fn:()=>msg(win?"Kapı dışarı açılmadı. Başka bir asansöre açıldı. Üzerinde tek bir düğme vardı: -1.":"Asansör ertesi sabah boş bulundu.")}])
}
function reset(){clearTimers();busy=false;localStorage.removeItem(KEY);s={...DEFAULT_STATE,visited:[],inventory:[],codes:[]};status();$("floorNo").textContent="?";$("display").textContent="--";$("thing").textContent="Kapıların ardında sessizlik var.";next()}
$("flashBtn").onclick=()=>{if($("overlay").style.display!=="none"||s.ended)return;if(s.battery<=0&&s.inventory.includes("🔋 Yedek pil")){s.inventory=s.inventory.filter(x=>x!=="🔋 Yedek pil");s.battery=70;msg("Yedek pili taktın.")}else if(s.battery<=0){msg("Pil bitti.")}else{s.flash=!s.flash;msg(s.flash?"El feneri açıldı.":"El feneri kapandı.")}status()};
$("bagBtn").onclick=()=>{if($("overlay").style.display!=="none")return;$("inventory").style.display=$("inventory").style.display==="block"?"none":"block";status()};
$("inventory").onclick=()=>{$("inventory").style.display="none"};
$("start").onclick=()=>{$("overlay").style.display="none";status();if(s.ended){reset();return}if(s.current&&s.step>0){$("floorNo").textContent=s.current.f;$("display").textContent=s.current.f;$("thing").textContent=s.current.text;doors(true);msg("Kayıtlı oyun devam ediyor.");busy=false;buttons([{t:"DIŞARI ÇIK",cls:"primary",fn:explore},{t:"KAPIYI KAPAT",fn:skip}])}else next()};
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("touchstart",e=>{if(e.target.closest("button"))e.preventDefault()},{passive:false,capture:true});
document.addEventListener("touchend",e=>{let b=e.target.closest("button");if(b){e.preventDefault();b.click()}},{passive:false,capture:true});
</script>
</body></html>
