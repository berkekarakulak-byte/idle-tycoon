<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>NEURAL TYCOON</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;height:100%;background:#050706;color:#f2f5f3;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial;overflow:hidden}button{font:inherit;color:inherit}
#app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;background:radial-gradient(circle at 50% -10%,#203328,#080d0a 43%,#040605)}
header{padding:calc(env(safe-area-inset-top) + 8px) 13px 8px;height:11%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #253028}.brand{font-weight:1000;letter-spacing:2px;font-size:13px}.era{text-align:right;font:900 11px monospace}.era small{display:block;color:#77847c;font:700 8px -apple-system;margin-top:2px}
#hero{height:22%;position:relative;padding:13px}.money{font-size:29px;font-weight:1000;letter-spacing:-1px}.rate{font-size:10px;color:#8ea096;margin-top:2px}.network{position:absolute;right:13px;top:13px;width:104px;height:104px;border:1px solid #34483b;border-radius:24px;background:#0d1510;box-shadow:0 0 45px #78a7841a;overflow:hidden}.core{position:absolute;left:39px;top:39px;width:26px;height:26px;border:1px solid #a5b9aa;border-radius:8px;background:#1a2a20;box-shadow:0 0 18px #9fc1a6}.dot{position:absolute;width:5px;height:5px;border-radius:50%;background:#9fb1a4;box-shadow:0 0 7px #9fb1a4}
#notice{position:absolute;left:13px;right:130px;bottom:13px;font-size:9px;line-height:1.4;color:#b6c1ba;min-height:26px}.progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:#172019}.progress i{display:block;height:100%;background:#b9c9be;width:0}
#tabs{height:7%;display:grid;grid-template-columns:repeat(3,1fr);padding:5px 8px;gap:5px;border-block:1px solid #202a23}.tab{border:1px solid #26332b;background:#0b100d;border-radius:9px;font-size:9px;font-weight:900}.tab.on{background:#dce7df;color:#08100a}
#content{height:52%;overflow:auto;padding:8px 8px 90px;scrollbar-width:none}#content::-webkit-scrollbar{display:none}.panel{display:none}.panel.on{display:block}
.card{border:1px solid #26342b;background:linear-gradient(145deg,#0d1410,#080c09);border-radius:13px;padding:10px;margin-bottom:7px;display:grid;grid-template-columns:42px 1fr auto;gap:9px;align-items:center}.icon{width:42px;height:42px;border:1px solid #34473a;border-radius:11px;display:grid;place-items:center;font-size:19px;background:#101a13}.ct b{display:block;font-size:11px}.ct span{font-size:8px;color:#7f8d84}.buy{min-width:77px;border:1px solid #526158;border-radius:9px;background:#172119;padding:8px 6px;font-size:8px;font-weight:950}.buy:disabled{opacity:.35}.locked{opacity:.45}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:8px}.stat{border:1px solid #26342b;border-radius:11px;padding:10px;background:#0b100d;font-size:8px;color:#7f8d84}.stat b{display:block;color:#e8eeea;font-size:14px;margin-top:3px}
#bottom{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(transparent,#050706 18%);pointer-events:none}.train{pointer-events:auto;width:100%;height:58px;border:1px solid #596a5f;border-radius:15px;background:linear-gradient(#1d2a21,#101712);font-weight:1000;letter-spacing:1px;touch-action:none;box-shadow:0 10px 30px #000}.train.active{background:#dce7df;color:#071009;transform:scale(.99)}
.toast{position:absolute;top:12%;left:50%;transform:translate(-50%,-15px);z-index:30;background:#e4ece6;color:#08100a;border-radius:10px;padding:8px 12px;font-size:9px;font-weight:900;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.badge{display:inline-block;border:1px solid #425347;border-radius:20px;padding:3px 6px;font-size:7px;margin:2px;color:#a9b6ad}
</style></head><body><div id="app">
<header><div class="brand">NEURAL TYCOON</div><div class="era"><span id="era">GARAGE AI</span><small id="level">SEVİYE 1</small></div></header>
<section id="hero"><div class="money" id="money">₺500</div><div class="rate" id="rate">₺0 / sn</div><div id="notice">Eski bir bilgisayar ve küçük bir model. Buradan başlıyorsun.</div><div class="network" id="net"><div class="core"></div></div><div class="progress"><i id="xpbar"></i></div></section>
<nav id="tabs"><button class="tab on" data-p="infra">ALTYAPI</button><button class="tab" data-p="research">AR-GE</button><button class="tab" data-p="company">ŞİRKET</button></nav>
<main id="content"><section class="panel on" id="infra"></section><section class="panel" id="research"></section><section class="panel" id="company"></section></main>
<div id="bottom"><button class="train" id="train">MODELİ EĞİT</button></div><div class="toast" id="toast"></div></div>
<script>
"use strict";
const $=x=>document.getElementById(x), KEY="neural_tycoon_v3";
const ITEMS=[
["gpu","GPU","▦",250,1,"Hesaplama gücü üretir",1],["data","Veri Hattı","⇄",700,3,"Eğitim verisini hızlandırır",3],["eng","Mühendis","⌘",1800,8,"Üretimi optimize eder",5],
["rack","Sunucu Rafı","▤",5500,22,"Sürekli model çalıştırır",8],["cool","Soğutma","❄",13000,50,"Donanım verimini artırır",12],["fiber","Fiber Omurga","⌁",32000,120,"Ağ kapasitesini büyütür",16],
["dc","Veri Merkezi","▥",90000,330,"Büyük ölçekli hesaplama",22],["chip","Özel AI Çipi","◇",250000,850,"Özel hızlandırıcı",30],["robot","Robotik Lab","♙",720000,2200,"Fiziksel sistemler geliştirir",40],
["campus","Araştırma Kampüsü","⌂",2100000,6000,"Araştırmayı endüstrileştirir",52],["quant","Kuantum Labı","◈",6500000,16000,"Deneysel hesaplama",66],["orbit","Yörünge Merkezi","◎",20000000,45000,"Uzay tabanlı altyapı",82]
];
const RESEARCH=[
["opt","Model Optimizasyonu",4000,1.25,10],["dist","Dağıtık Eğitim",18000,1.45,18],["multi","Multimodal Sistem",70000,1.7,27],["agent","Otonom Ajanlar",260000,2,38],["robotics","Genel Robotik",900000,2.4,50],["science","AI Bilimci",3500000,3,65],["space","Uzay Hesaplama",14000000,4,80],["frontier","Frontier Mimari",60000000,6,95]
];
const EVENTS=[
"İlk kurumsal müşteri geldi.","Açık kaynak topluluğu optimizasyon paylaştı.","Yeni veri seti eğitim kalitesini yükseltti.","Gece vardiyası darboğazı çözdü.",
"Rakip şirket yeni modelini duyurdu.","Bir GPU arızalandı ama yedek sistem devraldı.","Üniversite ortak araştırma teklif etti.","Enerji anlaşması maliyeti düşürdü.",
"Model beklenmedik bir görevde başarılı oldu.","Yeni müşteri dalgası başladı.","Mühendis ekibi eğitim süresini kısalttı.","Sunucu odası genişletildi.",
"Bir yatırım fonu şirkete ilgi gösterdi.","Yeni sürücü GPU verimini artırdı.","Robot prototipi ilk rotasını tamamladı.","Güvenlik testi kritik bir sorunu erkenden yakaladı.",
"Veri merkezi yeni bölgeye bağlandı.","Araştırma makalesi sektörde ses getirdi.","Özel çip ilk testte beklentiyi aştı.","Kullanıcı sayısı yeni rekora ulaştı.",
"Elektrik kesintisinde UPS sistemi devreye girdi.","Yeni sıkıştırma yöntemi maliyeti azalttı.","Bir müşteri API kullanımını on kat artırdı.","Araştırma ekibi yeni mimari denedi.",
"Robotik ekip hassas kavrama testini geçti.","Yeni soğutma sistemi enerji tasarrufu sağladı.","Uydu hattı yedek bağlantı sağladı.","Model yeni dil desteği kazandı.",
"Veri temizleme hattı kaliteyi artırdı.","Otonom test sistemi yüzlerce hatayı önceden yakaladı.","Yeni kampüsün ilk binası açıldı.","Donanım tedarik anlaşması tamamlandı.",
"Dağıtık eğitim rekor sürede tamamlandı.","Yeni geliştirici araçları yayınlandı.","Bilim ekibi yeni simülasyon başlattı.","Robot filosu koordinasyon testini geçti.",
"Model daha az enerjiyle aynı performansı verdi.","Küresel ağ gecikmesi düşürüldü.","Yeni nesil çip üretime hazırlandı.","Yörünge düğümü ilk veriyi gönderdi."
];
const ERAS=[[1,"GARAGE AI"],[10,"STARTUP"],[25,"AI LAB"],[45,"TECH COMPANY"],[65,"GLOBAL AI"],[85,"FRONTIER NETWORK"],[110,"POST-SCALE"]];
const DEF={money:500,level:1,xp:0,items:{},research:[],events:[],prestige:0,total:0,last:Date.now(),train:0};
let s={...DEF};try{let q=JSON.parse(localStorage.getItem(KEY)||"null");if(q&&typeof q==="object")s={...DEF,...q,items:{...(q.items||{})},research:Array.isArray(q.research)?q.research:[],events:Array.isArray(q.events)?q.events:[]}}catch{}
s.research=[...new Set(s.research)];s.events=[...new Set(s.events.filter(i=>Number.isInteger(i)&&i>=0&&i<EVENTS.length))];
function f(n){n=Math.max(0,n);if(n>=1e12)return(n/1e12).toFixed(2)+"T";if(n>=1e9)return(n/1e9).toFixed(2)+"B";if(n>=1e6)return(n/1e6).toFixed(2)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"K";return Math.floor(n).toLocaleString("tr-TR")}
function mult(){let m=1+s.prestige*.25;for(const r of RESEARCH)if(s.research.includes(r[0]))m*=r[3];return m}
function income(){let x=.15;for(const it of ITEMS)x+=(s.items[it[0]]||0)*it[4];return x*mult()}
function cost(it){return Math.floor(it[3]*Math.pow(1.17,s.items[it[0]]||0))}
function save(){s.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}
function era(){let e=ERAS[0][1];for(const x of ERAS)if(s.level>=x[0])e=x[1];return e}
function toast(t){let x=$("toast");x.textContent=t;x.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove("show"),1800)}
function notice(t){$("notice").textContent=t}
function maybeEvent(){if(Math.random()>.24)return;let ids=EVENTS.map((_,i)=>i).filter(i=>!s.events.includes(i));if(!ids.length)return;let id=ids[Math.floor(Math.random()*ids.length)];s.events.push(id);let bonus=income()*(25+s.level);s.money+=bonus;s.total+=bonus;notice(EVENTS[id]+"  +₺"+f(bonus));toast("GELİŞME")}
function levelUp(){let need=100+s.level*22;while(s.xp>=need){s.xp-=need;s.level++;need=100+s.level*22;notice("Seviye "+s.level+" · "+era()+" dönemine ilerledin.");if(s.level%4===0)maybeEvent()}}
function buy(id){let it=ITEMS.find(x=>x[0]===id);if(!it||s.level<it[6])return;let c=cost(it);if(s.money<c)return toast("BÜTÇE YETERSİZ");s.money-=c;s.items[id]=(s.items[id]||0)+1;s.xp+=20+it[6];levelUp();notice(it[1]+" geliştirildi. Seviye "+s.items[id]+".");render();save()}
function research(id){let r=RESEARCH.find(x=>x[0]===id);if(!r||s.research.includes(id)||s.level<r[4])return;let c=r[2];if(s.money<c)return toast("BÜTÇE YETERSİZ");s.money-=c;s.research.push(id);s.xp+=120;levelUp();notice(r[1]+" araştırması tamamlandı.");render();save()}
function prestige(){if(s.level<75)return toast("SEVİYE 75 GEREKİYOR");let gain=Math.max(1,Math.floor(Math.log10(Math.max(10,s.total))-4));if(!confirm("Yeni nesil AI şirketi kurulsun mu? Kalıcı +%25 üretim x "+gain))return;s={...DEF,prestige:s.prestige+gain,last:Date.now()};notice("Yeni nesil başladı. Kalıcı üretim gücü arttı.");render();save()}
function renderInfra(){let h="";for(const it of ITEMS){let lock=s.level<it[6],n=s.items[it[0]]||0;h+=`<div class="card ${lock?"locked":""}"><div class="icon">${it[2]}</div><div class="ct"><b>${it[1]} · ${n}</b><span>${lock?"Seviye "+it[6]+" gerekli":it[5]+" · +₺"+f(it[4]*mult())+"/sn"}</span></div><button class="buy" ${lock?"disabled":""} onclick="buy('${it[0]}')">₺${f(cost(it))}</button></div>`}$("infra").innerHTML=h}
function renderResearch(){let h="";for(const r of RESEARCH){let done=s.research.includes(r[0]),lock=s.level<r[4];h+=`<div class="card ${lock?"locked":""}"><div class="icon">⌬</div><div class="ct"><b>${r[1]}</b><span>${done?"TAMAMLANDI":lock?"Seviye "+r[4]+" gerekli":"Üretim x"+r[3]}</span></div><button class="buy" ${(done||lock)?"disabled":""} onclick="research('${r[0]}')">${done?"AKTİF":"₺"+f(r[2])}</button></div>`}$("research").innerHTML=h}
function renderCompany(){let gain=Math.max(1,Math.floor(Math.log10(Math.max(10,s.total))-4));$("company").innerHTML=`<div class="statgrid"><div class="stat">TOPLAM KAZANÇ<b>₺${f(s.total)}</b></div><div class="stat">NESİL<b>${s.prestige+1}</b></div><div class="stat">ÜRETİM ÇARPANI<b>x${mult().toFixed(2)}</b></div><div class="stat">OLAYLAR<b>${s.events.length}/${EVENTS.length}</b></div></div><div class="card ${s.level<75?"locked":""}"><div class="icon">↻</div><div class="ct"><b>YENİ NESİL</b><span>Şirketi yeniden kur · kalıcı üretim bonusu x${gain}</span></div><button class="buy" ${s.level<75?"disabled":""} onclick="prestige()">BAŞLAT</button></div><div>${s.research.map(id=>`<span class="badge">${RESEARCH.find(r=>r[0]===id)?.[1]||id}</span>`).join("")}</div>`}
function net(){let box=$("net"),want=Math.min(22,Math.floor(s.level/4));while(box.querySelectorAll(".dot").length<want){let d=document.createElement("i"),i=box.querySelectorAll(".dot").length;d.className="dot";let a=(i*137.5)*Math.PI/180,r=28+(i%4)*7;d.style.left=(50+Math.cos(a)*r)+"px";d.style.top=(50+Math.sin(a)*r)+"px";box.appendChild(d)}}
function render(){$("money").textContent="₺"+f(s.money);$("rate").textContent="₺"+f(income())+" / sn";$("era").textContent=era();$("level").textContent="SEVİYE "+s.level;let need=100+s.level*22;$("xpbar").style.width=Math.min(100,s.xp/need*100)+"%";renderInfra();renderResearch();renderCompany();net()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab,.panel").forEach(x=>x.classList.remove("on"));b.classList.add("on");$(b.dataset.p).classList.add("on")});
let holding=false,last=0,acc=0,raf=0,btn=$("train");
function trainTick(){let gain=12+s.level*1.4;s.money+=gain;s.total+=gain;s.xp+=7+Math.sqrt(s.level);s.train++;levelUp();if(s.train%17===0)maybeEvent();render()}
function loop(t){if(!holding)return;if(!last)last=t;let dt=Math.min(100,t-last);last=t;acc+=dt;while(acc>=280){acc-=280;trainTick()}raf=requestAnimationFrame(loop)}
function start(e){e.preventDefault();if(holding)return;holding=true;last=0;btn.classList.add("active");try{btn.setPointerCapture(e.pointerId)}catch{}raf=requestAnimationFrame(loop)}
function stop(e){if(e)e.preventDefault();holding=false;last=0;acc=0;btn.classList.remove("active");if(raf){cancelAnimationFrame(raf);raf=0}save()}
btn.addEventListener("pointerdown",start);btn.addEventListener("pointerup",stop);btn.addEventListener("pointercancel",stop);btn.addEventListener("lostpointercapture",stop);document.addEventListener("contextmenu",e=>e.preventDefault());document.addEventListener("visibilitychange",()=>{if(document.hidden)stop()});
let now=Date.now(),away=Math.min(8*3600,Math.max(0,(now-(Number(s.last)||now))/1000));if(away>20){let bonus=income()*away*.55;s.money+=bonus;s.total+=bonus;notice("Sistem sen yokken ₺"+f(bonus)+" üretti.");toast("OFFLINE KAZANÇ +₺"+f(bonus))}
s.last=now;render();setInterval(()=>{let inc=income()/5;s.money+=inc;s.total+=inc;if(Math.random()<.006)maybeEvent();render()},200);setInterval(save,5000);
</script></body></html>
