<script>"use strict";

const ITEMS=[

["rack","Sunucu Rafı","▤",5500,22,"Sürekli model çalıştırır",8],["cool","Soğutma","❄",13000,50,"Donanım verimini artırır",12],["fiber","Fiber Omurga","⌁",32000,120,"Ağ kapasitesini büyütür",16],
["dc","Veri Merkezi","▥",90000,330,"Büyük ölçekli hesaplama",22],["chip","Özel AI Çipi","◇",250000,850,"Özel hızlandırıcı",30],["robot","Robotik Lab","♙",720000,2200,"Fiziksel sistemler geliştirir",40],
["campus","Araştırma Kampüsü","⌂",2100000,6000,"Araştırmayı endüstrileştirir",52],["quant","Kuantum Labı","◈",6500000,16000,"Deneysel hesaplama",66],["orbit","Yörünge Merkezi","◎",20000000,45000,"Uzay tabanlı altyapı",82]
];
const RESEARCH=[
["opt","Model Optimizasyonu",4000,1.25,10],["dist","Dağıtık Eğitim",18000,1.45,18],["multi","Multimodal Sistem",70000,1.7,27],["agent","Otonom Ajanlar",260000,2,38],["robotics","Genel Robotik",900000,2.4,50],["science","AI Bilimci",3500000,3,65],["space","Uzay Hesaplama",14000000,4,80],["frontier","Frontier Mimari",60000000,6,95]
];
const EVENTS=[
"İlk kurumsal müşteri geldi.","Açık kaynak topluluğu optimizasyon paylaştı.","Yeni veri seti eğitim kalitesini yükseltti.","Gece vardiyası darboğazı çözdü.",
"Rakip şirket yeni modelini duyurdu.","Bir GPU arızalandı ama yedek sistem devraldı.","Üniversite ortak araştırma teklif etti.","Enerji anlaşması maliyeti düşürdü.",
"Model beklenmedik bir görevde başarılı oldu.","Yeni müşteri dalgası başladı.","Mühendis ekibi eğitim süresini kısalttı.","Sunucu odası genişletildi.",
"Bir yatırım fonu şirkete ilgi gösterdi.","Yeni sürücü GPU verimini artırdı.","Robot prototipi ilk rotasını tamamladı.","Güvenlik testi kritik bir sorunu erkenden yakaladı.",
"Veri merkezi yeni bölgeye bağlandı.","Araştırma makalesi sektörde ses getirdi.","Özel çip ilk testte beklentiyi aştı.","Kullanıcı sayısı yeni rekora ulaştı.",
"Elektrik kesintisinde UPS sistemi devreye girdi.","Yeni sıkıştırma yöntemi maliyeti azalttı.","Bir müşteri API kullanımını on kat artırdı.","Araştırma ekibi yeni mimari denedi.",
"Robotik ekip hassas kavrama testini geçti.","Yeni soğutma sistemi enerji tasarrufu sağladı.","Uydu hattı yedek bağlantı sağladı.","Model yeni dil desteği kazandı.",
"Veri temizleme hattı kaliteyi artırdı.","Otonom test sistemi yüzlerce hatayı önceden yakaladı.","Yeni kampüsün ilk binası açıldı.","Donanım tedarik anlaşması tamamlandı.",
"Dağıtık eğitim rekor sürede tamamlandı.","Yeni geliştirici araçları yayınlandı.","Bilim ekibi yeni simülasyon başlattı.","Robot filosu koordinasyon testini geçti.",
"Model daha az enerjiyle aynı performansı verdi.","Küresel ağ gecikmesi düşürüldü.","Yeni nesil çip üretime hazırlandı.","Yörünge düğümü ilk veriyi gönderdi."
];
const EMP=[
["Junior Mühendis",12000,1.08],["ML Mühendisi",55000,1.14],["Araştırmacı",180000,1.22],["Satış Uzmanı",450000,1.3],["Güvenlik Uzmanı",1100000,1.4],["Yıldız Araştırmacı",4000000,1.65],["Robotik Uzmanı",12000000,1.9],["Chief Scientist",50000000,2.5]
];
const PRODUCTS=[
["AI Chatbot",15,25000,1.15],["Görsel AI",24,100000,1.3],["Kurumsal API",34,400000,1.55],["Video AI",45,1400000,1.9],["AI Ajan",57,5000000,2.4],["Robot",70,18000000,3.1],["Bilim AI",84,70000000,4.2],["Frontier Model",100,300000000,6]
];
const CITIES=[["İstanbul",18,75000],["Berlin",30,350000],["Londra",42,1400000],["New York",55,6000000],["San Francisco",67,22000000],["Tokyo",80,80000000],["Singapur",92,250000000],["Yörünge",110,900000000]];
const RIVALS=["Nexora","DeepCore","Synapse Labs","Helix AI","Vertex","NovaMind"];
const REWARDS=[
["İlk Milyon",x=>x.total>=1e6,50000],["İlk Ürün",x=>x.products.length>=1,25000],["Ekip Kuruldu",x=>x.employees.length>=3,100000],
["Global Açılım",x=>x.cities.length>=4,500000],["AI Devi",x=>x.level>=75,2000000],["Milyarder",x=>x.total>=1e9,10000000],
["Araştırma Ustası",x=>x.research.length>=6,5000000],["Dünya Ağı",x=>x.cities.length>=8,25000000]
];
const ERAS=[[1,"GARAGE AI"],[10,"STARTUP"],[25,"AI LAB"],[45,"TECH COMPANY"],[65,"GLOBAL AI"],[85,"FRONTIER NETWORK"],[110,"POST-SCALE"]];
const DEPTS=[["AR-GE","⌬",25000,1.05],["Satış","₺",60000,1.07],["Güvenlik","⌾",180000,1.09],["Finans","▥",500000,1.11],["İnsan Kaynakları","♙",1400000,1.13]];
const ACQ=[["TinyCompute",38,1200000,1.08],["VisionForge",55,7500000,1.12],["AgentWorks",72,35000000,1.18],["RoboStack",90,180000000,1.25]];
const MISSIONS=[["10 altyapı yükseltmesi",x=>countItems()>=10,25000],["3 çalışan kur",x=>x.employees.length>=3,90000],["2 ürün piyasaya çıkar",x=>x.products.length>=2,220000],["3 şehirlik ağ kur",x=>x.cities.length>=3,750000],["5 AR-GE tamamla",x=>x.research.length>=5,3000000],["₺100M toplam kazan",x=>x.total>=1e8,8000000]];
const DECISIONS=[
["Ucuz GPU anlaşması","Toplu alım yap: şimdi ödeme, altyapı bonusu.","ANLAŞ","PAS",x=>{let c=Math.max(5000,income()*120);if(x.money>=c){x.money-=c;x.items.gpu=(x.items.gpu||0)+3;return "3 GPU eklendi."}return "Bütçe yetmedi."},x=>"Risk alınmadı."],
["Kurumsal müşteri","Özel entegrasyon ekibi istiyor.","KABUL","REDDET",x=>{let g=income()*240;x.money+=g;x.total+=g;x.ceoXP+=35;return "₺"+f(g)+" sözleşme geliri."},x=>{x.ceoXP+=10;return "Ekip odağını korudu."}],
["Enerji krizi","Sabit fiyatlı enerji kontratı teklif edildi.","KONTRAT","BEKLE",x=>{x.energyDealUntil=Date.now()+300000;return "5 dk giderler %35 düştü."},x=>"Piyasa riski kabul edildi."]
];
const DEF={money:500,level:1,xp:0,items:{},research:[],events:[],prestige:0,total:0,last:Date.now(),train:0,employees:[],products:[],cities:["Ankara"],rewards:[],round:0,equity:100,chests:0,nextChest:Date.now()+45000,boostUntil:0,boostMult:1,autoManager:false,autoBuys:0,depts:[0,0,0,0,0],missions:[],acq:[],ceoXP:0,ceoLevel:1,seasonXP:0,model:{quality:1,speed:1,eff:1},energyDealUntil:0,lastDecision:0,marketSeed:1};
let s;try{s=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch{s={...DEF}}
s.items=s.items&&typeof s.items==="object"?s.items:{};["research","events","employees","products","cities","rewards","depts","missions","acq"].forEach(k=>{if(!Array.isArray(s[k]))s[k]=Array.isArray(DEF[k])?[...DEF[k]]:[]});s.depts=DEPTS.map((_,i)=>Math.max(0,Number(s.depts[i])||0));s.cities=[...new Set(s.cities.filter(x=>typeof x==="string"))];if(!s.cities.includes("Ankara"))s.cities.unshift("Ankara");s.model=Object.assign({quality:1,speed:1,eff:1},s.model||{});
function f(n){n=Math.max(0,Number(n)||0);if(n>=1e12)return(n/1e12).toFixed(2)+"T";if(n>=1e9)return(n/1e9).toFixed(2)+"B";if(n>=1e6)return(n/1e6).toFixed(2)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"K";return Math.floor(n).toLocaleString("tr-TR")}
function countItems(){return ITEMS.reduce((a,it)=>a+(Number(s.items[it[0]])||0),0)}
function flowStage(){return s.level<10?0:s.level<25?1:s.level<45?2:s.level<65?3:s.level<85?4:5}
function flowName(){return ["KURULUŞ","STARTUP","BÜYÜME","GLOBAL","FRONTIER","MEGA AĞ"][flowStage()]}
function officeName(){return ["Garaj","Startup Ofisi","Teknoloji Merkezi","AI Kampüsü","Global Merkez","Yörünge Ağı"][flowStage()]}
function rarity(i){return i<2?"NORMAL":i<4?"NADİR":i<6?"EPİK":"EFSANEVİ"}
function deptMult(){return s.depts.reduce((m,n,i)=>m*Math.pow(DEPTS[i][3],n),1)}
function acqMult(){return s.acq.reduce((m,i)=>m*(ACQ[i]?.[3]||1),1)}
function marketMult(){let t=Math.floor(Date.now()/60000);return .86+(((t*17+s.products.length*11+s.level*3)%29)/100)}
function ecosystemBonus(){let b=1,st=flowStage(),n=countItems();if(st>=1&&n>=8&&s.employees.length)b*=1.05;if(st>=2&&s.products.length&&s.research.length)b*=1.08;if(st>=3&&s.employees.length>=3&&s.products.length>=2&&s.cities.length>=2)b*=1.12;if(st>=4&&s.research.length>=4&&s.products.length>=4&&s.cities.length>=4)b*=1.18;if(st>=5&&s.research.length>=6&&s.products.length>=6&&s.cities.length>=6)b*=1.25;return b}
function mult(){let m=1+s.prestige*.25;if(Date.now()<s.boostUntil)m*=s.boostMult||1;for(let i of s.employees)m*=EMP[i]?.[2]||1;for(let i of s.products)m*=PRODUCTS[i]?.[3]||1;for(const r of RESEARCH)if(s.research.includes(r[0]))m*=r[3];return m*deptMult()*acqMult()*ecosystemBonus()*marketMult()*(1+(s.ceoLevel-1)*.03)}
function gross(){let x=.15;for(const it of ITEMS)x+=(s.items[it[0]]||0)*it[4];return x*mult()}
function expenses(){let infra=countItems()*.035,staff=s.employees.length*(.4+s.level*.025),cities=Math.max(0,s.cities.length-1)*(2+s.level*.08),dept=s.depts.reduce((a,n)=>a+n,0)*.65,e=(infra+staff+cities+dept);if(Date.now()<s.energyDealUntil)e*=.65;return Math.min(gross()*.72,e)}
function income(){return Math.max(.05,gross()-expenses())}
function cost(it){return Math.floor(it[3]*Math.pow(1.165,s.items[it[0]]||0))}
function save(){s.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}
function era(){let e=ERAS[0][1];for(const x of ERAS)if(s.level>=x[0])e=x[1];return e}
function toast(t){let x=$("toast");x.textContent=t;x.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove("show"),1700)}
function notice(t){$("notice").textContent=t}
function levelUp(){let need=100+s.level*22;while(s.xp>=need){s.xp-=need;s.level++;s.ceoXP+=8;s.seasonXP+=10;need=100+s.level*22;notice("Seviye "+s.level+" · "+era());}while(s.ceoXP>=s.ceoLevel*140){s.ceoXP-=s.ceoLevel*140;s.ceoLevel++;toast("CEO SEVİYESİ "+s.ceoLevel)}}
function maybeEvent(){if(Math.random()>.2)return;let ids=EVENTS.map((_,i)=>i).filter(i=>!s.events.includes(i));if(!ids.length)return;let id=ids[Math.floor(Math.random()*ids.length)];s.events.push(id);let bonus=income()*(22+s.level);s.money+=bonus;s.total+=bonus;notice(EVENTS[id]+" +₺"+f(bonus));}
function buy(id){let it=ITEMS.find(x=>x[0]===id);if(!it||s.level<it[6])return;let c=cost(it);if(s.money<c)return toast("BÜTÇE YETERSİZ");s.money-=c;s.items[id]=(s.items[id]||0)+1;s.xp+=18+it[6];s.seasonXP+=2;levelUp();checkAll();renderFull();save()}
function research(id){let r=RESEARCH.find(x=>x[0]===id);if(!r||s.research.includes(id)||s.level<r[4])return;if(s.money<r[2])return toast("BÜTÇE YETERSİZ");s.money-=r[2];s.research.push(id);s.xp+=120;s.model.quality+=.12;s.model.eff+=.06;s.seasonXP+=20;levelUp();checkAll();renderFull();save()}
function hire(i){let e=EMP[i];if(!e||s.employees.includes(i))return;if(s.money<e[1])return toast("BÜTÇE YETERSİZ");s.money-=e[1];s.employees.push(i);s.seasonXP+=12;checkAll();renderFull();save()}
function launch(i){let x=PRODUCTS[i];if(!x||s.products.includes(i)||s.level<x[1])return;if(s.money<x[2])return toast("BÜTÇE YETERSİZ");s.money-=x[2];s.products.push(i);s.xp+=150;s.model.speed+=.08;s.seasonXP+=25;levelUp();checkAll();renderFull();save()}
function expand(i){let c=CITIES[i];if(!c||s.cities.includes(c[0])||s.level<c[1])return;if(s.money<c[2])return toast("BÜTÇE YETERSİZ");s.money-=c[2];s.cities.push(c[0]);s.xp+=200;s.seasonXP+=30;levelUp();checkAll();renderFull();save()}
function upgradeDept(i){let d=DEPTS[i],n=s.depts[i],c=Math.floor(d[2]*Math.pow(2.05,n));if(s.money<c)return toast("BÜTÇE YETERSİZ");s.money-=c;s.depts[i]++;s.seasonXP+=15;notice(d[0]+" departmanı seviye "+s.depts[i]);renderFull();save()}
function acquire(i){let a=ACQ[i];if(!a||s.acq.includes(i)||s.level<a[1])return;if(s.money<a[2])return toast("BÜTÇE YETERSİZ");s.money-=a[2];s.acq.push(i);s.ceoXP+=60;s.seasonXP+=50;notice(a[0]+" satın alındı.");renderFull();save()}
function funding(){let req=[12,28,48,70,95],cash=[50000,400000,4000000,40000000,400000000],loss=[5,8,10,12,15],names=["Seed","Series A","Series B","Series C","Halka Arz"],i=s.round||0;if(i>=5)return toast("HALKA AÇIK ŞİRKET");if(s.level<req[i])return toast("SEVİYE "+req[i]+" GEREKİYOR");s.money+=cash[i];s.total+=cash[i];s.equity=Math.max(35,s.equity-loss[i]);s.round++;s.ceoXP+=40;s.seasonXP+=30;notice(names[i]+" tamamlandı · ₺"+f(cash[i]));checkAll();renderFull();save()}
function prestige(){if(s.level<75)return toast("SEVİYE 75 GEREKİYOR");let gain=Math.max(1,Math.floor(Math.log10(Math.max(10,s.total))-4));if(!confirm("Yeni nesil başlatılsın mı? Kalıcı +%25 x "+gain))return;let keep={prestige:s.prestige+gain,ceoXP:s.ceoXP,ceoLevel:s.ceoLevel,chests:s.chests,events:s.events.slice(),last:Date.now()};s=Object.assign({},DEF,keep,{items:{},research:[],employees:[],products:[],cities:["Ankara"],rewards:[],depts:[0,0,0,0,0],missions:[],acq:[],model:{quality:1,speed:1,eff:1}});notice("Yeni nesil başladı.");renderFull();save()}
function checkAll(){REWARDS.forEach((r,i)=>{if(!s.rewards.includes(i)&&r[1](s)){s.rewards.push(i);s.money+=r[2];s.total+=r[2];toast("BAŞARI +₺"+f(r[2]))}});MISSIONS.forEach((m,i)=>{if(!s.missions.includes(i)&&m[1](s)){s.missions.push(i);s.money+=m[2];s.total+=m[2];s.chests++;toast("GÖREV TAMAMLANDI +₺"+f(m[2]))}})}
function smartUpgrade(){if(!s.autoManager)return;let reserve=Math.max(250,s.money*.2),choices=[];for(const it of ITEMS){if(s.level<it[6])continue;let c=cost(it);if(c>s.money-reserve)continue;let stageFit=1+Math.max(0,flowStage()-Math.floor(it[6]/18))*.025;choices.push({it,c,score:(it[4]*stageFit)/c})}if(!choices.length)return;choices.sort((a,b)=>b.score-a.score);let x=choices[0];s.money-=x.c;s.items[x.it[0]]=(s.items[x.it[0]]||0)+1;s.autoBuys++;s.xp+=7;levelUp();checkAll();renderFull();save()}
function toggleManager(){s.autoManager=!s.autoManager;notice("Akıllı Yönetici "+(s.autoManager?"aktif.":"durduruldu."));renderFull();save()}
function scheduleChest(){let now=Date.now();if(!Number.isFinite(+s.nextChest)||s.nextChest<now-3600000)s.nextChest=now+45000+Math.random()*75000}
function chestTick(){if($("chest").style.display==="grid")return;if(Date.now()>=s.nextChest){$("chest").style.display="grid";let r=Math.random(),name=r<.04?"CEO":r<.14?"EFSANEVİ":r<.32?"EPİK":r<.58?"NADİR":"GÜNLÜK";$("chest").dataset.rarity=name;$("chestname").textContent=name+" SANDIK";s.nextChest=Date.now()+65000+Math.random()*110000;save()}}
function openChest(){let rarity=$("chest").dataset.rarity||"GÜNLÜK",scale={GÜNLÜK:1,NADİR:2,EPİK:4,EFSANEVİ:7,CEO:10}[rarity]||1;$("chest").style.display="none";s.chests++;let roll=Math.random(),title="",text="",icon="🎁";if(roll<.5){let g=Math.max(500,income()*(70+Math.random()*90)*scale);s.money+=g;s.total+=g;title="NAKİT";text="₺"+f(g)+" kasaya eklendi.";icon="💰"}else if(roll<.75){let mins=3+scale;s.boostMult=Math.min(5,1+scale*.45);s.boostUntil=Date.now()+mins*60000;title="BOOST";text=mins+" dk x"+s.boostMult.toFixed(1)+" gelir.";icon="⚡"}else if(roll<.9){let av=ITEMS.filter(it=>s.level>=it[6]);if(av.length){let it=av[Math.floor(Math.random()*av.length)];s.items[it[0]]=(s.items[it[0]]||0)+1;title="YÜKSELTME";text=it[1]+" +1.";icon="⬆️"}}else{s.ceoXP+=80*scale;title="CEO XP";text="+"+(80*scale)+" CEO deneyimi.";icon="👑"}$("looticon").textContent=icon;$("loottitle").textContent=rarity+" · "+title;$("loottext").textContent=text;$("loot").style.display="flex";checkAll();renderFull();save()}
function closeLoot(){$("loot").style.display="none";scheduleChest();save()}
function maybeDecision(){if(Date.now()-s.lastDecision<90000||Math.random()>.025||$("decision").style.display==="flex")return;let d=DECISIONS[Math.floor(Math.random()*DECISIONS.length)];s.lastDecision=Date.now();$("dtitle").textContent=d[0];$("dtext").textContent=d[1];$("da").textContent=d[2];$("db").textContent=d[3];$("da").onclick=()=>resolveDecision(d[4]);$("db").onclick=()=>resolveDecision(d[5]);$("decision").style.display="flex"}
function resolveDecision(fn){let msg=fn(s);$("decision").style.display="none";notice(msg);renderFull();save()}
function renderInfra(){let h='<div class="section">ÜRETİM ZİNCİRİ</div><div class="statgrid"><div class="stat">HESAPLAMA<b>'+f(countItems()*s.model.speed)+'</b></div><div class="stat">VERİM<b>x'+s.model.eff.toFixed(2)+'</b></div></div>';for(const it of ITEMS){let lock=s.level<it[6],n=s.items[it[0]]||0;h+=`<div class="card ${lock?"locked":""}"><div class="icon">${it[2]}</div><div class="ct"><b>${it[1]} <i class="qty">x${n}</i></b><span>${lock?"Seviye "+it[6]+" gerekli":it[5]+" · +₺"+f(it[4]*mult())+"/sn"}</span></div><button class="buy" ${lock?"disabled":""} onclick="buy('${it[0]}')">₺${f(cost(it))}</button></div>`}$("infra").innerHTML=h}
function renderResearch(){let h='<div class="section">MODEL GELİŞİMİ</div><div class="statgrid"><div class="stat">KALİTE<b>'+s.model.quality.toFixed(2)+'</b></div><div class="stat">HIZ<b>'+s.model.speed.toFixed(2)+'</b></div></div>';for(const r of RESEARCH){let done=s.research.includes(r[0]),lock=s.level<r[4];h+=`<div class="card ${lock?"locked":""}"><div class="icon">⌬</div><div class="ct"><b>${r[1]}</b><span>${done?"TAMAMLANDI":lock?"Seviye "+r[4]+" gerekli":"Üretim x"+r[3]}</span></div><button class="buy" ${done||lock?"disabled":""} onclick="research('${r[0]}')">${done?"AKTİF":"₺"+f(r[2])}</button></div>`}$("research").innerHTML=h}
function renderCompany(){let h=`<div class="office"><b>${officeName()}</b><small>${flowName()} · CEO Lv.${s.ceoLevel} · Piyasa x${marketMult().toFixed(2)}</small><div class="sky">${["🖥️","🏠","🏢","🏙️","🌐","🛰️"][flowStage()]}</div></div><div class="statgrid"><div class="stat">ŞİRKET PAYIN<b>%${s.equity}</b></div><div class="stat">CEO XP<b>${f(s.ceoXP)} / ${f(s.ceoLevel*140)}</b></div><div class="stat">ÇALIŞAN<b>${s.employees.length}</b></div><div class="stat">ÜRÜN<b>${s.products.length}</b></div></div>`;h+='<div class="section">YÖNETİM</div>';h+=`<div class="card"><div class="icon">🧠</div><div class="ct"><b>Akıllı Yönetici</b><span>${s.autoManager?"AKTİF · "+s.autoBuys+" yatırım":"%20 rezerv korur · verimli altyapıyı seçer"}</span></div><button class="buy" onclick="toggleManager()">${s.autoManager?"DURDUR":"BAŞLAT"}</button></div>`;h+=`<div class="card"><div class="icon">₺</div><div class="ct"><b>Yatırım Turu</b><span>Seed → A/B/C → Halka Arz</span></div><button class="buy" ${s.round>=5?"disabled":""} onclick="funding()">${s.round>=5?"TAMAM":"GÖRÜŞ"}</button></div>`;h+='<div class="section">EKİP</div>';EMP.forEach((e,i)=>{let own=s.employees.includes(i);h+=`<div class="card"><div class="icon">♙</div><div class="ct"><b>${e[0]} <i class="rar">${rarity(i)}</i></b><span>${own?"EKİPTE":"Üretim x"+e[2]}</span></div><button class="buy" ${own?"disabled":""} onclick="hire(${i})">${own?"AKTİF":"₺"+f(e[1])}</button></div>`});h+='<div class="section">ÜRÜNLER</div>';PRODUCTS.forEach((x,i)=>{let own=s.products.includes(i),lock=s.level<x[1];h+=`<div class="card ${lock?"locked":""}"><div class="icon">◆</div><div class="ct"><b>${x[0]}</b><span>${own?"PİYASADA":lock?"Seviye "+x[1]+" gerekli":"Gelir x"+x[3]}</span></div><button class="buy" ${own||lock?"disabled":""} onclick="launch(${i})">${own?"CANLI":"₺"+f(x[2])}</button></div>`});$("company").innerHTML=h}
function renderOps(){let h='<div class="section">FİNANS & ZİNCİR</div><div class="statgrid"><div class="stat">BRÜT GELİR<b>₺'+f(gross())+'/sn</b></div><div class="stat">GİDER<b>₺'+f(expenses())+'/sn</b></div><div class="stat">NET MARJ<b>%'+Math.max(0,100-expenses()/Math.max(.01,gross())*100).toFixed(0)+'</b></div><div class="stat">SEZON XP<b>'+f(s.seasonXP)+'</b></div></div><div class="section">DEPARTMANLAR</div>';DEPTS.forEach((d,i)=>{let n=s.depts[i],c=Math.floor(d[2]*Math.pow(2.05,n));h+=`<div class="card"><div class="icon">${d[1]}</div><div class="ct"><b>${d[0]} <i class="qty">Lv.${n}</i></b><span>Her seviye üretimi güçlendirir</span></div><button class="buy" onclick="upgradeDept(${i})">₺${f(c)}</button></div>`});h+='<div class="section">GÖREVLER</div>';MISSIONS.forEach((m,i)=>{let done=s.missions.includes(i);h+=`<div class="card"><div class="icon">${done?"✓":"◎"}</div><div class="ct"><b>${m[0]}</b><span>${done?"TAMAMLANDI":"Ödül ₺"+f(m[2])+" + sandık ilerlemesi"}</span></div><button class="buy" disabled>${done?"ALINDI":"AKTİF"}</button></div>`});h+=`<div class="section">YENİ NESİL</div><div class="card ${s.level<75?"locked":""}"><div class="icon">↻</div><div class="ct"><b>Yeni Nesil</b><span>CEO seviyesi ve olay geçmişi korunur · kalıcı +%25</span></div><button class="buy" ${s.level<75?"disabled":""} onclick="prestige()">BAŞLAT</button></div>`;$("ops").innerHTML=h}
function renderWorld(){let share=Math.min(99,s.level*.48+s.products.length*3+s.cities.length*1.5),h=`<div class="statgrid"><div class="stat">PAZAR PAYI<b>%${share.toFixed(1)}</b></div><div class="stat">MERKEZLER<b>${s.cities.length}</b></div></div><div class="section">RAKİPLER</div><div class="card"><div class="icon">♟</div><div class="ct"><b>Canlı Pazar</b><span>${RIVALS.map((r,i)=>r+" %"+Math.max(1,Math.round(18-i*2-s.level*.07))).join(" · ")}</span></div></div><div class="section">GENİŞLEME</div>`;CITIES.forEach((c,i)=>{let own=s.cities.includes(c[0]),lock=s.level<c[1];h+=`<div class="card ${lock?"locked":""}"><div class="icon">⌖</div><div class="ct"><b>${c[0]}</b><span>${own?"MERKEZ AKTİF":lock?"Seviye "+c[1]+" gerekli":"Yeni pazar"}</span></div><button class="buy" ${own||lock?"disabled":""} onclick="expand(${i})">${own?"AÇIK":"₺"+f(c[2])}</button></div>`});h+='<div class="section">ŞİRKET SATIN ALMA</div>';ACQ.forEach((a,i)=>{let own=s.acq.includes(i),lock=s.level<a[1];h+=`<div class="card ${lock?"locked":""}"><div class="icon">🤝</div><div class="ct"><b>${a[0]}</b><span>${own?"PORTFÖYDE":lock?"Seviye "+a[1]+" gerekli":"Kalıcı üretim x"+a[3]}</span></div><button class="buy" ${own||lock?"disabled":""} onclick="acquire(${i})">${own?"ALINDI":"₺"+f(a[2])}</button></div>`});$("world").innerHTML=h}
function net(){let box=$("net"),want=Math.min(22,Math.floor(s.level/4)),dots=[...box.querySelectorAll(".dot")];while(dots.length>want)dots.pop().remove();while(box.querySelectorAll(".dot").length<want){let d=document.createElement("i"),i=box.querySelectorAll(".dot").length;d.className="dot";let a=i*137.5*Math.PI/180,r=27+(i%4)*7;d.style.left=(49+Math.cos(a)*r)+"px";d.style.top=(49+Math.sin(a)*r)+"px";box.appendChild(d)}}
function renderHUD(){$("money").textContent="₺"+f(s.money);$("rate").textContent="Brüt ₺"+f(gross())+" / sn";$("netrate").textContent="Net ₺"+f(income())+"/sn · Gider ₺"+f(expenses())+"/sn";$("flow").textContent=flowName()+" · Ekosistem x"+ecosystemBonus().toFixed(2)+" · "+countItems()+" yükseltme";$("era").textContent=era();$("level").textContent="SEVİYE "+s.level;let need=100+s.level*22;$("xpbar").style.width=Math.min(100,s.xp/need*100)+"%";net()}
function renderFull(){renderHUD();renderInfra();renderResearch();renderCompany();renderOps();renderWorld()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab,.panel").forEach(x=>x.classList.remove("on"));b.classList.add("on");$(b.dataset.p).classList.add("on")});
let holding=false,last=0,acc=0,raf=0,btn=$("train");function trainTick(){let gain=10+s.level*1.25;s.money+=gain;s.total+=gain;s.xp+=7+Math.sqrt(s.level);s.train++;s.model.speed+=.0004;s.seasonXP++;levelUp();if(s.train%19===0)maybeEvent();checkAll();renderHUD()}function loop(t){if(!holding)return;if(!last)last=t;let dt=Math.min(100,t-last);last=t;acc+=dt;while(acc>=280){acc-=280;trainTick()}raf=requestAnimationFrame(loop)}function start(e){e.preventDefault();if(holding||$("loot").style.display==="flex"||$("decision").style.display==="flex")return;holding=true;last=0;btn.classList.add("active");try{btn.setPointerCapture(e.pointerId)}catch{}raf=requestAnimationFrame(loop)}function stop(e){if(e)e.preventDefault();holding=false;last=0;acc=0;btn.classList.remove("active");if(raf){cancelAnimationFrame(raf);raf=0}save()}btn.addEventListener("pointerdown",start);btn.addEventListener("pointerup",stop);btn.addEventListener("pointercancel",stop);btn.addEventListener("lostpointercapture",stop);document.addEventListener("contextmenu",e=>e.preventDefault());document.addEventListener("visibilitychange",()=>{if(document.hidden)stop()});
let now=Date.now(),away=Math.min(8*3600,Math.max(0,(now-(Number(s.last)||now))/1000));if(away>20){let bonus=income()*away*.5;s.money+=bonus;s.total+=bonus;notice("Offline üretim +₺"+f(bonus));toast("OFFLINE +₺"+f(bonus))}s.last=now;scheduleChest();checkAll();renderFull();
setInterval(chestTick,1000);setInterval(smartUpgrade,4500);setInterval(()=>{let inc=income()/5;s.money+=inc;s.total+=inc;if(Math.random()<.004)maybeEvent();maybeDecision();renderHUD()},200);setInterval(()=>{renderFull();save()},5000);
</script></body></html>
