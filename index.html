<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <title>MBK Grafik AI</title>

  <style>
    :root{
      --bg:#090b10;
      --card:#121722;
      --card2:#171d29;
      --border:#293142;
      --text:#f7f8fb;
      --muted:#98a2b3;
      --green:#39d98a;
      --red:#ff687d;
      --yellow:#ffd54a;
      --blue:#74a8ff;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      padding:
        calc(14px + env(safe-area-inset-top))
        14px
        calc(30px + env(safe-area-inset-bottom));
    }

    .app{
      max-width:620px;
      margin:auto;
    }

    .header{
      margin:8px 2px 18px;
    }

    .title{
      font-size:28px;
      font-weight:900;
      letter-spacing:-.8px;
    }

    .subtitle{
      margin-top:5px;
      color:var(--muted);
      font-size:13px;
    }

    .card{
      background:linear-gradient(180deg,var(--card2),var(--card));
      border:1px solid var(--border);
      border-radius:20px;
      padding:16px;
      margin-bottom:12px;
      box-shadow:0 10px 30px rgba(0,0,0,.18);
    }

    .controls{
      display:grid;
      gap:10px;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    input,select,button{
      width:100%;
      min-height:48px;
      border-radius:14px;
      border:1px solid var(--border);
      background:#0d1118;
      color:var(--text);
      font-size:16px;
      padding:12px 13px;
      outline:none;
    }

    input:focus,select:focus{
      border-color:var(--blue);
    }

    button{
      background:#f4f6fb;
      color:#10131a;
      font-weight:900;
      border:0;
      cursor:pointer;
    }

    button:active{
      transform:scale(.99);
    }

    .mini-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .mini{
      background:#0d1118;
      border:1px solid var(--border);
      border-radius:15px;
      padding:13px;
    }

    .label{
      color:var(--muted);
      font-size:12px;
      margin-bottom:5px;
    }

    .value{
      font-size:17px;
      font-weight:800;
    }

    .hero{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
    }

    .symbol{
      font-size:25px;
      font-weight:900;
    }

    .price{
      font-size:24px;
      font-weight:900;
      text-align:right;
    }

    .pill{
      display:inline-block;
      margin-top:8px;
      padding:6px 9px;
      border:1px solid var(--border);
      border-radius:999px;
      color:var(--muted);
      font-size:12px;
    }

    .section-title{
      font-weight:900;
      margin:0 0 12px;
    }

    .level,.target{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:10px 0;
      border-bottom:1px solid rgba(255,255,255,.06);
      font-size:14px;
    }

    .level:last-child,.target:last-child{
      border-bottom:0;
    }

    .green{color:var(--green)}
    .red{color:var(--red)}
    .yellow{color:var(--yellow)}
    .blue{color:var(--blue)}

    .hidden{display:none}

    .loading{
      text-align:center;
      color:var(--muted);
      padding:22px;
    }

    .error{
      color:var(--red);
      line-height:1.5;
    }

    .summary{
      color:#d9dee7;
      line-height:1.55;
      font-size:14px;
    }

    .footer{
      text-align:center;
      color:var(--muted);
      font-size:11px;
      padding:8px 4px 20px;
    }

    .backend{
      font-size:13px;
    }
  </style>
</head>

<body>
<div class="app">

  <div class="header">
    <div class="title">📈 MBK Grafik AI</div>
    <div class="subtitle">Mobil teknik analiz ve karar destek sistemi</div>
  </div>

  <div class="card controls">
    <input id="backend" class="backend" value="http://127.0.0.1:8000" placeholder="Backend adresi">

    <input id="symbol" value="AAPL" placeholder="Hisse sembolü: AAPL, NVDA, IMMP">

    <div class="row">
      <select id="period">
        <option value="1mo">1 Ay</option>
        <option value="3mo" selected>3 Ay</option>
        <option value="6mo">6 Ay</option>
        <option value="1y">1 Yıl</option>
      </select>

      <select id="interval">
        <option value="5m">5 Dakika</option>
        <option value="15m">15 Dakika</option>
        <option value="30m">30 Dakika</option>
        <option value="1h">1 Saat</option>
        <option value="1d" selected>Günlük</option>
      </select>
    </div>

    <button onclick="runAnalysis()">ANALİZ ET</button>
  </div>

  <div id="loading" class="card loading hidden">
    Analiz hazırlanıyor...
  </div>

  <div id="errorBox" class="card error hidden"></div>

  <div id="result" class="hidden">

    <div class="card">
      <div class="hero">
        <div>
          <div id="resSymbol" class="symbol"></div>
          <div id="resTrend" class="pill"></div>
        </div>
        <div>
          <div class="label" style="text-align:right">Fiyat</div>
          <div id="resPrice" class="price"></div>
        </div>
      </div>
    </div>

    <div class="mini-grid">
      <div class="mini">
        <div class="label">Momentum</div>
        <div id="resMomentum" class="value"></div>
      </div>

      <div class="mini">
        <div class="label">Hacim</div>
        <div id="resVolume" class="value"></div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">⭐ Kritik Seviyeler</div>

      <div class="mini-grid">
        <div>
          <div class="label green">Destek</div>
          <div id="supports"></div>
        </div>

        <div>
          <div class="label red">Direnç</div>
          <div id="resistances"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Strateji</div>

      <div class="level">
        <span>Giriş bölgesi</span>
        <strong id="entryZone" class="blue"></strong>
      </div>

      <div class="level">
        <span>Stop</span>
        <strong id="stop" class="red"></strong>
      </div>

      <div class="level">
        <span>Risk / Ödül</span>
        <strong id="rr"></strong>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Hedefler</div>
      <div id="targets"></div>
    </div>

    <div class="card">
      <div class="section-title">İndikatörler</div>

      <div class="mini-grid">
        <div class="mini">
          <div class="label">RSI</div>
          <div id="rsi" class="value"></div>
        </div>

        <div class="mini">
          <div class="label">MACD</div>
          <div id="macd" class="value"></div>
        </div>

        <div class="mini">
          <div class="label">EMA 20</div>
          <div id="ema20" class="value"></div>
        </div>

        <div class="mini">
          <div class="label">VWAP</div>
          <div id="vwap" class="value"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">AI Yorumu</div>
      <div id="summary" class="summary"></div>
    </div>

  </div>

  <div class="footer">
    Yatırım tavsiyesi değildir • MBK Grafik AI
  </div>
</div>

<script>
function fmt(v){
  if(v === null || v === undefined) return "-";
  const n = Number(v);
  if(Math.abs(n) >= 100) return n.toFixed(2);
  if(Math.abs(n) >= 1) return n.toFixed(3);
  return n.toFixed(4);
}

function show(id, visible){
  document.getElementById(id).classList.toggle("hidden", !visible);
}

async function runAnalysis(){
  const backend = document.getElementById("backend").value.trim().replace(/\/+$/, "");
  const symbol = document.getElementById("symbol").value.trim().toUpperCase();
  const period = document.getElementById("period").value;
  const interval = document.getElementById("interval").value;

  if(!backend || !symbol){
    document.getElementById("errorBox").textContent = "Backend adresi ve hisse sembolü gerekli.";
    show("errorBox", true);
    return;
  }

  show("loading", true);
  show("errorBox", false);
  show("result", false);

  try{
    const url = `${backend}/analyze?symbol=${encodeURIComponent(symbol)}&period=${period}&interval=${interval}`;
    const response = await fetch(url);
    const data = await response.json();

    if(!response.ok){
      throw new Error(data.detail || "Analiz yapılamadı.");
    }

    document.getElementById("resSymbol").textContent = data.symbol;
    document.getElementById("resPrice").textContent = fmt(data.price);
    document.getElementById("resTrend").textContent = data.trend;
    document.getElementById("resMomentum").textContent = data.momentum;
    document.getElementById("resVolume").textContent = data.volume_status;

    document.getElementById("supports").innerHTML =
      data.supports?.length
      ? data.supports.map(x => `
          <div class="level">
            <span>⭐ ${fmt(x.price)}</span>
            <small>-%${x.distance_pct}</small>
          </div>
        `).join("")
      : `<div class="level"><span>Bulunamadı</span></div>`;

    document.getElementById("resistances").innerHTML =
      data.resistances?.length
      ? data.resistances.map(x => `
          <div class="level">
            <span>⭐ ${fmt(x.price)}</span>
            <small>+%${x.distance_pct}</small>
          </div>
        `).join("")
      : `<div class="level"><span>Bulunamadı</span></div>`;

    document.getElementById("entryZone").textContent =
      `${fmt(data.entry_zone?.[0])} – ${fmt(data.entry_zone?.[1])}`;

    document.getElementById("stop").textContent = fmt(data.stop);

    document.getElementById("rr").textContent =
      data.risk_reward === null || data.risk_reward === undefined
      ? "-"
      : `1 : ${data.risk_reward}`;

    document.getElementById("targets").innerHTML =
      data.targets?.length
      ? data.targets.map((x,i) => `
          <div class="target">
            <span>Hedef ${i+1}: <strong>${fmt(x.price)}</strong></span>
            <strong class="green">+%${x.profit_pct}</strong>
          </div>
        `).join("")
      : `<div class="target"><span>Hedef bulunamadı</span></div>`;

    document.getElementById("rsi").textContent = fmt(data.indicators?.rsi);
    document.getElementById("macd").textContent = fmt(data.indicators?.macd);
    document.getElementById("ema20").textContent = fmt(data.indicators?.ema20);
    document.getElementById("vwap").textContent = fmt(data.indicators?.vwap);
    document.getElementById("summary").textContent = data.summary || "-";

    show("result", true);

  }catch(err){
    document.getElementById("errorBox").textContent =
      err.message + " Backend internetteyse HTTPS adresini yazdığından emin ol.";
    show("errorBox", true);
  }finally{
    show("loading", false);
  }
}

document.getElementById("symbol").addEventListener("keydown", e=>{
  if(e.key === "Enter") runAnalysis();
});
</script>

</body>
</html>
