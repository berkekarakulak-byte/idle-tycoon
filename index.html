<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Zaman Fabrikası Tycoon</title>
<style>
  :root{
    --bg:#0b0d14;--panel:#131827;--panel2:#1a2133;--text:#f4f7ff;
    --muted:#8d98b5;--accent:#7c5cff;--accent2:#22d3ee;--good:#35d07f;
    --danger:#ff5c7a;--border:#27304a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at top,#171d33 0,#0b0d14 40%);color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
  button{font:inherit}
  .app{max-width:980px;margin:auto;padding:12px}
  .top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  .brand h1{margin:0;font-size:21px}.brand p{margin:4px 0 0;color:var(--muted)}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .pill{background:rgba(19,24,39,.9);border:1px solid var(--border);border-radius:11px;padding:7px 10px}
  .pill b{display:block;font-size:15px}.pill span{font-size:12px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
  .panel{background:rgba(19,24,39,.92);border:1px solid var(--border);border-radius:15px;padding:12px;box-shadow:0 16px 45px #0005}
  .clockWrap{text-align:center;padding:12px 8px}
  .clock{width:165px;height:165px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;
    background:conic-gradient(var(--accent2) 0 25%,var(--accent) 25% 60%,#252c42 60%);
    box-shadow:0 0 55px #7c5cff33;position:relative;cursor:pointer;user-select:none;transition:.12s transform}
  .clock:active{transform:scale(.965)}
  .clock::before{content:"";position:absolute;inset:12px;background:#101522;border-radius:50%;border:1px solid #303a57}
  .clock .inner{position:relative;z-index:2}.clock .big{font-size:25px;font-weight:900}.clock .small{color:var(--muted);font-size:13px}
  .gain{font-size:13px;color:var(--good);min-height:20px}
  .sectionTitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .sectionTitle h2{font-size:17px;margin:0}.sectionTitle span{color:var(--muted);font-size:12px}
  .machines{display:grid;gap:10px}
  .machine{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:8px}
  .icon{width:36px;height:36px;border-radius:9px;background:#242b43;display:grid;place-items:center;font-size:22px}
  .info{flex:1}.info b{display:block}.info small{color:var(--muted)}
  .buy{border:0;background:linear-gradient(135deg,var(--accent),#5f81ff);color:white;border-radius:11px;padding:9px 12px;font-weight:800;cursor:pointer}
  .buy:disabled{opacity:.35;cursor:not-allowed}
  .era{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:14px}
  .era button{white-space:nowrap;border:1px solid var(--border);background:#171d2c;color:var(--muted);padding:8px 10px;border-radius:10px}
  .era button.active{background:#2a2450;color:#fff;border-color:#684fff}
  .progress{height:10px;border-radius:99px;background:#252c42;overflow:hidden;margin:8px 0 16px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:0%}
  .upgrades{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .upgrade{background:#171d2c;border:1px solid var(--border);border-radius:10px;padding:9px}
  .upgrade b{font-size:14px}.upgrade p{font-size:12px;color:var(--muted);min-height:32px}
  .upgrade button{width:100%;border:0;border-radius:9px;background:#24304a;color:white;padding:8px;cursor:pointer}
  .prestige{margin-top:14px;background:linear-gradient(135deg,#291c45,#16294a);border:1px solid #5d46a8;border-radius:16px;padding:14px}
  .prestige button{width:100%;border:0;border-radius:11px;background:linear-gradient(135deg,#d946ef,#7c5cff);color:white;padding:11px;font-weight:900;cursor:pointer}
  .footer{color:var(--muted);font-size:12px;text-align:center;margin-top:18px}
  .float{position:fixed;pointer-events:none;font-weight:900;color:var(--accent2);animation:fly .8s ease-out forwards}
  @keyframes fly{to{transform:translateY(-65px);opacity:0}}
  @media(max-width:820px){.app{padding:8px}.grid{grid-template-columns:1fr;gap:10px}.top{margin-bottom:10px}.clock{width:145px;height:145px}.upgrades{grid-template-columns:1fr 1fr}.panel{padding:10px}.machine{padding:7px}.brand p{font-size:12px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <h1>⏳ Zaman Fabrikası Tycoon</h1>
      
    </div>
    <div class="stats">
      <div class="pill"><b id="seconds">0</b><span>Toplam Saniye</span></div>
      <div class="pill"><b id="sps">0/sn</b><span>Pasif Üretim</span></div>
      <div class="pill"><b id="paradox">0</b><span>Paradoks</span></div>
    </div>
  </div>

  <div class="grid">
    <section class="panel">
      <div class="clockWrap">
        <div class="clock" id="clock">
          <div class="inner">
            <div class="big">+<span id="clickPower">1</span>s</div>
            
          </div>
        </div>
        <div class="gain" id="gain"></div>
      </div>

      <div class="sectionTitle"><h2>⚙️ Zaman Makineleri</h2></div>
      <div class="machines" id="machines"></div>
    </section>

    <aside class="panel">
      <div class="sectionTitle"><h2>🌀 Çağ Haritası</h2><span id="eraText">İlkel Çağ</span></div>
      <div class="era" id="eras"></div>
      <div class="progress"><i id="eraProgress"></i></div>

      <div class="sectionTitle"><h2>🧠 Araştırmalar</h2></div>
      <div class="upgrades" id="upgrades"></div>

      <div class="prestige">
        <b>💠 Büyük Paradoks</b>
        
        <p><strong>Kazanacağın:</strong> <span id="paradoxGain">0</span> Paradoks</p>
        <button id="prestigeBtn">Zaman Çizgisini Kır</button>
      </div>
    </aside>
  </div>
  
</div>

<script>
const machineDefs=[
  {name:"Cep Saati Atölyesi",icon:"⌚",base:15,prod:1},
  {name:"Kronometre Hattı",icon:"⏱️",base:120,prod:6},
  {name:"Atom Saati Laboratuvarı",icon:"⚛️",base:900,prod:35},
  {name:"Zaman Portalı",icon:"🌀",base:6500,prod:180},
  {name:"Kara Delik Reaktörü",icon:"🕳️",base:42000,prod:950}
];
const eraDefs=[
  {name:"İlkel Çağ",need:0},{name:"Sanayi Çağı",need:500},{name:"Dijital Çağ",need:5000},
  {name:"Kuantum Çağı",need:50000},{name:"Ölümsüzlük Çağı",need:500000}
];
const upgradeDefs=[
  {id:"click2",name:"Güçlü Dokunuş",desc:"Tıklama gücünü 2× yapar.",cost:250,type:"click",mult:2},
  {id:"auto2",name:"Hızlandırılmış Akış",desc:"Tüm makinelerin üretimini 2× yapar.",cost:1500,type:"auto",mult:2},
  {id:"click5",name:"Zaman Eldiveni",desc:"Tıklama gücünü 5× yapar.",cost:7500,type:"click",mult:5},
  {id:"auto3",name:"Kuantum Senkronu",desc:"Tüm makinelerin üretimini 3× yapar.",cost:25000,type:"auto",mult:3}
];
let state={seconds:0,total:0,paradox:0,machines:[0,0,0,0,0],upgrades:[],clickMult:1,autoMult:1};

try{
  const saved=JSON.parse(localStorage.getItem("zamanTycoonSave"));
  if(saved) state={...state,...saved};
}catch(e){}

const $=id=>document.getElementById(id);
const fmt=n=>{
  if(n<1000)return Math.floor(n).toLocaleString("tr-TR");
  const u=[["K",1e3],["M",1e6],["B",1e9],["T",1e12]];
  for(let i=u.length-1;i>=0;i--) if(n>=u[i][1]) return (n/u[i][1]).toFixed(n/u[i][1]>=100?0:1)+u[i][0];
  return Math.floor(n);
};
function paradoxMult(){return 1+state.paradox*.25}
function sps(){
  return machineDefs.reduce((a,m,i)=>a+m.prod*state.machines[i],0)*state.autoMult*paradoxMult();
}
function clickPower(){return state.clickMult*paradoxMult()}
function machineCost(i){return Math.floor(machineDefs[i].base*Math.pow(1.17,state.machines[i]))}
function prestigeGain(){return Math.floor(Math.sqrt(state.total/100000))}
function currentEra(){
  let idx=0;
  eraDefs.forEach((e,i)=>{if(state.total>=e.need)idx=i});
  return idx;
}
function renderMachines(){
  $("machines").innerHTML=machineDefs.map((m,i)=>`
    <div class="machine">
      <div class="icon">${m.icon}</div>
      <div class="info"><b>${m.name}</b><small>${state.machines[i]} adet • +${fmt(m.prod*state.autoMult*paradoxMult())}/sn</small></div>
      <button class="buy" onclick="buyMachine(${i})" ${state.seconds<machineCost(i)?"disabled":""}>${fmt(machineCost(i))}s</button>
    </div>`).join("");
}
function renderUpgrades(){
  $("upgrades").innerHTML=upgradeDefs.map(u=>{
    const bought=state.upgrades.includes(u.id);
    return `<div class="upgrade"><b>${u.name}</b><p>${u.desc}</p>
      <button onclick="buyUpgrade('${u.id}')" ${bought||state.seconds<u.cost?"disabled":""}>
      ${bought?"Alındı":fmt(u.cost)+"s"}</button></div>`;
  }).join("");
}
function renderEras(){
  const cur=currentEra();
  $("eras").innerHTML=eraDefs.map((e,i)=>`<button class="${i===cur?"active":""}">${e.name}</button>`).join("");
  $("eraText").textContent=eraDefs[cur].name;
  const next=eraDefs[cur+1];
  let pct=100;
  if(next){
    const start=eraDefs[cur].need;
    pct=Math.max(0,Math.min(100,(state.total-start)/(next.need-start)*100));
  }
  $("eraProgress").style.width=pct+"%";
}
function render(){
  $("seconds").textContent=fmt(state.seconds);
  $("sps").textContent=fmt(sps())+"/sn";
  $("paradox").textContent=fmt(state.paradox);
  $("clickPower").textContent=fmt(clickPower());
  $("paradoxGain").textContent=prestigeGain();
  $("prestigeBtn").disabled=prestigeGain()<1;
  renderMachines();renderUpgrades();renderEras();
}
function buyMachine(i){
  const c=machineCost(i);
  if(state.seconds>=c){state.seconds-=c;state.machines[i]++;render();}
}
function buyUpgrade(id){
  const u=upgradeDefs.find(x=>x.id===id);
  if(!u||state.upgrades.includes(id)||state.seconds<u.cost)return;
  state.seconds-=u.cost;state.upgrades.push(id);
  if(u.type==="click")state.clickMult*=u.mult;
  if(u.type==="auto")state.autoMult*=u.mult;
  render();
}
$("clock").addEventListener("click",e=>{
  const gain=clickPower(); state.seconds+=gain;state.total+=gain;
  
  const f=document.createElement("div");f.className="float";f.textContent="+"+fmt(gain)+"s";
  f.style.left=e.clientX+"px";f.style.top=e.clientY+"px";document.body.appendChild(f);
  setTimeout(()=>f.remove(),800);render();
});
$("prestigeBtn").onclick=()=>{
  const g=prestigeGain(); if(g<1)return;
  state={seconds:0,total:0,paradox:state.paradox+g,machines:[0,0,0,0,0],upgrades:[],clickMult:1,autoMult:1};
  
  render();
};
setInterval(()=>{
  const gain=sps()/10; state.seconds+=gain;state.total+=gain;
},100);
setInterval(()=>{render();localStorage.setItem("zamanTycoonSave",JSON.stringify(state));},1000);
render();
</script>
</body>
</html>
