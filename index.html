<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090a0d"><title>Yeraltına Doğru: Kayıp Maden</title>
<style>
:root{--p:#15171d;--l:#ffffff14;--g:#efb44b;--t:#aaa;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090a0d;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}body{overscroll-behavior:none}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:var(--st);background:#0d0e12}header{padding:8px 10px;background:#101116;border-bottom:1px solid var(--l)}.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:900}.chapter{font-size:10px;color:#bbb}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.stat{background:#191b21;border:1px solid var(--l);border-radius:11px;padding:6px;text-align:center;font-size:10px}.stat b{display:block;font-size:15px;margin-top:1px}
#mine{position:relative;flex:1;min-height:0;overflow:hidden;display:grid;place-items:center;background:#493326;transition:.5s}.texture{position:absolute;inset:0;opacity:.23;background-image:radial-gradient(#fff3 1px,transparent 1px);background-size:20px 20px}
#objective{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:min(86%,390px);background:#0b0c0fdd;border:1px solid var(--l);border-radius:12px;padding:7px 10px;text-align:center;font-size:10px;z-index:2}#objective b{display:block;font-size:11px}
#rock{position:relative;width:min(64vw,295px,39vh);aspect-ratio:1;border:0;border-radius:45% 55% 50% 50%;background:linear-gradient(145deg,#756a63,#302b28);box-shadow:inset -25px -25px 45px #0009,0 18px 42px #0009;color:#fff;font-size:68px;display:grid;place-items:center}.hit{animation:h .09s}@keyframes h{50%{transform:scale(.93) rotate(-2deg)}}#hp{position:absolute;bottom:-34px;width:88%;font-size:10px;font-weight:800;text-align:center}.bar{height:9px;background:#0009;border-radius:99px;overflow:hidden;margin-top:4px}.fill{height:100%;background:var(--g);transition:.08s}
#progress{position:absolute;bottom:12px;left:10px;right:10px;font-size:9px;color:#ccc}.pbar{height:5px;background:#0008;border-radius:99px;overflow:hidden;margin-top:4px}.pfill{height:100%;background:#fff8}
.float{position:fixed;z-index:50;font-weight:900;font-size:19px;pointer-events:none;animation:f .55s forwards}@keyframes f{to{transform:translateY(-60px);opacity:0}}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:#101116;border-top:1px solid var(--l);padding:7px 8px calc(7px + var(--sb))}.nav{border:0;background:#1b1d23;color:#ccc;border-radius:10px;padding:8px 2px;font-size:10px;font-weight:800}.nav.main{background:#30333b;color:white}
.sheet{position:absolute;z-index:30;left:0;right:0;bottom:0;max-height:67vh;overflow:auto;background:#111319;border-radius:20px 20px 0 0;border-top:1px solid #ffffff22;padding:14px 12px calc(14px + var(--sb));transform:translateY(110%);transition:.22s}.sheet.open{transform:none}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.close,.buy,.storybtn{border:0;border-radius:9px;background:#30333b;color:#fff;padding:8px;font-weight:800}.card{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#1a1c22;border:1px solid var(--l);border-radius:12px;padding:10px;margin:7px 0;font-size:12px}.card small{display:block;color:#999;margin-top:2px}.buy:disabled{opacity:.4}.log{background:#1a1c22;border-left:3px solid #777;padding:9px;margin:7px 0;border-radius:6px;font-size:11px;color:#ddd}.log.lock{opacity:.35}
#story{position:absolute;z-index:60;inset:0;background:#08090cf2;display:none;align-items:flex-end;padding:14px 12px calc(14px + var(--sb))}.dialog{width:100%;background:#15171d;border:1px solid #ffffff20;border-radius:16px;padding:14px}.speaker{font-size:11px;color:var(--g);font-weight:900;margin-bottom:6px}.text{font-size:14px;line-height:1.45;min-height:60px}.storybtn{width:100%;margin-top:10px;background:#333741}
#toast{position:absolute;z-index:70;top:75px;left:50%;transform:translateX(-50%);background:#101116ee;border:1px solid var(--l);padding:8px 11px;border-radius:10px;font-size:11px;font-weight:800;display:none;white-space:nowrap}
</style></head><body><div id="app">
<header><div class="top"><span>⛏️ KAYIP MADEN</span><span class="chapter" id="chapter"></span></div><div class="stats"><div class="stat">💎 Maden<b id="coins">0</b></div><div class="stat">⬇️ Derinlik<b><span id="depth">0</span> m</b></div><div class="stat">⚡ Güç<b id="power">1</b></div></div></header>
<main id="mine"><div class="texture"></div><div id="toast"></div><div id="objective"></div><button id="rock">🪨<div id="hp"><span id="hptext"></span><div class="bar"><div class="fill" id="hpbar"></div></div></div></button><div id="progress"><span id="next"></span><div class="pbar"><div class="pfill" id="pfill"></div></div></div></main>
<nav><button class="nav" data-open="upgrades">🔧<br>Geliştir</button><button class="nav main" id="dig">⛏️<br>Kaz</button><button class="nav" data-open="journal">📖<br>Günlük</button><button class="nav" data-open="bag">🎒<br>Çanta</button></nav>
<section class="sheet" id="upgrades"><div class="head"><b>🔧 Ekipman</b><button class="close">Kapat</button></div><div class="card"><div><b>⛏️ Kazma</b><small>Dokunma hasarı +1</small></div><button class="buy" id="bp"></button></div><div class="card"><div><b>⚙️ Otomatik Matkap</b><small>Saniyede otomatik hasar</small></div><button class="buy" id="ba"></button></div><div class="card"><div><b>🎯 Kritik</b><small>+2% kritik şansı</small></div><button class="buy" id="bc"></button></div></section>
<section class="sheet" id="journal"><div class="head"><b>📖 Bulunan Kayıtlar</b><button class="close">Kapat</button></div><div id="logs"></div></section>
<section class="sheet" id="bag"><div class="head"><b>🎒 Çanta</b><button class="close">Kapat</button></div><div id="items"></div></section>
<div id="story"><div class="dialog"><div class="speaker" id="speaker"></div><div class="text" id="storytext"></div><button class="storybtn" id="continue">Devam</button></div></div>
</div><script>
"use strict";const $=x=>document.getElementById(x),KEY="kayip_maden_v4";
const DEF={coins:0,depth:0,power:1,auto:0,crit:5,pc:15,ac:50,cc:75,hp:12,max:12,copper:0,silver:0,gold:0,crystal:0,story:0,last:Date.now()};
let s;try{s=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch{s={...DEF}};for(const k in DEF)if(typeof DEF[k]=="number"&&!Number.isFinite(+s[k]))s[k]=DEF[k];
const chapters=[
{at:0,end:100,name:"Bölüm I — İlk Kazı",goal:"Eski maden girişine ulaş: 100 m",bg:"#493326"},
{at:100,end:350,name:"Bölüm II — Terk Edilmiş Maden",goal:"Kayıp asansörü bul: 350 m",bg:"#292a2c"},
{at:350,end:800,name:"Bölüm III — Sessiz Tüneller",goal:"Madenci kayıtlarının kaynağını bul: 800 m",bg:"#25242c"},
{at:800,end:1500,name:"Bölüm IV — Unutulmuş Şehir",goal:"Mühürlü kapıya ulaş: 1.500 m",bg:"#30261e"},
{at:1500,end:2500,name:"Bölüm V — Canlı Mağara",goal:"Nabzın kaynağına ulaş: 2.500 m",bg:"#301b20"},
{at:2500,end:5000,name:"Bölüm VI — Magma Denizi",goal:"Çekirdek geçidine ulaş: 5.000 m",bg:"#481b14"},
{at:5000,end:10000,name:"Bölüm VII — Çekirdek",goal:"Sinyalin kaynağını bul: 10.000 m",bg:"#430d09"},
{at:10000,end:12000,name:"Bölüm VIII — Aşağısı",goal:"Haritanın bittiği yerin ötesine geç.",bg:"#08070b"}];
const events=[
{d:0,sp:"Berke",t:"Yıllardır kapalı duran maden bugün yeniden açıldı. Resmî kayıtlara göre sebep bir göçük. Ama girişteki çelik kapı, içeridekini dışarıda tutmak için yapılmış gibi."},
{d:100,sp:"Eski Telsiz",t:"...duyan varsa aşağı inmeyin. Göçük değildi. Kapıyı biz kapattık."},
{d:350,sp:"Madenci Günlüğü #17",t:"Asansör aşağıdan kendi kendine geri geliyor. Kimse çağırmıyor. Dün kabinin içinde ıslak ayak izleri vardı."},
{d:800,sp:"Berke",t:"Taş duvar bitti. Karşımda insan eliyle yapılmış dev sütunlar var. Bu derinlikte bir şehir olmaması gerekiyor."},
{d:1500,sp:"Madenci Günlüğü #31",t:"Duvarın titreştiğini söyledim, kimse inanmadı. Sonra hepimiz aynı anda kalp atışını duyduk."},
{d:2500,sp:"Bilinmeyen Sinyal",t:"AŞAĞI GEL."},
{d:5000,sp:"Berke",t:"Pusula dönüyor. Sıcaklık olması gerekenden düşük. Aşağıdan düzenli bir metal sesi geliyor."},
{d:10000,sp:"???",t:"Sonunda geldin. Burası Dünya'nın çekirdeği değil."}];
function chap(){let c=chapters[0];for(const x of chapters)if(s.depth>=x.at)c=x;return c}
function save(){s.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}let sv;function qs(){clearTimeout(sv);sv=setTimeout(save,180)}
function ui(){let c=chap();$("chapter").textContent=c.name;$("objective").innerHTML="<b>HEDEF</b>"+c.goal;$("mine").style.background=c.bg;$("coins").textContent=Math.floor(s.coins).toLocaleString("tr-TR");$("depth").textContent=s.depth.toLocaleString("tr-TR");$("power").textContent=s.power;$("hptext").textContent=Math.ceil(s.hp)+" / "+Math.ceil(s.max);$("hpbar").style.width=Math.max(0,100*s.hp/s.max)+"%";let pct=Math.max(0,Math.min(100,(s.depth-c.at)/(c.end-c.at)*100));$("pfill").style.width=pct+"%";$("next").textContent=s.depth<c.end?(c.end-s.depth)+" m kaldı":"Bölüm tamamlandı";$("bp").textContent=s.pc+" 💎";$("ba").textContent=s.ac+" 💎";$("bc").textContent=s.cc+" 💎";$("bp").disabled=s.coins<s.pc;$("ba").disabled=s.coins<s.ac;$("bc").disabled=s.coins<s.cc;renderBag();renderLogs();qs()}
function renderBag(){$("items").innerHTML=[["🟤 Bakır",s.copper],["⚪ Gümüş",s.silver],["🟡 Altın",s.gold],["💠 Kristal",s.crystal]].map(x=>`<div class="card"><b>${x[0]}</b><b>${x[1]}</b></div>`).join("")}
function renderLogs(){$("logs").innerHTML=events.map((e,i)=>`<div class="log ${i<s.story?"":"lock"}"><b>${i<s.story?e.sp:"🔒 Kilitli Kayıt"}</b><br>${i<s.story?e.t:"Daha derine in."}</div>`).join("")}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";clearTimeout(toast.x);toast.x=setTimeout(()=>$("toast").style.display="none",1600)}
let storyQueue=[];function checkStory(){while(s.story<events.length&&s.depth>=events[s.story].d){storyQueue.push(events[s.story]);s.story++}if(storyQueue.length&&$("story").style.display!="flex")showStory()}
function showStory(){let e=storyQueue[0];if(!e)return;$("speaker").textContent=e.sp;$("storytext").textContent=e.t;$("story").style.display="flex";ui()}
$("continue").onclick=()=>{storyQueue.shift();if(storyQueue.length)showStory();else $("story").style.display="none"};
function loot(){let r=Math.random();if(r<.12){s.copper++;s.coins+=2}if(s.depth>300&&r>.93){s.silver++;s.coins+=5;toast("⚪ Gümüş buldun")}if(s.depth>1000&&r>.975){s.gold++;s.coins+=12;toast("🟡 Altın buldun")}if(s.depth>2500&&r>.995){s.crystal++;s.coins+=40;toast("💠 Nadir kristal!")}}
function broken(){s.depth++;s.coins+=Math.max(1,Math.floor(s.max/7))+Math.floor(Math.random()*3);loot();s.max=12+Math.floor(s.depth*1.25);s.hp=s.max;if(s.depth%100===0){s.coins+=35;toast("🎁 Derinlik bonusu +35 💎")}checkStory()}
function damage(n){s.hp-=n;let guard=0;while(s.hp<=0&&guard++<10000){let carry=-s.hp;broken();s.hp-=carry}ui()}
function fl(x,y,t){let p=document.createElement("div");p.className="float";p.textContent=t;p.style.left=x+"px";p.style.top=y+"px";document.body.appendChild(p);setTimeout(()=>p.remove(),600)}
let lt=0;$("rock").addEventListener("pointerdown",e=>{e.preventDefault();if($("story").style.display=="flex")return;let n=performance.now();if(n-lt<55)return;lt=n;let cr=Math.random()*100<s.crit,d=s.power*(cr?3:1);$("rock").classList.remove("hit");void $("rock").offsetWidth;$("rock").classList.add("hit");fl(e.clientX-10,e.clientY-15,cr?"💥 "+d:"-"+d);damage(d)},{passive:false});
$("bp").onclick=()=>{if(s.coins>=s.pc){s.coins-=s.pc;s.power++;s.pc=Math.ceil(s.pc*1.5);ui()}};$("ba").onclick=()=>{if(s.coins>=s.ac){s.coins-=s.ac;s.auto++;s.ac=Math.ceil(s.ac*1.7);ui()}};$("bc").onclick=()=>{if(s.coins>=s.cc&&s.crit<45){s.coins-=s.cc;s.crit+=2;s.cc=Math.ceil(s.cc*1.6);ui()}};
document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{$(b.dataset.open).classList.add("open")});document.querySelectorAll(".close").forEach(b=>b.onclick=()=>b.closest(".sheet").classList.remove("open"));$("dig").onclick=()=>document.querySelectorAll(".sheet").forEach(x=>x.classList.remove("open"));
let acc=0,last=performance.now();function loop(t){let dt=Math.min(1000,t-last);last=t;if(s.auto&&$("story").style.display!="flex"){acc+=dt;if(acc>=1000){let k=Math.floor(acc/1000);acc-=k*1000;damage(s.auto*k)}}requestAnimationFrame(loop)}
function offline(){let sec=Math.min(14400,Math.max(0,(Date.now()-(+s.last||Date.now()))/1000));if(s.auto&&sec>15){let gain=Math.floor(sec*s.auto/10);s.coins+=gain;toast("⚙️ Çevrimdışı +"+gain+" 💎")}}
document.addEventListener("visibilitychange",()=>{if(document.hidden)save();else last=performance.now()});window.addEventListener("pagehide",save);
offline();checkStory();ui();requestAnimationFrame(loop);
</script></body></html>
