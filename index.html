<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#05060a"><title>1 Piksel</title>
<style>
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--glass:#11131acc;--line:#ffffff16}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}html,body{position:fixed;inset:0;margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#05060a;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--st);padding-bottom:var(--sb);overflow:hidden;background:radial-gradient(circle at 50% 46%,#10131d,#05060a 68%)}
header{z-index:10;flex:0 0 auto;padding:9px 11px 7px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:13px;font-weight:950;letter-spacing:2px}.count{font-size:10px;color:#a8a9b1;background:#ffffff0c;border:1px solid var(--line);padding:5px 8px;border-radius:99px}
#chapter{margin-top:7px;font-size:9px;color:#7f818b;letter-spacing:.7px}.track{height:3px;background:#ffffff0c;border-radius:9px;overflow:hidden;margin-top:5px}.track i{display:block;height:100%;width:0;background:#fff;transition:.2s}
#world{position:relative;flex:1;min-height:0;overflow:hidden;display:grid;place-items:center}
#space{position:absolute;inset:0;pointer-events:none}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:white;animation:twinkle 2.5s infinite alternate}@keyframes twinkle{to{opacity:.18;transform:scale(.65)}}
.orbit{position:absolute;left:50%;top:50%;border:1px solid #ffffff10;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.planet{position:absolute;border-radius:50%;pointer-events:none;box-shadow:inset -8px -7px 14px #0008,0 0 25px #4a8ab622}
#instruction{position:absolute;top:5%;width:82%;text-align:center;color:#a4a5ad;font-size:11px;line-height:1.4;transition:.4s}
#pixelWrap{position:relative;z-index:5;display:grid;place-items:center;width:150px;height:150px}
#pixel{border:0;padding:0;width:5px;height:5px;background:#fff;box-shadow:0 0 13px #fff;border-radius:0;transition:width .35s,height .35s,border-radius .35s,box-shadow .35s;touch-action:manipulation}
#pixel.tap{animation:tap .11s}@keyframes tap{50%{transform:scale(.78)}}.pulse{position:absolute;border:1px solid #ffffff2c;border-radius:50%;pointer-events:none;animation:pulse 1s forwards}@keyframes pulse{from{width:6px;height:6px;opacity:1}to{width:150px;height:150px;opacity:0}}
#story{position:absolute;left:50%;bottom:9%;transform:translateX(-50%) translateY(12px);width:min(88%,390px);z-index:8;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);border-radius:15px;padding:11px 13px;opacity:0;pointer-events:none;transition:.3s}.storyTitle{font-size:9px;color:#858793;margin-bottom:4px;letter-spacing:1px}.storyText{font-size:13px;font-weight:750;line-height:1.4}
#discovery{position:absolute;right:9px;top:10px;z-index:6;display:flex;flex-direction:column;gap:5px}.badge{font-size:9px;background:#0b0c11cc;border:1px solid var(--line);padding:5px 7px;border-radius:8px;color:#bbb}
footer{z-index:10;flex:0 0 auto;padding:6px 9px calc(7px + var(--sb));display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;background:linear-gradient(transparent,#07080c 28%)}button.menu{border:1px solid var(--line);background:#101219;color:#b7b8c0;border-radius:10px;padding:7px 2px;font-size:9px;font-weight:800}.menu.main{background:#fff;color:#090a0d}
.sheet{position:absolute;z-index:30;left:0;right:0;bottom:0;max-height:60dvh;overflow-y:auto;background:#101219;border-radius:19px 19px 0 0;border-top:1px solid #ffffff20;padding:13px 11px calc(13px + var(--sb));transform:translateY(110%);transition:.22s;overscroll-behavior:contain}.sheet.open{transform:none}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:13px}.close{border:0;background:#252832;color:#fff;border-radius:8px;padding:7px 9px}.entry{background:#171922;border:1px solid var(--line);border-radius:11px;padding:9px;margin:6px 0;font-size:11px;color:#ddd}.entry.lock{opacity:.3}.entry b{display:block;margin-bottom:3px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.box{background:#171922;border:1px solid var(--line);border-radius:11px;padding:10px;font-size:10px;color:#999}.box b{display:block;color:white;font-size:16px;margin-top:2px}
#choice{position:absolute;z-index:50;inset:0;background:#05060af2;display:none;place-items:center;padding:16px}.choicebox{width:min(100%,390px);background:#12141b;border:1px solid var(--line);border-radius:17px;padding:14px}.choicebox h3{margin:0 0 6px;font-size:15px}.choicebox p{font-size:12px;color:#aaa;line-height:1.45}.choicebtn{width:100%;margin-top:7px;border:1px solid var(--line);background:#20232c;color:#fff;padding:10px;border-radius:10px;font-weight:800}
</style></head><body><div id="app">
<header><div class="top"><div class="logo">1 PİKSEL</div><div class="count"><span id="clicks">0</span> DOKUNUŞ</div></div><div id="chapter"></div><div class="track"><i id="bar"></i></div></header>
<main id="world"><div id="space"></div><div id="instruction"></div><div id="discovery"></div><div id="pixelWrap"><button id="pixel" aria-label="Piksele dokun"></button></div><div id="story"><div class="storyTitle">KEŞİF</div><div class="storyText" id="storyText"></div></div></main>
<footer><button class="menu" data-open="archive">◌<br>Arşiv</button><button class="menu main" id="touch">●<br>Dokun</button><button class="menu" data-open="stats">⌁<br>Evren</button></footer>
<section class="sheet" id="archive"><div class="head"><b>KEŞİF ARŞİVİ</b><button class="close">Kapat</button></div><div id="entries"></div></section>
<section class="sheet" id="stats"><div class="head"><b>EVREN</b><button class="close">Kapat</button></div><div class="statgrid"><div class="box">Dokunuş<b id="sClicks">0</b></div><div class="box">Keşif<b id="sFound">0/0</b></div><div class="box">Aşama<b id="sStage">0</b></div><div class="box">Durum<b id="sState">Hiçlik</b></div></div></section>
<div id="choice"><div class="choicebox"><h3>Sinyal sana cevap verdi.</h3><p>İlk kez oyun senden dokunmanı istemiyor. Bir karar vermeni istiyor.</p><button class="choicebtn" data-choice="answer">Sinyale cevap ver</button><button class="choicebtn" data-choice="ignore">Sinyali görmezden gel</button></div></div>
</div><script>
"use strict";const $=x=>document.getElementById(x),KEY="one_pixel_v2";
const stages=[
{n:0,name:"AŞAMA 0 · HİÇLİK",state:"Hiçlik",hint:"Yalnızca bir piksel var.<br>Ona dokun.",story:"Önce hiçbir şey yoktu."},
{n:5,name:"AŞAMA 1 · IŞIK",state:"Işık",hint:"Piksel seni fark etti.",story:"Bir nokta, karanlığın içinde kalmayı reddetti."},
{n:15,name:"AŞAMA 2 · UZAY",state:"Uzay",hint:"Etrafında bir şey oluşuyor.",story:"Işığın çevresinde ilk kez mesafe vardı."},
{n:35,name:"AŞAMA 3 · YILDIZLAR",state:"Yıldızlar",hint:"Her dokunuş boşluğu dolduruyor.",story:"Bir ışık, binlercesini uyandırdı."},
{n:70,name:"AŞAMA 4 · GEZEGEN",state:"Gezegen",hint:"Yeni bir dünya oluşuyor.",story:"Boşluğun içinde mavi bir küre belirdi."},
{n:120,name:"AŞAMA 5 · YAŞAM",state:"Yaşam",hint:"Artık yalnız değilsin.",story:"Dünya ilk kez kendi başına hareket etti."},
{n:200,name:"AŞAMA 6 · MEDENİYET",state:"Medeniyet",hint:"Aşağıdaki ışıklar çoğalıyor.",story:"Onlar gökyüzündeki beyaz noktayı kutsal sandılar."},
{n:320,name:"AŞAMA 7 · SİNYAL",state:"Sinyal",hint:"Birileri sana bakıyor.",story:"Gönderilen mesaj yalnızca iki kelimeydi: SEN KİMSİN?"},
{n:500,name:"AŞAMA 8 · KAPI",state:"Kapı",hint:"Piksel artık bir düğme.",story:"Sen bir evren yaratmadın. Bir kapının kilidini açtın."},
{n:750,name:"AŞAMA 9 · ÖTEKİ TARAF",state:"Bilinmiyor",hint:"Dokunmak artık geri dönüşsüz.",story:"Kapının öteki tarafında da bir piksel vardı. Ve o da sana dokundu."}
];
let s={clicks:0,seen:-1,choice:null,choiceShown:false};try{s=Object.assign(s,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch{}
if(!Number.isFinite(+s.clicks)||s.clicks<0)s.clicks=0;s.clicks=Math.floor(s.clicks);if(!Number.isFinite(+s.seen))s.seen=-1;
function si(){let i=0;for(let x=0;x<stages.length;x++)if(s.clicks>=stages[x].n)i=x;return i}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}
let seed=-1;function makeScene(i){if(seed===i)return;seed=i;const sp=$("space");sp.innerHTML="";
 if(i>=2){let num=Math.min(95,8+i*10);for(let k=0;k<num;k++){let a=document.createElement("i");a.className="star";let x=(k*37+i*13)%101,y=(k*61+i*17)%97;a.style.left=x+"%";a.style.top=y+"%";a.style.opacity=.25+((k*17)%60)/100;a.style.animationDelay=((k%9)*.17)+"s";sp.appendChild(a)}}
 if(i>=4){let orb=document.createElement("i");orb.className="orbit";orb.style.width=(180+i*13)+"px";orb.style.height=(180+i*13)+"px";sp.appendChild(orb);let pl=document.createElement("i");pl.className="planet";let size=Math.min(68,30+i*5);pl.style.width=size+"px";pl.style.height=size+"px";pl.style.left="calc(50% + 88px)";pl.style.top="calc(50% - 30px)";pl.style.background=i>=5?"radial-gradient(circle at 35% 30%,#7aa6b8,#31526c 55%,#162735)":"radial-gradient(circle at 35% 30%,#7792a8,#293d50)";sp.appendChild(pl)}
}
let storyTimer;function showStory(text){clearTimeout(storyTimer);$("storyText").textContent=text;$("story").style.opacity=1;storyTimer=setTimeout(()=>$("story").style.opacity=0,2600)}
function render(){let i=si(),st=stages[i],nx=stages[i+1];$("clicks").textContent=s.clicks;$("chapter").textContent=st.name;$("instruction").innerHTML=st.hint;let pct=nx?100*(s.clicks-st.n)/(nx.n-st.n):100;$("bar").style.width=Math.max(0,Math.min(100,pct))+"%";
 let size=Math.min(60,5+i*5.5);$("pixel").style.width=size+"px";$("pixel").style.height=size+"px";$("pixel").style.borderRadius=i>=4?"50%":i>=2?"20%":"0";$("pixel").style.boxShadow=i>=7?"0 0 30px #fff,0 0 80px #839cff55":"0 0 "+(13+i*3)+"px #fff";
 makeScene(i);$("sClicks").textContent=s.clicks;$("sFound").textContent=Math.max(0,s.seen+1)+"/"+stages.length;$("sStage").textContent=i;$("sState").textContent=st.state;
 $("entries").innerHTML=stages.map((x,k)=>`<div class="entry ${k<=s.seen?"":"lock"}"><b>${k<=s.seen?x.name:"🔒 BİLİNMİYOR"}</b>${k<=s.seen?x.story:"Henüz keşfedilmedi."}</div>`).join("");
 $("discovery").innerHTML=(i>=5?'<span class="badge">◉ YAŞAM</span>':'')+(i>=6?'<span class="badge">⌂ MEDENİYET</span>':'')+(i>=7?'<span class="badge">⌁ SİNYAL</span>':'');
 if(i>s.seen){s.seen=i;showStory(st.story)}
 if(i>=7&&!s.choiceShown&&!s.choice){s.choiceShown=true;setTimeout(()=>$("choice").style.display="grid",700)}
 save()
}
function pulse(){let q=document.createElement("i");q.className="pulse";$("pixelWrap").appendChild(q);setTimeout(()=>q.remove(),1050)}
function tap(){if($("choice").style.display==="grid")return;s.clicks++;$("pixel").classList.remove("tap");void $("pixel").offsetWidth;$("pixel").classList.add("tap");pulse();render()}
$("pixel").addEventListener("pointerdown",e=>{e.preventDefault();tap()},{passive:false});

/* Dokun butonu: iOS güvenli basılı tutma */
let holdTimer=null,holdLoop=null,holding=false;
function stopHold(){
 holding=false;
 clearTimeout(holdTimer); clearInterval(holdLoop);
 holdTimer=null; holdLoop=null;
}
function startHold(e){
 if(e){e.preventDefault();e.stopPropagation();}
 stopHold(); tap(); holding=true;
 holdTimer=setTimeout(()=>{
   if(!holding)return;
   holdLoop=setInterval(()=>{if(holding)tap()},90);
 },260);
}
const touchBtn=$("touch");
touchBtn.style.webkitUserSelect="none";
touchBtn.style.userSelect="none";
touchBtn.style.webkitTouchCallout="none";
touchBtn.style.touchAction="none";
touchBtn.addEventListener("touchstart",startHold,{passive:false});
touchBtn.addEventListener("touchend",e=>{e.preventDefault();stopHold()},{passive:false});
touchBtn.addEventListener("touchcancel",stopHold,{passive:false});
touchBtn.addEventListener("contextmenu",e=>e.preventDefault());
touchBtn.addEventListener("selectstart",e=>e.preventDefault());
touchBtn.addEventListener("pointerdown",e=>{if(e.pointerType!=="touch")startHold(e)});
touchBtn.addEventListener("pointerup",stopHold);
touchBtn.addEventListener("pointercancel",stopHold);
touchBtn.addEventListener("pointerleave",stopHold);
window.addEventListener("blur",stopHold);
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopHold()});
document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>$(b.dataset.open).classList.add("open"));document.querySelectorAll(".close").forEach(b=>b.onclick=()=>b.closest(".sheet").classList.remove("open"));
document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{s.choice=b.dataset.choice;$("choice").style.display="none";showStory(s.choice==="answer"?"Sinyal cevabını aldı. Bir şey değişti.":"Sinyal sustu. Ama seni izlemeyi bırakmadı.");save()});
render();
</script></body></html>
