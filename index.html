<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Frost Camp Idle</title>
<style>
  :root{
    --glass: rgba(18,34,55,.72);
    --glass2: rgba(255,255,255,.16);
    --text:#fff;
    --green:#38d05b;
    --gold:#ffd45b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dff4ff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;touch-action:none}
  #wrap{position:fixed;inset:0;overflow:hidden}
  canvas{width:100%;height:100%;display:block;background:linear-gradient(#bceaff,#eaf9ff)}
  .hud{position:fixed;inset:0;pointer-events:none;color:var(--text);text-shadow:0 2px 3px rgba(0,0,0,.35)}
  .stats{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));display:grid;gap:7px;min-width:126px}
  .stat{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,rgba(24,48,76,.85),rgba(24,48,76,.52));border:1px solid rgba(255,255,255,.25);border-radius:13px;padding:8px 10px;box-shadow:0 5px 14px rgba(13,35,53,.16);font-weight:900}
  .ico{width:30px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.16)}
  .value{margin-left:auto;font-size:20px}
  .quest{position:absolute;left:16px;top:94px;width:min(240px,55vw);background:var(--glass);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:10px 12px;box-shadow:0 8px 24px rgba(16,46,67,.18)}
  .quest .qtitle{font-size:11px;font-weight:800;opacity:.7;letter-spacing:.8px}
  .quest .qtext{font-size:13px;font-weight:800;margin:3px 0 7px}
  .bar{height:7px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#51e86c,#b7ff6d);border-radius:99px;transition:.2s}
  .toast{position:absolute;left:50%;top:18%;transform:translate(-50%,-12px);background:rgba(18,34,55,.88);padding:10px 16px;border-radius:999px;font-weight:900;font-size:13px;opacity:0;transition:.22s;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .controls{position:absolute;left:18px;bottom:max(18px,env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;background:rgba(24,48,76,.17);border:2px solid rgba(255,255,255,.35);pointer-events:auto;box-shadow:inset 0 0 0 10px rgba(255,255,255,.06)}
  .stick{position:absolute;width:54px;height:54px;left:32px;top:32px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 5px 15px rgba(18,34,55,.28);transition:transform .03s linear}
  .startOverlay{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(rgba(172,228,255,.2),rgba(231,249,255,.8));z-index:9}
  .startCard{width:min(86vw,370px);background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.9);box-shadow:0 22px 70px rgba(15,56,81,.22);backdrop-filter:blur(16px);border-radius:28px;padding:26px;color:#16304d;text-align:center}
  .startCard h1{margin:0;font-size:34px;line-height:.95;letter-spacing:-1.8px}
  .startCard h1 span{display:block;color:#f2b513;font-size:22px;letter-spacing:.4px}
  .play{border:0;width:100%;font:900 22px inherit;color:#fff;background:linear-gradient(#48de68,#23b84a);border-radius:16px;padding:14px 18px;box-shadow:0 7px 0 #15953a,0 14px 26px rgba(34,184,76,.25);cursor:pointer}
  .play:active{transform:translateY(4px);box-shadow:0 3px 0 #15953a}
  .eventBtn{position:absolute;right:14px;top:151px;pointer-events:auto;border:1px solid rgba(255,255,255,.3);background:linear-gradient(#ffc94a,#e99917);color:#fff;border-radius:15px;padding:9px 11px;min-width:112px;box-shadow:0 7px 18px rgba(91,56,9,.22);font-weight:950;text-align:center;cursor:pointer;text-shadow:0 2px 3px rgba(104,65,0,.3)}
  .eventBtn .et{font-size:11px}.eventBtn .ev{font-size:15px;margin-top:1px}.eventBtn.ready{animation:eventPulse 1.35s infinite}
  @keyframes eventPulse{50%{transform:scale(1.045)}}
  .eventModal{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:18px;background:rgba(10,28,42,.42);pointer-events:auto;text-shadow:none}
  .eventCard{width:min(88vw,390px);background:rgba(255,255,255,.95);color:#17324d;border-radius:24px;padding:20px;box-shadow:0 24px 70px rgba(10,31,47,.28)}
  .eventHead{display:flex;gap:12px;align-items:center}.eventIcon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#ffd75d,#f19b1b);font-size:29px;flex:none}
  .eventCard h2{margin:0;font-size:21px}.eventCard p{margin:4px 0 0;font-size:13px;opacity:.7;line-height:1.35}
  .eventProgress{display:flex;justify-content:space-between;font-size:12px;font-weight:900;margin:18px 0 7px}.eventBar{height:9px;background:#dce8ef;border-radius:99px;overflow:hidden}.eventBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#35ca58,#99ec58);border-radius:99px}
  .eventReward{margin:14px 0;background:#eef6fa;border-radius:14px;padding:11px 12px;font-weight:900;font-size:13px}.eventActions{display:flex;gap:9px}.eventClose,.eventClaim{border:0;border-radius:13px;padding:12px 14px;font-weight:900;cursor:pointer}.eventClose{background:#e8eef2;color:#365064}.eventClaim{flex:1;color:#fff;background:linear-gradient(#48de68,#23b84a)}.eventClaim:disabled{opacity:.42;filter:grayscale(.7)}
  .pcKeys{position:absolute;left:14px;bottom:14px;font-size:11px;font-weight:850;opacity:.52;display:none}
  @media (pointer:fine){.controls{display:none}.pcKeys{display:block}}
  @media(min-width:800px){
    .controls{width:130px;height:130px}.stick{left:38px;top:38px}
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>

<div class="hud">
  <div class="stats">
    <div class="stat"><div class="ico">💵</div><div id="money" class="value">0</div></div>
    <div class="stat"><div class="ico">🪵</div><div id="wood" class="value">0</div></div>
    <div class="stat"><div class="ico">🪨</div><div id="stone" class="value">0</div></div>
  </div>
  <div class="quest">
    <div id="qtext" class="qtext">10 odun topla</div>
    <div class="bar"><i id="qbar"></i></div>
  </div>
  <div id="toast" class="toast">+1 🪵</div>
  <button id="eventBtn" class="eventBtn"><div class="et">🎁 ETKİNLİK</div><div id="eventTime" class="ev">HAZIR</div></button>
  <div id="joy" class="controls"><div id="stick" class="stick"></div></div>
  <div class="pcKeys">WASD / Ok tuşları</div>
</div>

<div id="start" class="startOverlay">
  <div class="startCard">
    <h1>FROST CAMP<span>IDLE SURVIVAL</span></h1>
    <button id="play" class="play">OYNA</button>
  </div>
</div>


<div id="eventModal" class="eventModal">
  <div class="eventCard">
    <div class="eventHead"><div id="eventIcon" class="eventIcon">🪵</div><div><h2 id="eventName">Odun Hücumu</h2><p id="eventDesc">Hedefi tamamla ve ödülü al.</p></div></div>
    <div class="eventProgress"><span>İlerleme</span><span id="eventProgressText">0 / 18</span></div>
    <div class="eventBar"><i id="eventBar"></i></div>
    <div id="eventReward" class="eventReward">Ödül: 💵 80</div>
    <div class="eventActions"><button id="eventClose" class="eventClose">Kapat</button><button id="eventClaim" class="eventClaim" disabled>ÖDÜLÜ AL</button></div>
  </div>
</div>

<script>
(() => {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const moneyEl = document.getElementById('money');
const woodEl = document.getElementById('wood');
const stoneEl = document.getElementById('stone');
const qtext = document.getElementById('qtext');
const qbar = document.getElementById('qbar');
const toast = document.getElementById('toast');
const eventBtn = document.getElementById('eventBtn');
const eventTime = document.getElementById('eventTime');
const eventModal = document.getElementById('eventModal');
const eventIcon = document.getElementById('eventIcon');
const eventName = document.getElementById('eventName');
const eventDesc = document.getElementById('eventDesc');
const eventProgressText = document.getElementById('eventProgressText');
const eventBar = document.getElementById('eventBar');
const eventReward = document.getElementById('eventReward');
const eventClaim = document.getElementById('eventClaim');

let W=0,H=0,dpr=1,last=0,started=false;
let camera={x:0,y:0};
const world={w:1700,h:1700};
const player={x:850,y:900,r:20,speed:225,wood:0,stone:0,money:0,carryMax:18,angle:0,chop:0};
const base={x:770,y:860,w:180,h:120,level:0,progress:0,cost:12};
let workers=[];
let unlockedStone=false;
let saveTimer=0;

const EVENT_INTERVAL = 15 * 60 * 1000;
const eventDefs = [
  {id:'wood',icon:'🪵',name:'Odun Hücumu',desc:'Odun topla.',metric:'woodCollected',goal:18,reward:{money:80}},
  {id:'builder',icon:'🏗️',name:'Usta İnşaatçı',desc:'Kampa odun teslim et.',metric:'woodDeposited',goal:20,reward:{money:100}},
  {id:'walk',icon:'🥾',name:'Kar Kaşifi',desc:'Haritada hareket et.',metric:'distance',goal:1200,reward:{money:70,wood:5}},
  {id:'stone',icon:'🪨',name:'Taş Avı',desc:'Taş topla.',metric:'stoneCollected',goal:8,reward:{money:120}},
  {id:'earn',icon:'💰',name:'Kamp Kazancı',desc:'İşçilerinden para kazan.',metric:'moneyEarned',goal:20,reward:{money:90,stone:2}}
];
let eventState={active:true,index:0,progress:0,readyAt:0,lastEventId:null};
function saveEvent(){try{localStorage.setItem('frostEventState',JSON.stringify(eventState))}catch{}}
function chooseEvent(){
  let pool=eventDefs.map((e,i)=>({e,i})).filter(x=>(x.e.id!=='stone'||unlockedStone)&&x.e.id!==eventState.lastEventId);
  if(!pool.length) pool=eventDefs.map((e,i)=>({e,i})).filter(x=>x.e.id!=='stone'||unlockedStone);
  return pool[Math.floor(Math.random()*pool.length)].i;
}
function startNextEvent(){eventState.active=true;eventState.index=chooseEvent();eventState.progress=0;eventState.readyAt=0;saveEvent();updateEventUI();addToast('Yeni etkinlik başladı!')}
function loadEvent(){
  try{const v=JSON.parse(localStorage.getItem('frostEventState')||'null');if(v&&typeof v==='object')eventState={...eventState,...v}}catch{}
  if(!eventState.active&&Date.now()>=eventState.readyAt) startNextEvent();
  if(eventDefs[eventState.index]?.id==='stone'&&!unlockedStone){eventState.index=chooseEvent();eventState.progress=0;saveEvent()}
}
function addEventProgress(metric,n){
  if(!eventState.active)return;const e=eventDefs[eventState.index];if(e.metric!==metric)return;
  eventState.progress=Math.min(e.goal,eventState.progress+n);saveEvent();updateEventUI();
}
function rewardLabel(r){let a=[];if(r.money)a.push('💵 '+r.money);if(r.wood)a.push('🪵 '+r.wood);if(r.stone)a.push('🪨 '+r.stone);return 'Ödül: '+a.join('   ')}
function updateEventUI(){
  if(eventState.active){
    const e=eventDefs[eventState.index];
    eventTime.textContent=eventState.progress>=e.goal?'ÖDÜL HAZIR':Math.floor(eventState.progress)+' / '+e.goal;
    eventBtn.classList.toggle('ready',eventState.progress>=e.goal);eventIcon.textContent=e.icon;eventName.textContent=e.name;eventDesc.textContent=e.desc;
    eventProgressText.textContent=Math.floor(eventState.progress)+' / '+e.goal;eventBar.style.width=Math.min(100,eventState.progress/e.goal*100)+'%';eventReward.textContent=rewardLabel(e.reward);eventClaim.disabled=eventState.progress<e.goal;
  }else{
    const left=Math.max(0,eventState.readyAt-Date.now());if(left<=0){startNextEvent();return}
    const sec=Math.ceil(left/1000),m=Math.floor(sec/60),ss=String(sec%60).padStart(2,'0');eventTime.textContent=m+':'+ss;eventBtn.classList.remove('ready');
    eventIcon.textContent='⏳';eventName.textContent='Yeni Etkinlik';eventDesc.textContent='Yeni etkinlik 15 dakika sonra açılır.';eventProgressText.textContent='Bekleniyor';eventBar.style.width='0%';eventReward.textContent='Yeni ödül yakında';eventClaim.disabled=true;
  }
}
function claimEvent(){
  if(!eventState.active)return;const e=eventDefs[eventState.index];if(eventState.progress<e.goal)return;
  if(e.reward.money)player.money+=e.reward.money;if(e.reward.wood)player.wood=Math.min(player.carryMax,player.wood+e.reward.wood);if(e.reward.stone)player.stone+=e.reward.stone;
  eventState.lastEventId=e.id;eventState.active=false;eventState.readyAt=Date.now()+EVENT_INTERVAL;eventState.progress=0;saveEvent();eventModal.style.display='none';addToast('Etkinlik ödülü alındı!');updateEventUI();
}
eventBtn.onclick=()=>{eventModal.style.display='grid';updateEventUI()};
document.getElementById('eventClose').onclick=()=>eventModal.style.display='none';
eventModal.addEventListener('pointerdown',e=>{if(e.target===eventModal)eventModal.style.display='none'});eventClaim.onclick=claimEvent;

const trees=[];
const rocks=[];
function rand(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
for(let i=0;i<38;i++){
  let a=Math.random()*Math.PI*2, rr=rand(280,690);
  trees.push({x:850+Math.cos(a)*rr,y:850+Math.sin(a)*rr,hp:3,max:3,dead:0,s:rand(.85,1.2)});
}
for(let i=0;i<16;i++){
  let a=Math.random()*Math.PI*2, rr=rand(430,720);
  rocks.push({x:850+Math.cos(a)*rr,y:850+Math.sin(a)*rr,hp:5,max:5,dead:0,s:rand(.8,1.15)});
}

const keys={};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys[k]=true});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

const joy=document.getElementById('joy'), stick=document.getElementById('stick');
let joyVec={x:0,y:0}, joyActive=false, joyId=null;
function joyMove(clientX,clientY){
  const r=joy.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let dx=clientX-cx,dy=clientY-cy,len=Math.hypot(dx,dy),max=r.width*.28;
  if(len>max){dx=dx/len*max;dy=dy/len*max;len=max}
  joyVec.x=dx/max;joyVec.y=dy/max;
  stick.style.transform=`translate(${dx}px,${dy}px)`;
}
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);joyId=e.pointerId;joyActive=true;joyMove(e.clientX,e.clientY)});
joy.addEventListener('pointermove',e=>{if(joyActive&&e.pointerId===joyId)joyMove(e.clientX,e.clientY)});
function endJoy(e){if(e.pointerId!==joyId)return;joyActive=false;joyVec.x=joyVec.y=0;stick.style.transform='translate(0,0)'}
joy.addEventListener('pointerup',endJoy); joy.addEventListener('pointercancel',endJoy);

document.getElementById('play').onclick=()=>{
  document.getElementById('start').style.display='none';
  started=true; last=performance.now(); requestAnimationFrame(loop);
};

function resize(){
 dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
 canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)
}
addEventListener('resize',resize);resize();

function iso(x,y){
  const sx=(x-y)*0.50-camera.x+W/2;
  const sy=(x+y)*0.25-camera.y+H/2;
  return {x:sx,y:sy};
}
function shadow(x,y,rx,ry,a=.15){
 ctx.save();ctx.fillStyle=`rgba(18,52,72,${a})`;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();ctx.restore();
}
function poly(points,fill,stroke){
 ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);
 for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);
 ctx.closePath();ctx.fillStyle=fill;ctx.fill();
 if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
}
function drawGround(){
 ctx.fillStyle='#e9f8ff';ctx.fillRect(0,0,W,H);
 const c=iso(850,850);
 ctx.fillStyle='#d7f0fb';ctx.beginPath();ctx.ellipse(c.x,c.y+110,520,250,0,0,Math.PI*2);ctx.fill();
 // warm camp clearing
 ctx.fillStyle='#f4c9a1';ctx.beginPath();ctx.ellipse(c.x,c.y+5,230,110,-.03,0,Math.PI*2);ctx.fill();
 for(let i=0;i<26;i++){
   const x=(i*167)%W,y=(i*97+70)%H;
   ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(x,y,(i%3)+1,0,Math.PI*2);ctx.fill();
 }
}
function drawTree(t){
 const p=iso(t.x,t.y);
 shadow(p.x,p.y+18,18,8,.18);
 ctx.fillStyle='#8a5a3b';ctx.fillRect(p.x-4,p.y-18,8,38);
 const levels=[{y:-58,w:34},{y:-39,w:44},{y:-19,w:52}];
 levels.forEach((l,i)=>{
   poly([[p.x,p.y+l.y-32],[p.x-l.w,p.y+l.y+22],[p.x+l.w,p.y+l.y+22]],
   i===0?'#c8f6ff':i===1?'#a9e9f7':'#8ed9ed','#74bfd7');
 });
 ctx.fillStyle='rgba(255,255,255,.65)';
 ctx.beginPath();ctx.moveTo(p.x,p.y-90);ctx.lineTo(p.x-22,p.y-51);ctx.lineTo(p.x+2,p.y-56);ctx.closePath();ctx.fill();
 if(t.hp<t.max){ctx.fillStyle='rgba(22,43,58,.3)';ctx.fillRect(p.x-22,p.y-103,44,5);ctx.fillStyle='#65e573';ctx.fillRect(p.x-22,p.y-103,44*(t.hp/t.max),5)}
}
function drawRock(r){
 const p=iso(r.x,r.y); shadow(p.x,p.y+10,23,10,.18);
 poly([[p.x-25,p.y+8],[p.x-18,p.y-13],[p.x-4,p.y-24],[p.x+17,p.y-18],[p.x+28,p.y+5],[p.x+12,p.y+18],[p.x-14,p.y+17]],'#94a7b8','#73899c');
 poly([[p.x-18,p.y-13],[p.x-4,p.y-24],[p.x+4,p.y-3],[p.x-10,p.y+4]],'#bccbd6');
}
function drawBase(){
 const p=iso(base.x,base.y);
 const q=iso(base.x+base.w,base.y+base.h);
 const x=Math.min(p.x,q.x)-55,y=(p.y+q.y)/2;
 if(base.level===0){
   ctx.save();ctx.setLineDash([9,8]);ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=4;
   ctx.strokeRect(x-55,y-25,110,50);ctx.restore();
   ctx.fillStyle='rgba(25,52,69,.7)';ctx.font='800 13px system-ui';ctx.textAlign='center';ctx.fillText(`🪵 ${Math.floor(base.progress)}/${base.cost}`,x,y+5);
 }else{
   shadow(x,y+24,65,18,.18);
   ctx.fillStyle='#99633e';ctx.fillRect(x-45,y-14,90,48);
   poly([[x-56,y-14],[x,y-48],[x+56,y-14],[x,y+16]],'#d85d43','#a84332');
   ctx.fillStyle='#ffd99a';ctx.fillRect(x-12,y+7,24,27);
   ctx.fillStyle='#6d4935';ctx.fillRect(x+20,y-2,15,13);
   ctx.font='900 12px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('KAMP LV.'+base.level,x,y-58);
 }
}
function drawPlayer(){
 const p=iso(player.x,player.y);
 // carried logs stack
 const count=Math.min(player.wood,12);
 for(let i=0;i<count;i++){
   const yy=p.y-38-i*8;
   ctx.strokeStyle='#8b562f';ctx.lineWidth=1;
   ctx.fillStyle='#c9824d';ctx.beginPath();ctx.roundRect(p.x+20,yy,32,9,4);ctx.fill();ctx.stroke();
 }
 shadow(p.x,p.y+18,22,9,.22);
 ctx.fillStyle='#20a9d8';ctx.beginPath();ctx.arc(p.x,p.y-10,17,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#f2d2b6';ctx.beginPath();ctx.arc(p.x,p.y-29,10,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#eefaff';ctx.beginPath();ctx.arc(p.x,p.y-37,11,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillStyle='#243849';ctx.fillRect(p.x-15,p.y+2,10,20);ctx.fillRect(p.x+5,p.y+2,10,20);
 ctx.strokeStyle='#64472f';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(p.x+9,p.y-11);ctx.lineTo(p.x+28,p.y+8);ctx.stroke();
 ctx.strokeStyle='#758795';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(p.x+26,p.y+8);ctx.lineTo(p.x+36,p.y);ctx.stroke();
 ctx.strokeStyle='#42e7ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y+7,25,0,Math.PI*2);ctx.stroke();
}
function drawWorker(w){
 const p=iso(w.x,w.y);shadow(p.x,p.y+12,13,6,.15);
 ctx.fillStyle='#39a7cf';ctx.beginPath();ctx.arc(p.x,p.y-6,11,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#f1d2b7';ctx.beginPath();ctx.arc(p.x,p.y-19,7,0,Math.PI*2);ctx.fill();
}
function addToast(txt){
 toast.textContent=txt;toast.classList.add('show');clearTimeout(addToast.t);addToast.t=setTimeout(()=>toast.classList.remove('show'),550);
}
function nearestAlive(arr,rad){
 let best=null,bd=rad;
 for(const o of arr){if(o.dead>0)continue;const d=dist(player,o);if(d<bd){bd=d;best=o}}
 return best;
}
function update(dt){
 let dx=joyVec.x,dy=joyVec.y;
 if(keys['w']||keys['arrowup'])dy-=1;if(keys['s']||keys['arrowdown'])dy+=1;
 if(keys['a']||keys['arrowleft'])dx-=1;if(keys['d']||keys['arrowright'])dx+=1;
 let l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
 // Convert screen-space controls to world-space for isometric map
 if(l>.01){
   const wx=(dy*2+dx), wy=(dy*2-dx);
   const wl=Math.hypot(wx,wy)||1;
   const ox=player.x,oy=player.y;
   player.x+=wx/wl*player.speed*dt;player.y+=wy/wl*player.speed*dt;
   player.x=Math.max(120,Math.min(world.w-120,player.x));
   player.y=Math.max(120,Math.min(world.h-120,player.y));
   addEventProgress('distance',Math.hypot(player.x-ox,player.y-oy));
 }
 // tree auto chop
 const t=nearestAlive(trees,85);
 const r=unlockedStone?nearestAlive(rocks,80):null;
 if(t && player.wood<player.carryMax){
   player.chop+=dt;
   if(player.chop>.48){player.chop=0;t.hp--;if(t.hp<=0){t.dead=5.5;t.hp=t.max;player.wood+=3;addEventProgress('woodCollected',3);addToast('+3 🪵')}}
 } else if(r && player.stone<12){
   player.chop+=dt;if(player.chop>.7){player.chop=0;r.hp--;if(r.hp<=0){r.dead=6.5;r.hp=r.max;player.stone+=2;addEventProgress('stoneCollected',2);addToast('+2 🪨')}}
 } else player.chop=0;
 // respawn
 [...trees,...rocks].forEach(o=>{if(o.dead>0)o.dead-=dt});
 // deposit zone
 const bc={x:base.x+base.w/2,y:base.y+base.h/2};
 if(dist(player,bc)<110 && player.wood>0){
   const rate=Math.min(player.wood,dt*8);
   player.wood-=rate;base.progress+=rate;addEventProgress('woodDeposited',rate);
   if(base.progress>=base.cost){
     base.progress-=base.cost;base.level++;
     const upgradeMoney=25*base.level;player.money+=upgradeMoney;addEventProgress('moneyEarned',upgradeMoney);
     base.cost=Math.round(base.cost*1.85);
     workers.push({x:bc.x+rand(-50,50),y:bc.y+rand(-50,50),tx:bc.x,ty:bc.y,t:0});
     addToast('Kamp gelişti! +1 işçi');
     if(base.level>=2)unlockedStone=true;
   }
 }
 // workers generate money/wood
 for(const w of workers){
   w.t+=dt;
   w.x=bc.x+Math.cos(w.t*.8+w.y)*60;w.y=bc.y+Math.sin(w.t*.7+w.x)*55;
 }
 saveTimer+=dt;
 if(saveTimer>1){
   saveTimer=0;
   if(workers.length){player.money+=workers.length;addEventProgress('moneyEarned',workers.length); if(Math.random()<.45) player.wood=Math.min(player.carryMax,player.wood+workers.length*.25);}
 }
 camera.x+=( (player.x-player.y)*.50 - camera.x)*Math.min(1,dt*4);
 camera.y+=( (player.x+player.y)*.25 - camera.y)*Math.min(1,dt*4);
 updateUI();
}
function updateUI(){
 moneyEl.textContent=Math.floor(player.money);
 woodEl.textContent=Math.floor(player.wood);
 stoneEl.textContent=Math.floor(player.stone);
 if(base.level===0){qtext.textContent='Kampı kur';qbar.style.width=Math.min(100,base.progress/12*100)+'%'}
 else if(base.level===1){qtext.textContent='Kampı geliştir';qbar.style.width=Math.min(100,base.progress/base.cost*100)+'%'}
 else if(!unlockedStone){qtext.textContent='Kampı geliştir';qbar.style.width='70%'}
 else {qtext.textContent='Kampı geliştir';qbar.style.width=Math.min(100,base.progress/base.cost*100)+'%'}
}
function draw(){
 drawGround();
 const drawables=[];
 trees.forEach(t=>{if(t.dead<=0)drawables.push({y:t.x+t.y,fn:()=>drawTree(t)})});
 rocks.forEach(r=>{if(unlockedStone&&r.dead<=0)drawables.push({y:r.x+r.y,fn:()=>drawRock(r)})});
 drawables.push({y:base.x+base.y+60,fn:drawBase});
 workers.forEach(w=>drawables.push({y:w.x+w.y,fn:()=>drawWorker(w)}));
 drawables.push({y:player.x+player.y,fn:drawPlayer});
 drawables.sort((a,b)=>a.y-b.y).forEach(d=>d.fn());
}
function loop(ts){
 if(!started)return;const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
 update(dt);draw();requestAnimationFrame(loop);
}
// initial background
loadEvent();setInterval(updateEventUI,1000);
camera.x=(player.x-player.y)*.5;camera.y=(player.x+player.y)*.25;draw();updateEventUI();
})();
</script>
</body>
