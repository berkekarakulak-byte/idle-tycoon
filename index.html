<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idle Timeline</title>
  <style>
    :root{
      --bg:#0a0b0f;--panel:#111319;--panel2:#161923;--text:#f4f6fb;--muted:#8c93a5;
      --accent:#8f7cff;--accent2:#32d0a5;--border:rgba(255,255,255,.07);--gold:#efc46a;
    }
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% -10%,rgba(143,124,255,.16),transparent 34%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    button{font:inherit}.app{width:min(920px,calc(100% - 24px));margin:auto;padding:18px 0 28px}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#5b49db);box-shadow:0 8px 24px rgba(143,124,255,.28)}
    h1{font-size:20px;margin:0;letter-spacing:-.4px}.sub{color:var(--muted);font-size:12px}.save{font-size:11px;color:var(--muted)}
    .shell{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px}
    .panel{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent),var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:0 18px 55px rgba(0,0,0,.28)}
    .main{padding:16px}.side{padding:14px}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:14px}.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent2);font-weight:800}.hero h2{font-size:28px;line-height:1;margin:7px 0 6px;letter-spacing:-1px}.desc{color:var(--muted);font-size:13px;line-height:1.45;max-width:510px}.age-icon{font-size:40px;opacity:.9}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{padding:10px 11px;background:var(--panel2);border:1px solid var(--border);border-radius:12px}.stat span{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}.stat strong{font-size:15px}
    .action{width:100%;border:0;border-radius:15px;padding:16px;color:#fff;text-align:left;cursor:pointer;background:linear-gradient(135deg,var(--accent),#6652e6);box-shadow:0 12px 28px rgba(143,124,255,.22);transition:.15s}.action:hover{filter:brightness(1.06)}.action:active{transform:scale(.992)}.action strong{display:block;font-size:18px;margin-bottom:3px}.action span{font-size:12px;color:rgba(255,255,255,.72)}
    .progress-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:12px 1px 6px}.progress{height:7px;background:#0d0f14;border-radius:99px;overflow:hidden}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:.2s}
    .section-title{font-size:12px;color:var(--muted);margin:15px 0 8px}.upgrades{display:grid;gap:7px}.upgrade{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 11px;background:var(--panel2);border:1px solid var(--border);border-radius:12px}.upgrade strong{font-size:13px}.upgrade small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.upgrade button,.primary,.prestige,.danger{border:0;border-radius:10px;padding:8px 10px;font-weight:800;cursor:pointer}.upgrade button{background:var(--accent2);color:#07140f;min-width:84px;font-size:11px}button:disabled{opacity:.35;filter:grayscale(1);cursor:not-allowed}
    .side h3{font-size:14px;margin:0 0 10px}.quest-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.quest-head span{font-size:10px;color:var(--accent2)}.quests{display:grid;gap:6px;margin-bottom:14px}.quest{padding:9px;border-radius:11px;background:var(--panel2);border:1px solid var(--border)}.quest-top{display:flex;justify-content:space-between;gap:8px;font-size:11px}.quest-top b{font-weight:700}.quest-top em{font-style:normal;color:var(--gold);white-space:nowrap;font-size:10px}.quest-bar{height:4px;background:#0d0f14;border-radius:99px;overflow:hidden;margin-top:7px}.quest-bar div{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:.2s}.quest-meta{display:flex;justify-content:space-between;margin-top:5px;font-size:9px;color:var(--muted)}.timeline{display:grid;gap:6px}.age{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:11px;color:var(--muted);font-size:12px}.age.current{background:rgba(143,124,255,.12);color:var(--text);border:1px solid rgba(143,124,255,.22)}.age.done{color:#b9c0cf}.age i{font-style:normal;width:24px;text-align:center}.age small{display:block;font-size:9px;color:var(--muted);margin-top:1px}
    .primary{width:100%;margin-top:10px;color:#fff;background:linear-gradient(135deg,#ff9d57,#ff6d85);font-size:12px}.prestige-box{margin-top:12px;padding:11px;border-radius:12px;background:rgba(239,196,106,.06);border:1px solid rgba(239,196,106,.16)}.prestige-box b{display:block;color:var(--gold);font-size:12px;margin-bottom:4px}.prestige-box p{font-size:10px;line-height:1.4;color:var(--muted);margin:0 0 8px}.prestige{width:100%;background:var(--gold);color:#251b08;font-size:11px}.danger{width:100%;margin-top:8px;color:#cbd0da;background:transparent;border:1px solid var(--border);font-size:10px}
    .toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,14px);background:#141722;border:1px solid var(--border);padding:10px 13px;border-radius:11px;font-size:12px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:760px){.shell{grid-template-columns:1fr}.side{order:2}.stats{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:480px){.app{width:min(100% - 14px,920px);padding-top:10px}.save{display:none}.main,.side{padding:12px}.hero h2{font-size:24px}.hero{gap:10px}.age-icon{font-size:32px}.stats{gap:6px}.stat{padding:9px}.stat strong{font-size:14px}.upgrade{padding:9px}.upgrade button{min-width:76px}}
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="brand"><div class="logo">⏳</div><div><h1>Idle Timeline</h1><div class="sub">Çağları aş, medeniyetini büyüt.</div></div></div>
      <div class="save" id="saveStatus">Otomatik kayıt</div>
    </div>

    <section class="shell">
      <div class="panel main">
        <div class="hero">
          <div><div class="eyebrow">Aktif çağ</div><h2 id="ageName">Taş Devri</h2><div class="desc" id="ageDescription"></div></div>
          <div class="age-icon" id="ageIcon">🪨</div>
        </div>

        <div class="stats">
          <div class="stat"><span>Kaynak</span><strong id="resourceText">0</strong></div>
          <div class="stat"><span>Gelir</span><strong id="incomeText">0/sn</strong></div>
          <div class="stat"><span>Tıklama</span><strong id="clickText">1</strong></div>
          <div class="stat"><span>Bilgelik</span><strong id="wisdomText">0</strong></div>
        </div>

        <button class="action" id="mainAction"><strong id="actionName">Taş Topla</strong><span id="actionGain">+1 kaynak</span></button>

        <div class="progress-row"><span>Çağ ilerlemesi</span><span id="progressText">0 / 1.000</span></div>
        <div class="progress"><div id="progressBar"></div></div>

        <div class="section-title">Geliştirmeler</div>
        <div class="upgrades" id="upgradeList"></div>
      </div>

      <aside class="panel side">
        <div class="quest-head"><h3 style="margin:0">Görevler</h3><span>Otomatik yenilenir</span></div>
        <div class="quests" id="questList"></div>
        <h3>Zaman çizgisi</h3>
        <div class="timeline" id="timeline"></div>
        <button class="primary" id="nextAgeButton" disabled>Sonraki Çağa Geç</button>
        <div class="prestige-box">
          <b>Zaman Yolculuğu</b>
          <p id="prestigeInfo"></p>
          <button class="prestige" id="prestigeButton" disabled>Prestij Yap</button>
        </div>
        <button class="danger" id="resetButton">Kaydı sıfırla</button>
      </aside>
    </section>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    const ages=[
      {name:"Taş Devri",icon:"🪨",description:"İlk kaynakları topla ve medeniyetin temelini kur.",action:"Taş Topla",currency:"Kaynak",target:1000,baseClick:1,upgrades:[["Keskin Taşlar","Tıklamayı artırır.","click",15,1],["Toplayıcı Kabile","Otomatik üretim sağlar.","income",40,1],["Ateş Kampı","Tüm geliri güçlendirir.","multiplier",220,.15]]},
      {name:"Antik Çağ",icon:"🏛️",description:"Tarım, ticaret ve şehirlerle düzenli ekonomi kur.",action:"Hasat Yap",currency:"Altın",target:15000,baseClick:7,upgrades:[["Sulama Kanalları","Tıklamayı artırır.","click",180,6],["Pazar Meydanı","Otomatik üretim sağlar.","income",450,8],["Ticaret Filosu","Tüm geliri güçlendirir.","multiplier",2800,.2]]},
      {name:"Orta Çağ",icon:"🏰",description:"Kaleler, loncalar ve krallık ekonomisiyle büyü.",action:"Vergi Topla",currency:"Hazine",target:180000,baseClick:45,upgrades:[["Demirhane","Tıklamayı artırır.","click",2600,35],["Lonca Sistemi","Otomatik üretim sağlar.","income",7000,55],["Kraliyet Fermanı","Tüm geliri güçlendirir.","multiplier",36000,.25]]},
      {name:"Sanayi Devrimi",icon:"🏭",description:"Buhar gücü ve fabrikalarla üretimi patlat.",action:"Üretim Yap",currency:"Sermaye",target:2500000,baseClick:330,upgrades:[["Buhar Motoru","Tıklamayı artırır.","click",45000,270],["Fabrika Hattı","Otomatik üretim sağlar.","income",115000,430],["Demiryolu Ağı","Tüm geliri güçlendirir.","multiplier",580000,.3]]},
      {name:"Modern Çağ",icon:"🏙️",description:"Şirketler, bankalar ve otomasyonla küreselleş.",action:"Yatırım Yap",currency:"Kredi",target:42000000,baseClick:3200,upgrades:[["Akıllı Ofisler","Tıklamayı artırır.","click",650000,2600],["Küresel Şirket","Otomatik üretim sağlar.","income",1700000,4100],["Otomasyon","Tüm geliri güçlendirir.","multiplier",8400000,.35]]},
      {name:"Gelecek",icon:"🤖",description:"Yapay zekâ ve robotlarla sınırları kaldır.",action:"Veri İşle",currency:"Enerji",target:900000000,baseClick:41000,upgrades:[["Yapay Zekâ","Tıklamayı artırır.","click",11000000,35000],["Robot İşçiler","Otomatik üretim sağlar.","income",30000000,60000],["Kuantum Çekirdeği","Tüm geliri güçlendirir.","multiplier",150000000,.4]]},
      {name:"Uzay Çağı",icon:"🚀",description:"Mars, Ay ve asteroitlerde yeni ekonomi kur.",action:"Asteroit İşle",currency:"Kozmik Madde",target:25000000000,baseClick:650000,upgrades:[["İyon Motoru","Tıklamayı artırır.","click",350000000,500000],["Mars Kolonisi","Otomatik üretim sağlar.","income",900000000,850000],["Yörünge Ağı","Tüm geliri güçlendirir.","multiplier",4500000000,.5]]},
      {name:"Galaktik Medeniyet",icon:"🌌",description:"Yıldızların enerjisini kontrol et.",action:"Yıldız Enerjisi Topla",currency:"Yıldız Gücü",target:Infinity,baseClick:12000000,upgrades:[["Dyson Küresi","Tıklamayı artırır.","click",15000000000,10000000],["Galaksi Ticareti","Otomatik üretim sağlar.","income",42000000000,18000000],["Tekillik Motoru","Tüm geliri güçlendirir.","multiplier",200000000000,.65]]}
    ];
    const defaultState={age:0,resource:0,wisdom:0,totalEarned:0,upgrades:{},lastSeen:Date.now(),clicks:0,upgradesBought:0,agesAdvanced:0,quests:[],questHistory:[],questSerial:0};
    let state=loadGame();
    function loadGame(){try{const s=JSON.parse(localStorage.getItem("idleTimelineSave"));return s?{...structuredClone(defaultState),...s,upgrades:s.upgrades||{},quests:s.quests||[],questHistory:s.questHistory||[]}:structuredClone(defaultState)}catch{return structuredClone(defaultState)}}
    function saveGame(){state.lastSeen=Date.now();localStorage.setItem("idleTimelineSave",JSON.stringify(state));document.getElementById("saveStatus").textContent="Kaydedildi · "+new Date().toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}
    function levels(){if(!state.upgrades[state.age])state.upgrades[state.age]=[0,0,0];return state.upgrades[state.age]}
    const wm=()=>1+state.wisdom*.12, am=()=>1+state.age*.35;
    function stats(){const a=ages[state.age],l=levels(),m=1+l[2]*a.upgrades[2][4];return{click:(a.baseClick+l[0]*a.upgrades[0][4])*m*wm()*am(),income:l[1]*a.upgrades[1][4]*m*wm()*am()}}
    function cost(i){return ages[state.age].upgrades[i][3]*Math.pow(1.68,levels()[i])}
    function fmt(v){if(!Number.isFinite(v))return"∞";if(v<1000)return Math.floor(v).toLocaleString("tr-TR");for(const [n,s] of [[1e15,"Qa"],[1e12,"T"],[1e9,"B"],[1e6,"M"],[1e3,"K"]])if(v>=n)return(v/n).toLocaleString("tr-TR",{maximumFractionDigits:2})+s;return Math.floor(v).toLocaleString("tr-TR")}
    function render(){ensureQuests();checkQuests();const a=ages[state.age],s=stats();ageName.textContent=a.name;ageIcon.textContent=a.icon;ageDescription.textContent=a.description;resourceText.textContent=fmt(state.resource);incomeText.textContent=fmt(s.income)+"/sn";clickText.textContent=fmt(s.click);wisdomText.textContent=fmt(state.wisdom);actionName.textContent=a.action;actionGain.textContent="+"+fmt(s.click)+" "+a.currency;const p=a.target===Infinity?100:Math.min(100,state.resource/a.target*100);progressBar.style.width=p+"%";progressText.textContent=a.target===Infinity?"Maksimum çağ":fmt(state.resource)+" / "+fmt(a.target);renderUpgrades();renderTimeline();const can=state.age<ages.length-1&&state.resource>=a.target;nextAgeButton.disabled=!can;nextAgeButton.textContent=state.age===ages.length-1?"Son Çağa Ulaştın":"Sonraki Çağa Geç";const g=prestigeGain();prestigeButton.disabled=state.age<3||g<1;prestigeButton.textContent=g>0?`Prestij Yap (+${g})`:"Prestij Yap";prestigeInfo.textContent=state.age<3?"Sanayi Devrimi'nde açılır. Kalıcı üretim bonusu verir.":`Şimdi dönersen ${g} Bilgelik kazanırsın.`;renderQuests()}
    function renderUpgrades(){upgradeList.innerHTML="";const a=ages[state.age],l=levels();a.upgrades.forEach((u,i)=>{const c=cost(i),d=document.createElement("div");d.className="upgrade";d.innerHTML=`<div><strong>${u[0]} · Lv.${l[i]}</strong><small>${u[1]}</small></div><button ${state.resource<c?"disabled":""}>${fmt(c)}</button>`;d.querySelector("button").onclick=()=>{if(state.resource<c)return;state.resource-=c;l[i]++;state.upgradesBought++;render()};upgradeList.appendChild(d)})}
    function renderTimeline(){timeline.innerHTML="";ages.forEach((a,i)=>{const d=document.createElement("div");d.className="age "+(i===state.age?"current":i<state.age?"done":"");d.innerHTML=`<i>${i<=state.age?a.icon:"·"}</i><div>${a.name}<small>${i<state.age?"Tamamlandı":i===state.age?"Aktif":"Kilitli"}</small></div>`;timeline.appendChild(d)})}
    function earn(v){state.resource+=v;state.totalEarned+=v}

    function questValue(type){
      if(type==="earn")return state.totalEarned;
      if(type==="click")return state.clicks;
      if(type==="upgrade")return state.upgradesBought;
      if(type==="income")return stats().income;
      if(type==="resource")return state.resource;
      if(type==="age")return state.agesAdvanced;
      return 0;
    }
    function questCandidates(){
      const a=ages[state.age],s=stats(),scale=Math.max(1,a.target===Infinity?Math.max(state.resource,1e9):a.target);
      return [
        {key:"earn",type:"earn",title:`${a.currency} üret`,goal:Math.max(100,Math.ceil(scale*.10)),reward:Math.ceil(scale*.025)},
        {key:"click",type:"click",title:`${a.action}`,goal:20+state.age*8,reward:Math.ceil(scale*.018)},
        {key:"upgrade",type:"upgrade",title:"Geliştirme satın al",goal:2+Math.floor(state.age/2),reward:Math.ceil(scale*.03)},
        {key:"income",type:"income",title:"Saniyelik gelire ulaş",goal:Math.max(a.baseClick*2,Math.ceil(Math.max(1,s.income)*2.2)),reward:Math.ceil(scale*.035)},
        {key:"resource",type:"resource",title:`${a.currency} biriktir`,goal:Math.max(150,Math.ceil(scale*.16)),reward:Math.ceil(scale*.04)},
        ...(state.age<ages.length-1?[{key:"age",type:"age",title:"Yeni çağa geç",goal:1,reward:Math.ceil(scale*.06)}]:[])
      ];
    }
    function makeQuest(){
      const recent=new Set(state.questHistory.slice(-5)),active=new Set(state.quests.map(q=>q.key));
      let pool=questCandidates().filter(q=>!recent.has(q.key)&&!active.has(q.key));
      if(!pool.length)pool=questCandidates().filter(q=>!active.has(q.key));
      const q=pool[Math.floor(Math.random()*pool.length)]||questCandidates()[0];
      return {...q,id:++state.questSerial,start:questValue(q.type),ageCreated:state.age};
    }
    function ensureQuests(){while(state.quests.length<3)state.quests.push(makeQuest())}
    function questProgress(q){
      if(q.type==="income"||q.type==="resource")return questValue(q.type);
      return Math.max(0,questValue(q.type)-q.start);
    }
    function checkQuests(){
      let changed=false;
      for(let i=state.quests.length-1;i>=0;i--){const q=state.quests[i],p=questProgress(q);if(p>=q.goal){state.resource+=q.reward;state.totalEarned+=q.reward;state.questHistory.push(q.key);state.questHistory=state.questHistory.slice(-8);state.quests.splice(i,1);toast(`Görev tamamlandı · +${fmt(q.reward)}`);changed=true}}
      if(changed)ensureQuests();
    }
    function renderQuests(){
      questList.innerHTML="";
      state.quests.forEach(q=>{const p=Math.min(q.goal,questProgress(q)),pct=Math.min(100,p/q.goal*100),d=document.createElement("div");d.className="quest";d.innerHTML=`<div class="quest-top"><b>${q.title}</b><em>+${fmt(q.reward)}</em></div><div class="quest-bar"><div style="width:${pct}%"></div></div><div class="quest-meta"><span>${fmt(p)} / ${fmt(q.goal)}</span><span>${ages[state.age].currency}</span></div>`;questList.appendChild(d)})
    }
    function prestigeGain(){if(state.age<3)return 0;return Math.max(1,Math.floor((state.age-2)*2+Math.log10(Math.max(10,state.totalEarned))-4))}
    function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove("show"),1800)}
    mainAction.onclick=()=>{earn(stats().click);state.clicks++;render()};
    nextAgeButton.onclick=()=>{const a=ages[state.age];if(state.age>=ages.length-1||state.resource<a.target)return;state.age++;state.agesAdvanced++;state.resource=0;toast(ages[state.age].name+" açıldı");render();saveGame()};
    prestigeButton.onclick=()=>{const g=prestigeGain();if(g<1||state.age<3)return;state={...structuredClone(defaultState),wisdom:state.wisdom+g,questHistory:state.questHistory.slice(-5)};toast("+"+g+" Bilgelik");render();saveGame()};
    resetButton.onclick=()=>{if(!confirm("Tüm ilerleme silinsin mi?"))return;localStorage.removeItem("idleTimelineSave");state=structuredClone(defaultState);render();toast("Kayıt sıfırlandı")};
    function offline(){const now=Date.now(),sec=Math.min(14400,Math.max(0,(now-(state.lastSeen||now))/1000)),g=stats().income*sec;if(g>1){earn(g);setTimeout(()=>toast("Çevrimdışı +"+fmt(g)),350)}state.lastSeen=now}
    setInterval(()=>{earn(stats().income/10);render()},100);setInterval(saveGame,5000);addEventListener("beforeunload",saveGame);offline();render();saveGame();
  </script>
</body>
</html>
