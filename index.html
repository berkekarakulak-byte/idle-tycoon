<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Idle Timeline</title>
<style>
:root{--bg:#08090d;--p:#11131a;--p2:#171a23;--p3:#1d2130;--tx:#f5f7fb;--mu:#9198aa;--ac:#8d7cff;--ac2:#31d3a4;--gd:#f2c76f;--rd:#ff7289;--bd:rgba(255,255,255,.075);--sh:0 18px 50px rgba(0,0,0,.35)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,rgba(141,124,255,.16),transparent 32%),var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit}.app{width:min(1080px,calc(100% - 16px));margin:auto;padding:10px 0 28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.brand{display:flex;gap:9px;align-items:center}.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),#5d48dc)}h1{font-size:18px;margin:0}.sub,.muted{color:var(--mu)}.sub{font-size:10px}.tools{display:flex;gap:5px}.icon{border:1px solid var(--bd);background:var(--p);color:var(--mu);border-radius:9px;padding:7px 9px;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:9px}.panel{background:linear-gradient(180deg,rgba(255,255,255,.022),transparent),var(--p);border:1px solid var(--bd);border-radius:15px;box-shadow:var(--sh)}.main,.side{padding:11px}.hero{display:flex;justify-content:space-between;gap:8px}.ey{font-size:9px;text-transform:uppercase;letter-spacing:1.2px;color:var(--ac2);font-weight:800}.hero h2{font-size:25px;line-height:1;margin:4px 0}.desc{font-size:10px;color:var(--mu)}.scene{height:122px;margin:10px 0;border:1px solid var(--bd);border-radius:12px;position:relative;overflow:hidden;background:linear-gradient(#2d355b,#171a23 65%)}.scene.night{filter:brightness(.66) saturate(.86)}.weather{position:absolute;inset:0;padding:8px;font-size:17px;letter-spacing:22px;opacity:.62}.world{position:absolute;inset:auto 0 10px;display:flex;justify-content:center;align-items:end;gap:4px;font-size:27px}.citizen{position:absolute;bottom:7px;animation:walk 9s linear infinite;font-size:16px}.citizen.b{animation-delay:-4.5s;transform:scaleX(-1)}@keyframes walk{from{left:-20px}to{left:100%}}.event{display:none;padding:8px 9px;border-radius:10px;border:1px solid rgba(242,199,111,.24);background:rgba(242,199,111,.07);margin-bottom:7px}.event.show{display:flex;justify-content:space-between;align-items:center;gap:8px}.event b{font-size:10px;color:var(--gd)}.event small{display:block;color:var(--mu);font-size:8px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:7px}.stat{padding:7px 8px;border-radius:9px;background:var(--p2);border:1px solid var(--bd)}.stat span{display:block;font-size:8px;color:var(--mu)}.stat b{font-size:12px}.action{width:100%;border:0;border-radius:12px;padding:12px;color:white;text-align:left;background:linear-gradient(135deg,var(--ac),#624ce4);cursor:pointer}.action strong{display:block;font-size:15px}.action small{color:rgba(255,255,255,.72)}.prow{display:flex;justify-content:space-between;color:var(--mu);font-size:9px;margin:7px 1px 4px}.bar{height:5px;border-radius:99px;background:#0b0d12;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));transition:.2s}.head{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px}.head b{font-size:10px}.head span{font-size:8px;color:var(--mu)}.list{display:grid;gap:5px}.card{background:var(--p2);border:1px solid var(--bd);border-radius:9px;padding:7px 8px}.row{display:flex;justify-content:space-between;align-items:center;gap:7px}.card b{font-size:10px}.card small{font-size:8px;color:var(--mu);display:block;margin-top:2px}.btn{border:0;border-radius:7px;padding:6px 8px;background:var(--ac2);color:#07140f;font-size:9px;font-weight:800;cursor:pointer}.btn.alt{background:var(--gd);color:#261d08}.btn.dark{background:var(--p3);color:var(--tx);border:1px solid var(--bd)}.btn.red{background:rgba(255,114,137,.14);color:#ff9daf;border:1px solid rgba(255,114,137,.25)}button:disabled{opacity:.3;filter:grayscale(1);cursor:not-allowed}.qbar{height:4px;background:#0b0d12;border-radius:99px;overflow:hidden;margin-top:5px}.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac))}.qmeta{display:flex;justify-content:space-between;font-size:8px;color:var(--mu);margin-top:3px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:7px}.tab{border:1px solid var(--bd);background:transparent;color:var(--mu);font-size:8px;padding:6px 2px;border-radius:7px;cursor:pointer}.tab.active{color:var(--tx);background:rgba(141,124,255,.12);border-color:rgba(141,124,255,.3)}.pane{display:none}.pane.active{display:block}.lock{padding:18px 9px;text-align:center;color:var(--mu);font-size:9px;border:1px dashed var(--bd);border-radius:9px}.badge{font-size:7px;padding:3px 5px;border-radius:99px;background:rgba(141,124,255,.13);color:#ccc5ff}.age{display:flex;gap:7px;align-items:center;padding:6px;border-radius:8px;color:var(--mu);font-size:9px}.age.current{background:rgba(141,124,255,.12);color:var(--tx)}.primary{width:100%;margin-top:7px;border:0;border-radius:8px;padding:8px;background:linear-gradient(135deg,#ff9b56,#ff7088);color:#fff;font-size:9px;font-weight:800;cursor:pointer}.toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,12px);opacity:0;background:#151822;border:1px solid var(--bd);border-radius:9px;padding:8px 11px;font-size:10px;transition:.2s;pointer-events:none;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;place-items:center;padding:12px;z-index:20}.modal.show{display:grid}.modalbox{width:min(440px,100%);max-height:85vh;overflow:auto;background:var(--p);border:1px solid var(--bd);border-radius:14px;padding:12px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{font-size:13px;margin:0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.choice{padding:8px;border:1px solid var(--bd);background:var(--p2);border-radius:8px;text-align:center;cursor:pointer}.choice.active{border-color:var(--ac);background:rgba(141,124,255,.12)}.choice b{display:block;font-size:9px}.choice small{font-size:7px;color:var(--mu)}.market-up{color:var(--ac2)}.market-down{color:var(--rd)}@media(max-width:820px){.layout{grid-template-columns:1fr}.side{order:2}}@media(max-width:520px){.stats{grid-template-columns:repeat(3,1fr)}.stats .stat:nth-child(4),.stats .stat:nth-child(5){display:none}.main,.side{padding:9px}.scene{height:105px}.choices{grid-template-columns:1fr}.tools .txt{display:none}}
</style>
</head>
<body>
<main class="app"><header class="top"><div class="brand"><div class="logo">⏳</div><div><h1>Idle Timeline</h1><div class="sub">Yaşayan medeniyetini büyüt.</div></div></div><div class="tools"><button class="icon" id="sound">🔊</button><button class="icon" id="save"><span class="txt">Kaydet </span>💾</button></div></header>
<section class="layout"><div class="panel main"><div class="hero"><div><div class="ey">Aktif çağ</div><h2 id="ageName"></h2><div class="desc" id="ageDesc"></div></div><div id="ageIcon" style="font-size:34px"></div></div>
<div class="scene" id="scene"><div class="weather" id="weather"></div><div class="world" id="world"></div><div class="citizen">🚶</div><div class="citizen b">🚶</div></div>
<div class="event" id="event"><div><b id="eventTitle"></b><small id="eventText"></small></div><button class="btn alt" id="eventBtn">Al</button></div>
<div class="stats"><div class="stat"><span>Kaynak</span><b id="resource"></b></div><div class="stat"><span>Gelir</span><b id="income"></b></div><div class="stat"><span>Tıklama</span><b id="click"></b></div><div class="stat"><span>Nüfus</span><b id="pop"></b></div><div class="stat"><span>Mutluluk</span><b id="happy"></b></div></div>
<button class="action" id="action"><strong id="actionName"></strong><small id="actionGain"></small></button><div class="prow"><span>Çağ ilerlemesi</span><span id="progressText"></span></div><div class="bar"><i id="progress"></i></div>
<div class="head"><b>Geliştirmeler</b><span id="bonus"></span></div><div class="list" id="upgrades"></div><div class="head"><b>Dinamik görevler</b><span>Ödüller otomatik</span></div><div class="list" id="quests"></div></div>
<aside class="panel side"><div class="tabs"><button class="tab active" data-tab="core">Çağ</button><button class="tab" data-tab="city">Şehir</button><button class="tab" data-tab="explore">Keşif</button><button class="tab" data-tab="meta">Meta</button></div>
<div class="pane active" id="pane-core"><div class="list" id="timeline"></div><button class="primary" id="advance"></button><div class="head"><b>Rehber</b><span id="npcName"></span></div><div class="card"><div class="row"><b id="npcFace"></b><span class="badge" id="storyStep"></span></div><small id="npcText"></small></div><div class="head"><b>Prestij</b><span id="wisdom"></span></div><div class="card"><small id="prestigeText"></small><button class="btn alt" style="width:100%;margin-top:6px" id="prestige">Zamanı Sıfırla</button></div></div>
<div class="pane" id="pane-city"></div><div class="pane" id="pane-explore"></div><div class="pane" id="pane-meta"></div></aside></section></main>
<div class="toast" id="toast"></div><div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle"></h3><button class="icon" id="modalClose">✕</button></div><div id="modalBody"></div></div></div>
<script>
'use strict';
const A=[
{name:'Taş Devri',icon:'🪨',desc:'Ateşi yak ve ilk yerleşimi kur.',currency:'Kaynak',action:'Taş Topla',target:1200,base:1,world:['🌲','🔥','⛺'],npc:['🧔','Kabile Reisi'],boss:['🦣','Mamut'],ups:[['Keskin Taş','Tıklama gücü','click',14,1],['Toplayıcılar','Otomatik gelir','income',38,1],['Ateş Kampı','Tüm üretim','multi',190,.12]]},
{name:'Antik Çağ',icon:'🏛️',desc:'Tarım, şehir ve ticaret kur.',currency:'Altın',action:'Hasat Yap',target:18000,base:8,world:['🌾','🏛️','⛵'],npc:['🧙','Filozof'],boss:['🐍','Tapınak Yılanı'],ups:[['Sulama','Tıklama gücü','click',190,7],['Pazar','Otomatik gelir','income',480,9],['Ticaret Yolu','Tüm üretim','multi',2600,.17]]},
{name:'Orta Çağ',icon:'🏰',desc:'Krallığını ve zanaatı büyüt.',currency:'Hazine',action:'Vergi Topla',target:240000,base:55,world:['🌲','🏰','🐎'],npc:['👑','Kral'],boss:['🐉','Ejderha'],ups:[['Demirhane','Tıklama gücü','click',3100,42],['Loncalar','Otomatik gelir','income',8200,68],['Kraliyet Fermanı','Tüm üretim','multi',43000,.22]]},
{name:'Sanayi Devrimi',icon:'🏭',desc:'Buhar ve fabrikalarla seri üretime geç.',currency:'Sermaye',action:'Üretim Yap',target:3400000,base:420,world:['🚂','🏭','🏢'],npc:['👷','Mühendis'],boss:['⚙️','Dev Makine'],ups:[['Buhar Motoru','Tıklama gücü','click',62000,340],['Fabrika Hattı','Otomatik gelir','income',155000,560],['Demiryolu','Tüm üretim','multi',760000,.28]]},
{name:'Modern Çağ',icon:'🏙️',desc:'Küresel ekonomi ve teknoloji ağları kur.',currency:'Kredi',action:'Yatırım Yap',target:65000000,base:4400,world:['🏙️','🚗','✈️'],npc:['🧑‍💼','CEO'],boss:['📉','Büyük Kriz'],ups:[['Akıllı Ofis','Tıklama gücü','click',900000,3500],['Küresel Şirket','Otomatik gelir','income',2400000,6100],['Otomasyon','Tüm üretim','multi',12000000,.34]]},
{name:'Gelecek',icon:'🤖',desc:'Yapay zekâ ve kuantum sistemlerini yönet.',currency:'Enerji',action:'Veri İşle',target:1400000000,base:60000,world:['🤖','🌐','🧬'],npc:['🧠','Merkez AI'],boss:['🕳️','Tekillik'],ups:[['Yapay Zekâ','Tıklama gücü','click',17000000,48000],['Robot İşçiler','Otomatik gelir','income',46000000,82000],['Kuantum Çekirdek','Tüm üretim','multi',230000000,.42]]},
{name:'Uzay Çağı',icon:'🚀',desc:'Gezegenler arası medeniyet kur.',currency:'Kozmik Madde',action:'Asteroit İşle',target:42000000000,base:980000,world:['🌕','🚀','🪐'],npc:['👨‍🚀','Komutan'],boss:['👽','Uzaylı Filo'],ups:[['İyon Motoru','Tıklama gücü','click',580000000,760000],['Mars Kolonisi','Otomatik gelir','income',1500000000,1300000],['Yörünge Ağı','Tüm üretim','multi',7600000000,.52]]},
{name:'Galaktik Medeniyet',icon:'🌌',desc:'Yıldız sistemlerini tek ağda birleştir.',currency:'Yıldız Gücü',action:'Yıldız Enerjisi Topla',target:Infinity,base:17000000,world:['🌌','☀️','🌀'],npc:['🛸','Galaktik Konsey'],boss:['🌑','Karanlık Çekirdek'],ups:[['Dyson Küresi','Tıklama gücü','click',24000000000,14000000],['Galaksi Ticareti','Otomatik gelir','income',65000000000,25000000],['Tekillik Motoru','Tüm üretim','multi',310000000000,.68]]}
];
const WORLDS=[['Dünya','🌍','Dengeli başlangıç',1],['Buz Dünyası','🧊','Gelir +%20, tıklama -%10',1.2],['Volkanik Dünya','🌋','Tıklama +%35',1.08],['Su Dünyası','🌊','Görev ödülü +%25',1.1]];
const SKINS=[['Klasik','🎨'],['Steampunk','⚙️'],['Cyber','🟣'],['Viking','🛡️']];
const EVOS=[['Üretken Gen','Gelir +%8'],['Keskin Refleks','Kritik şans +%3'],['Diplomasi','Mutluluk kaybı azalır'],['Kaşif Ruhu','Keşif ödülü +%15']];
const defaultState={v:4,age:0,maxAge:0,res:0,total:0,wisdom:0,prestiges:0,up:{},clicks:0,bought:0,quests:[],recent:[],questSeq:0,pop:2,happiness:100,food:0,market:1,marketAt:0,event:null,eventAt:0,eventMult:1,eventEnd:0,weather:'clear',weatherAt:0,expedition:null,collection:[],ach:[],research:[],rp:0,chestAt:0,civ:'',evolution:[],world:0,worlds:[0],skin:0,story:0,lab:[],puzzleAt:0,leagueScore:0,alliance:0,stock:0,stockPrice:100,stockAt:0,boss:{},sound:true,last:Date.now()};
let S=load(),last=performance.now(),lastUI=0,audio=null,toastTimer;
const $=id=>document.getElementById(id), clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function load(){try{const x=JSON.parse(localStorage.getItem('idleTimelineV4'));if(!x)return structuredClone(defaultState);return Object.assign(structuredClone(defaultState),x,{up:x.up||{},boss:x.boss||{},quests:Array.isArray(x.quests)?x.quests:[],recent:Array.isArray(x.recent)?x.recent:[]})}catch{return structuredClone(defaultState)}}
function save(show=false){S.last=Date.now();localStorage.setItem('idleTimelineV4',JSON.stringify(S));if(show)toast('Oyun kaydedildi')}
function fmt(n){if(!Number.isFinite(n))return'∞';if(n<1000)return Math.floor(n).toLocaleString('tr-TR');for(const [v,s] of [[1e18,'Qi'],[1e15,'Qa'],[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']])if(n>=v)return(n/v).toLocaleString('tr-TR',{maximumFractionDigits:2})+s;return Math.floor(n)}
function lv(){if(!S.up[S.age])S.up[S.age]=[0,0,0];return S.up[S.age]}
function unlockLevel(){return S.age+S.prestiges*2+Math.floor(S.total>1e6?2:S.total>1e4?1:0)}
function worldMult(){return WORLDS[S.world][3]}
function researchBonus(id){return S.research.includes(id)}
function stats(){const a=A[S.age],l=lv(),m=(1+l[2]*a.ups[2][4])*(1+S.wisdom*.1)*worldMult()*(S.eventMult||1)*(1+S.evolution.filter(x=>x===0).length*.08)*(researchBonus('prod')?1.15:1)*(1+(S.happiness-50)/500);let click=(a.base+l[0]*a.ups[0][4])*m, income=l[1]*a.ups[1][4]*m;if(S.world===2)click*=1.35;if(S.world===1)click*=.9;return{click:Math.max(0,click),income:Math.max(0,income),crit:.05+S.evolution.filter(x=>x===1).length*.03+(researchBonus('crit')?.05:0)}}
function cost(i){return A[S.age].ups[i][3]*Math.pow(1.68,lv()[i])}
function earn(n){if(!Number.isFinite(n)||n<=0)return;S.res=Math.min(Number.MAX_VALUE/100,S.res+n);S.total+=n;S.leagueScore+=Math.sqrt(n)}
function buy(i){const c=cost(i);if(S.res<c)return;S.res-=c;lv()[i]++;S.bought++;S.pop+=i===1?1:0;beep(500,.03);render()}
const QT=['earn','click','buy','income','save','population','happy','market'];
function makeQuest(){let pool=QT.filter(t=>!S.recent.slice(-5).includes(t));if(!pool.length)pool=QT;const type=pool[Math.floor(Math.random()*pool.length)],a=A[S.age],st=stats(),base=a.target===Infinity?Math.max(S.res,1e9):a.target;let goal,start,title,reward;
if(type==='earn'){goal=Math.max(st.income*25,base*.025);start=S.total;title=`${fmt(goal)} ${a.currency} üret`}
if(type==='click'){goal=20+S.age*8;start=S.clicks;title=`${goal} kez aktif üretim yap`}
if(type==='buy'){goal=2+Math.floor(S.age/2);start=S.bought;title=`${goal} geliştirme satın al`}
if(type==='income'){goal=Math.max(3,st.income*1.7+a.base);start=0;title=`Geliri ${fmt(goal)}/sn yap`}
if(type==='save'){goal=Math.max(base*.035,S.res*1.35+10);start=0;title=`${fmt(goal)} ${a.currency} biriktir`}
if(type==='population'){goal=S.pop+Math.max(2,Math.ceil(S.age/2));start=0;title=`Nüfusu ${goal} yap`}
if(type==='happy'){goal=85;start=0;title='Mutluluğu %85 üzerinde tut'}
if(type==='market'){goal=1;start=S.marketTrades||0;title='Pazarda 1 işlem yap'}
reward=Math.max(a.base*20,base*.012)*(S.world===3?1.25:1);S.recent.push(type);if(S.recent.length>12)S.recent.shift();return{id:++S.questSeq,type,goal,start,title,reward}}
function ensureQuests(){while(S.quests.length<3)S.quests.push(makeQuest())}
function qprogress(q){if(q.type==='earn')return S.total-q.start;if(q.type==='click')return S.clicks-q.start;if(q.type==='buy')return S.bought-q.start;if(q.type==='income')return stats().income;if(q.type==='save')return S.res;if(q.type==='population')return S.pop;if(q.type==='happy')return S.happiness;if(q.type==='market')return(S.marketTrades||0)-q.start;return 0}
function checkQuests(){ensureQuests();let changed=false;S.quests=S.quests.filter(q=>{if(qprogress(q)>=q.goal){earn(q.reward);S.rp+=1;S.story++;toast(`Görev tamamlandı · +${fmt(q.reward)}`);changed=true;return false}return true});if(changed)ensureQuests()}
function eventTick(){const now=Date.now();if(S.eventMult>1&&now>=S.eventEnd)S.eventMult=1;if(!S.event&&now>=S.eventAt){const e=[{t:'Altın Çağ',d:'30 saniye üretim x2',m:2},{t:'Festival',d:'Mutluluk +20',happy:20},{t:'Gezgin Tüccar',d:'Anında büyük kaynak',instant:.04},{t:'Nüfus Patlaması',d:'Nüfus +5',pop:5}][Math.floor(Math.random()*4)];S.event=e;S.eventAt=now+70000+Math.random()*50000}}
function takeEvent(){if(!S.event)return;const e=S.event;if(e.m){S.eventMult=e.m;S.eventEnd=Date.now()+30000}if(e.happy)S.happiness=clamp(S.happiness+e.happy,0,100);if(e.pop)S.pop+=e.pop;if(e.instant)earn((A[S.age].target===Infinity?Math.max(S.res,1e9):A[S.age].target)*e.instant);S.event=null;toast(e.t+' etkin');render()}
function weatherTick(){if(Date.now()<S.weatherAt)return;S.weather=['clear','rain','snow'][Math.floor(Math.random()*3)];S.weatherAt=Date.now()+60000+Math.random()*80000}
function marketTick(){if(Date.now()<S.marketAt)return;S.market=clamp(S.market+(Math.random()-.5)*.3,.65,1.55);S.marketAt=Date.now()+30000;S.stockPrice=clamp(S.stockPrice+(Math.random()-.48)*18,20,450);S.stockAt=Date.now()+30000}
function trade(buying){const unit=Math.max(A[S.age].base*15,stats().income*8+10);if(buying){const c=unit*S.market;if(S.res<c)return;S.res-=c;S.food+=10}else{if(S.food<10)return;S.food-=10;earn(unit*S.market)}S.marketTrades=(S.marketTrades||0)+1;render()}
function chest(){if(Date.now()<S.chestAt)return;const roll=Math.random(),base=A[S.age].target===Infinity?Math.max(S.res,1e9):A[S.age].target;if(roll<.18){const items=['İlk Ateş','Altın Taç','Buhar Çekirdeği','Kuantum Parçası','Yıldız Haritası'];const item=items[Math.floor(Math.random()*items.length)];if(!S.collection.includes(item))S.collection.push(item);toast('Nadir eşya: '+item)}else earn(base*(.02+Math.random()*.05));S.chestAt=Date.now()+120000;render()}
function expedition(){if(S.expedition)return;const dur=60000+S.age*15000;S.expedition={end:Date.now()+dur,power:1+S.age*.25};toast('Keşif ekibi yola çıktı');render()}
function expeditionTick(){if(!S.expedition||Date.now()<S.expedition.end)return;const base=A[S.age].target===Infinity?Math.max(S.res,1e9):A[S.age].target,gain=base*.035*S.expedition.power*(S.evolution.includes(3)?1.15:1);earn(gain);S.rp+=2;if(Math.random()<.25&&!S.collection.includes('Kayıp Harita'))S.collection.push('Kayıp Harita');S.expedition=null;toast('Keşif tamamlandı · +'+fmt(gain))}
function advance(){const a=A[S.age];if(S.res<a.target||S.age>=A.length-1)return;if(!S.boss[S.age])return openBoss();S.age++;S.maxAge=Math.max(S.maxAge,S.age);S.res=0;S.rp+=2;S.happiness=clamp(S.happiness+8,0,100);S.story++;S.quests=[];ensureQuests();toast(A[S.age].name+' açıldı');render()}
function openBoss(){const a=A[S.age],max=a.target*.1;openModal(a.boss[0]+' '+a.boss[1],`<div class="card" style="text-align:center"><div style="font-size:52px">${a.boss[0]}</div><b>${a.boss[1]}</b><small>Kaynağını hasara dönüştürerek çağı tamamla.</small><div class="bar" style="margin:9px 0"><i id="bossbar" style="width:100%"></i></div><div id="bosstxt">${fmt(max)} / ${fmt(max)}</div><button class="btn red" style="width:100%;margin-top:8px" id="bossattack">Saldır</button></div>`);S.bossHp=S.bossHp||max;const attack=()=>{const dmg=Math.min(S.res,stats().click*4);if(dmg<=0)return;S.res-=dmg;S.bossHp-=dmg;const hp=Math.max(0,S.bossHp);$('bossbar').style.width=hp/max*100+'%';$('bosstxt').textContent=`${fmt(hp)} / ${fmt(max)}`;if(hp<=0){S.boss[S.age]=true;S.bossHp=0;closeModal();toast('Boss yenildi');render()}};$('bossattack').onclick=attack}
function prestigeGain(){return S.age<3?0:Math.max(1,Math.floor((S.age-2)*2+Math.log10(Math.max(10,S.total))-4))}
function prestige(){const g=prestigeGain();if(!g)return;S.wisdom+=g;S.prestiges++;S.age=0;S.res=0;S.total=0;S.up={};S.quests=[];S.event=null;S.eventMult=1;S.boss={};S.pop=2;S.happiness=100;if(S.prestiges===1&&!S.civ)S.civ='science';if(S.prestiges%2===0){const next=Math.min(WORLDS.length-1,S.worlds.length);if(!S.worlds.includes(next))S.worlds.push(next)}ensureQuests();toast(`Zaman sıfırlandı · +${g} Bilgelik`);render()}
function research(id,cost){if(S.research.includes(id)||S.rp<cost)return;S.rp-=cost;S.research.push(id);toast('Araştırma tamamlandı');render()}
function evolve(i){if(S.evolution.length>=Math.max(1,S.prestiges))return;if(S.evolution.includes(i))return;S.evolution.push(i);render()}
function labCombine(){if(S.rp<5)return;S.rp-=5;const recipes=['Otomatik Tarım','Nano İşçiler','Yıldız Yakıtı'];const x=recipes[Math.floor(Math.random()*recipes.length)];if(!S.lab.includes(x))S.lab.push(x);else S.wisdom++;toast('Laboratuvar: '+x);render()}
function puzzle(){if(Date.now()<S.puzzleAt)return;const a=Math.floor(Math.random()*8)+2,b=Math.floor(Math.random()*8)+2,ans=a+b;openModal('Kayıp Teknoloji',`<div class="card"><b>${a} + ${b} kaçtır?</b><div class="choices">${[ans,ans+1,ans-1].sort(()=>Math.random()-.5).map(x=>`<button class="choice" data-answer="${x}">${x}</button>`).join('')}</div></div>`);document.querySelectorAll('[data-answer]').forEach(bu=>bu.onclick=()=>{if(+bu.dataset.answer===ans){S.rp+=3;toast('+3 araştırma puanı')}else toast('Yanlış cevap');S.puzzleAt=Date.now()+180000;closeModal();render()})}
function stockTrade(buying){const lot=1;if(buying){if(S.res<S.stockPrice)return;S.res-=S.stockPrice;S.stock+=lot}else{if(S.stock<lot)return;S.stock-=lot;earn(S.stockPrice)}render()}
function allianceContribute(){const c=Math.max(10,A[S.age].base*50);if(S.res<c)return;S.res-=c;S.alliance+=c;if(S.alliance>=100000){S.wisdom++;S.alliance=0;toast('Mega proje tamamlandı · +1 Bilgelik')}render()}
function render(){const a=A[S.age],st=stats(),l=lv();$('ageName').textContent=a.name;$('ageDesc').textContent=a.desc;$('ageIcon').textContent=a.icon;$('resource').textContent=fmt(S.res);$('income').textContent=fmt(st.income)+'/sn';$('click').textContent=fmt(st.click);$('pop').textContent=fmt(S.pop);$('happy').textContent='%'+Math.floor(S.happiness);$('actionName').textContent=a.action;$('actionGain').textContent=`+${fmt(st.click)} ${a.currency} · Kritik %${Math.round(st.crit*100)}`;const p=a.target===Infinity?100:Math.min(100,S.res/a.target*100);$('progress').style.width=p+'%';$('progressText').textContent=a.target===Infinity?'Maksimum çağ':`${fmt(S.res)} / ${fmt(a.target)}`;$('bonus').textContent=`Toplam x${(st.income/(Math.max(1,l[1]*a.ups[1][4]))||1).toFixed(2)}`;
$('world').innerHTML=a.world.map(x=>`<span>${x}</span>`).join('');$('scene').classList.toggle('night',new Date().getHours()<7||new Date().getHours()>19);$('weather').textContent=S.weather==='rain'?'🌧️  🌧️  🌧️':S.weather==='snow'?'❄️  ❄️  ❄️':'';$('event').classList.toggle('show',!!S.event);if(S.event){$('eventTitle').textContent=S.event.t;$('eventText').textContent=S.event.d}
$('upgrades').innerHTML=a.ups.map((u,i)=>`<div class="card row"><div><b>${u[0]} · Lv.${l[i]}</b><small>${u[1]}</small></div><button class="btn" data-buy="${i}" ${S.res<cost(i)?'disabled':''}>${fmt(cost(i))}</button></div>`).join('');document.querySelectorAll('[data-buy]').forEach(x=>x.onclick=()=>buy(+x.dataset.buy));ensureQuests();$('quests').innerHTML=S.quests.map(q=>{const v=Math.min(q.goal,qprogress(q));return`<div class="card"><div class="row"><b>${q.title}</b><span class="badge">+${fmt(q.reward)}</span></div><div class="qbar"><i style="width:${Math.min(100,v/q.goal*100)}%"></i></div><div class="qmeta"><span>${fmt(v)} / ${fmt(q.goal)}</span><span>Otomatik</span></div></div>`}).join('');
$('timeline').innerHTML=A.map((x,i)=>`<div class="age ${i===S.age?'current':''}"><span>${i<=S.maxAge?x.icon:'·'}</span><div>${x.name}<small>${i<S.age?'Tamamlandı':i===S.age?'Aktif':'Kilitli'}</small></div></div>`).join('');$('advance').disabled=S.res<a.target||S.age>=A.length-1;$('advance').textContent=S.age>=A.length-1?'Son Çağa Ulaştın':S.boss[S.age]?'Sonraki Çağa Geç':'Çağın Boss’una Meydan Oku';$('npcFace').textContent=a.npc[0];$('npcName').textContent=a.npc[1];$('storyStep').textContent='Bölüm '+(S.story+1);$('npcText').textContent=st.income===0?'Otomatik üretimi açarak medeniyeti kendi kendine büyüt.':S.happiness<55?'Halk mutsuz. Festival veya yiyecek desteği gerekli.':S.res>=a.target&&!S.boss[S.age]?'Kaynağın hazır. Çağın son sınavı seni bekliyor.':'Dengeli yükseltmelerle çağa hazırlan.';$('wisdom').textContent=fmt(S.wisdom)+' Bilgelik';const pg=prestigeGain();$('prestige').disabled=!pg;$('prestige').textContent=pg?`Zamanı Sıfırla (+${pg})`:'Sanayi Çağında Açılır';$('prestigeText').textContent='Kalıcı güç kazanır, yeni dünyaları ve evrimi açarsın.';$('sound').textContent=S.sound?'🔊':'🔇';renderPanes()}
function renderPanes(){const lvl=unlockLevel();$('pane-city').innerHTML=lvl<2?lock('Şehir sistemi Antik Çağda açılır'):cityHTML();$('pane-explore').innerHTML=lvl<3?lock('Keşif sistemi Orta Çağda açılır'):exploreHTML();$('pane-meta').innerHTML=S.prestiges<1?lock('Meta sistemler ilk prestijden sonra açılır'):metaHTML();bindPane()}
const lock=t=>`<div class="lock">🔒 ${t}</div>`;
function cityHTML(){return`<div class="head"><b>Şehir Yönetimi</b><span>Canlı ekonomi</span></div><div class="card"><div class="row"><b>👥 Nüfus ${fmt(S.pop)}</b><span class="badge">😊 %${Math.floor(S.happiness)}</span></div><small>Yüksek mutluluk üretimi artırır. Nüfus otomatik gelir yatırımlarıyla büyür.</small><div class="row" style="margin-top:6px"><button class="btn alt" id="festival">Festival</button><button class="btn dark" id="feed">Yiyecek Dağıt (${S.food})</button></div></div><div class="head"><b>Pazar</b><span class="${S.market>=1?'market-up':'market-down'}">x${S.market.toFixed(2)}</span></div><div class="card"><small>10 yiyecek al veya değişken fiyattan sat.</small><div class="row" style="margin-top:6px"><button class="btn" id="buyFood">Satın Al</button><button class="btn dark" id="sellFood">Sat</button></div></div><div class="head"><b>Borsa</b><span>${S.stock} hisse · ${fmt(S.stockPrice)}</span></div><div class="card row"><button class="btn" id="stockBuy">Hisse Al</button><button class="btn dark" id="stockSell">Hisse Sat</button></div>`}
function exploreHTML(){const remain=S.expedition?Math.max(0,Math.ceil((S.expedition.end-Date.now())/1000)):0;return`<div class="head"><b>Keşif Ekibi</b><span>${S.expedition?remain+' sn':'Hazır'}</span></div><div class="card"><small>Ekibini kaynak, araştırma ve nadir koleksiyonlar için gönder.</small><button class="btn" style="width:100%;margin-top:6px" id="expedition" ${S.expedition?'disabled':''}>Keşfe Gönder</button></div><div class="head"><b>Sandık</b><span>${Date.now()<S.chestAt?Math.ceil((S.chestAt-Date.now())/1000)+' sn':'Hazır'}</span></div><button class="btn alt" style="width:100%" id="chest" ${Date.now()<S.chestAt?'disabled':''}>Sandığı Aç</button><div class="head"><b>Kayıp Teknoloji</b><span>Mini bulmaca</span></div><button class="btn dark" style="width:100%" id="puzzle" ${Date.now()<S.puzzleAt?'disabled':''}>Bulmacayı Çöz</button><div class="head"><b>Koleksiyon</b><span>${S.collection.length} parça</span></div><div class="list">${S.collection.length?S.collection.map(x=>`<div class="card">◆ ${x}</div>`).join(''):'<div class="lock">Henüz keşif yok</div>'}</div>`}
function metaHTML(){return`<div class="head"><b>Araştırma</b><span>${S.rp} puan</span></div><div class="list">${[['prod','Üretim Bilimi','Tüm üretim +%15',3],['crit','Şans Teorisi','Kritik şans +%5',4],['offline','Uyku Modu','AFK sınırı 8 saat',5]].map(r=>`<div class="card row"><div><b>${r[1]}</b><small>${r[2]}</small></div><button class="btn" data-res="${r[0]}" data-cost="${r[3]}" ${S.research.includes(r[0])||S.rp<r[3]?'disabled':''}>${S.research.includes(r[0])?'Açık':r[3]}</button></div>`).join('')}</div><div class="head"><b>Evrim</b><span>${S.evolution.length}/${Math.max(1,S.prestiges)}</span></div><div class="list">${EVOS.map((e,i)=>`<div class="card row"><div><b>${e[0]}</b><small>${e[1]}</small></div><button class="btn dark" data-evo="${i}" ${S.evolution.includes(i)||S.evolution.length>=Math.max(1,S.prestiges)?'disabled':''}>Seç</button></div>`).join('')}</div><div class="head"><b>Laboratuvar</b><span>${S.lab.length} keşif</span></div><button class="btn alt" style="width:100%" id="lab" ${S.rp<5?'disabled':''}>5 Puanla Birleştir</button><div class="head"><b>Dünyalar</b><span>${WORLDS[S.world][1]} ${WORLDS[S.world][0]}</span></div><div class="choices">${S.worlds.map(i=>`<div class="choice ${S.world===i?'active':''}" data-world="${i}"><b>${WORLDS[i][1]} ${WORLDS[i][0]}</b><small>${WORLDS[i][2]}</small></div>`).join('')}</div><div class="head"><b>Görünüm</b><span>${SKINS[S.skin][0]}</span></div><div class="choices">${SKINS.map((s,i)=>`<div class="choice ${S.skin===i?'active':''}" data-skin="${i}"><b>${s[1]} ${s[0]}</b></div>`).join('')}</div><div class="head"><b>Haftalık Lig</b><span>${fmt(S.leagueScore)} puan</span></div><div class="card"><small>Simüle sıralama: ${S.leagueScore>50000?'İlk %1':S.leagueScore>10000?'İlk %10':'Bronz Lig'}</small></div><div class="head"><b>İttifak Mega Projesi</b><span>${fmt(S.alliance)} / 100K</span></div><button class="btn dark" style="width:100%" id="alliance">Katkı Yap</button>`}
function bindPane(){const on=(id,fn)=>{const x=$(id);if(x)x.onclick=fn};on('festival',()=>{const c=Math.max(20,A[S.age].base*50);if(S.res<c)return;S.res-=c;S.happiness=clamp(S.happiness+20,0,100);render()});on('feed',()=>{if(S.food<5)return;S.food-=5;S.happiness=clamp(S.happiness+12,0,100);render()});on('buyFood',()=>trade(true));on('sellFood',()=>trade(false));on('stockBuy',()=>stockTrade(true));on('stockSell',()=>stockTrade(false));on('expedition',expedition);on('chest',chest);on('puzzle',puzzle);on('lab',labCombine);on('alliance',allianceContribute);document.querySelectorAll('[data-res]').forEach(x=>x.onclick=()=>research(x.dataset.res,+x.dataset.cost));document.querySelectorAll('[data-evo]').forEach(x=>x.onclick=()=>evolve(+x.dataset.evo));document.querySelectorAll('[data-world]').forEach(x=>x.onclick=()=>{S.world=+x.dataset.world;render()});document.querySelectorAll('[data-skin]').forEach(x=>x.onclick=()=>{S.skin=+x.dataset.skin;document.documentElement.style.setProperty('--ac',['#8d7cff','#d48544','#c44cff','#6b8cff'][S.skin]);render()})}
function openModal(t,b){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1900)}
function beep(f=440,d=.05){if(!S.sound)return;try{audio=audio||new(AudioContext||webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch{}}
function offline(){const now=Date.now(),limit=researchBonus('offline')?28800:14400,sec=Math.min(limit,Math.max(0,(now-(S.last||now))/1000)),gain=stats().income*sec;if(gain>1){earn(gain);setTimeout(()=>toast('Çevrimdışı +'+fmt(gain)),300)}S.last=now}
function loop(now){const dt=Math.min(.5,(now-last)/1000);last=now;earn(stats().income*dt);S.happiness=clamp(S.happiness-dt*(S.pop>20?.015:.006)*(S.evolution.includes(2)?.55:1),20,100);eventTick();weatherTick();marketTick();expeditionTick();checkQuests();if(now-lastUI>400){render();lastUI=now}requestAnimationFrame(loop)}
$('action').onclick=()=>{const st=stats(),crit=Math.random()<st.crit;earn(st.click*(crit?5:1));S.clicks++;if(crit)toast('KRİTİK x5');beep(360,.025);render()};$('advance').onclick=advance;$('prestige').onclick=prestige;$('eventBtn').onclick=takeEvent;$('save').onclick=()=>save(true);$('sound').onclick=()=>{S.sound=!S.sound;render()};$('modalClose').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));t.classList.add('active');$('pane-'+t.dataset.tab).classList.add('active')});addEventListener('beforeunload',()=>save());setInterval(()=>save(),10000);offline();ensureQuests();S.eventAt=S.eventAt||Date.now()+30000;S.weatherAt=S.weatherAt||Date.now()+30000;S.marketAt=S.marketAt||Date.now()+20000;render();requestAnimationFrame(loop);
</script></body></html>
